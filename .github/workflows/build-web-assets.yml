name: Build optimized web assets

on:
  push:
    branches:
      - main
      - perf/fast-startup-20261118
    paths:
      - "index.html"
      - "code-intelligence.js"
      - "pest-crm-module.js"
      - "financial-module.js"
      - "capacitor-bridge.js"
      - "firebase-messaging-sw.js"
      - "assets/**"
      - "scripts/build-web.mjs"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/build-web-assets.yml"

permissions:
  contents: write

concurrency:
  group: pest-platform-web-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Compile application for production
        run: npm run build:web
      - name: Commit deploy-ready static assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-dist
          if git diff --cached --quiet; then
            echo "Optimized web assets are already up to date."
          else
            git commit -m "Build optimized web assets"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to publish optimized assets after three synchronized attempts."
                exit 1
              fi
              echo "Branch advanced during asset publishing; rebasing and rebuilding before retry."
              git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              npm run build:web
              git add web-dist
              git commit --amend --no-edit
            done
          fi
