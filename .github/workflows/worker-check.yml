name: Cloudflare Worker syntax check

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/worker.js"
      - "cloudflare/origin.js"
      - "financial-api.js"
      - "financial-module.js"
      - "code-intelligence.js"
      - "tests/**"
      - "scripts/build-mobile.mjs"
      - "scripts/build-web.mjs"
      - "package.json"
      - "firebase-messaging-sw.js"
      - "firebase-rules/**"
      - "index.html"
      - "wrangler.jsonc"
      - ".github/scripts/check-app-babel.mjs"
      - ".github/workflows/worker-check.yml"
  pull_request:
    paths:
      - "tests/**"
      - "cloudflare/worker.js"
      - "financial-api.js"
      - "financial-module.js"
      - "firebase-rules/**"
      - "scripts/build-mobile.mjs"
      - "index.html"
      - "wrangler.jsonc"
      - ".github/scripts/check-app-babel.mjs"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install JSX parser
        run: npm install --no-save @babel/parser
      - name: Validate Worker JavaScript syntax
        run: |
          node --input-type=module --check < cloudflare/worker.js
          node --check cloudflare/origin.js
          node --check financial-api.js
          node --check financial-module.js
          node --check scripts/build-mobile.mjs
          node --check scripts/build-web.mjs
      - name: Run financial accounting tests
        run: node --test tests/*.test.mjs
      - name: Build optimized web assets
        run: npm run build:web
      - name: Bundle Worker with Wrangler (dry run only)
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
      - name: Deploy Worker to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
            {
              echo "### Cloudflare Worker deployment skipped"
              echo "Add repository secrets `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`, then rerun this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4 deploy
          {
            echo "### Cloudflare Worker deployment"
            echo "Wrangler deploy completed successfully for `pest-platform`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Firebase Messaging service worker syntax
        run: node --check firebase-messaging-sw.js
      - name: Validate React and JSX syntax
        run: node .github/scripts/check-app-babel.mjs
