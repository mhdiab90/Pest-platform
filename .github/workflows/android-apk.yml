name: Build Pest Platform Android APK

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'fix/*'
    paths:
      - "index.html"
      - "pest-crm-module.js"
      - "capacitor-bridge.js"
      - "capacitor-bridge.mjs"
      - "capacitor.config.json"
      - "google-services.json"
      - "firebase-messaging-sw.js"
      - "package.json"
      - "scripts/build-mobile.mjs"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Check application modules
        run: |
          node --check pest-crm-module.js
          node --check capacitor-bridge.mjs
          node --check scripts/build-mobile.mjs
          node -e "const c=require('./google-services.json'); if(c.project_info.project_id!=='pest-plat-form'||c.client?.[0]?.client_info?.android_client_info?.package_name!=='com.mhdiab90.pestplatform') process.exit(1);"
          node .github/scripts/check-app-babel.mjs

      - name: Prepare local web assets
        run: npm run build:mobile

      - name: Add Android project and sync plugins
        run: |
          npx cap add android
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          npx cap sync android

      - name: Configure stable Android debug signing and version
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "Stable Android debug signing key loaded."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured; this APK will use a temporary runner debug key and may not update an installed build."
          fi
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pest-platform-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
