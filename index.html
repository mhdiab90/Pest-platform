if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const {useState,useEffect,useRef} = React;

const words = {
  ar: {

    inbox:'صندوق الوارد', approve:'موافقة', reject:'رفض', changePhoto:'تغيير الصورة الشخصية',
    sendReset:'إرسال رابط تغيير كلمة المرور إلى البريد', currentPassword:'كلمة المرور الحالية', newPassword:'كلمة المرور الجديدة',

    notActive:'الحساب غير مفعل أو تم تعطيله. تواصل مع مدير النظام.',
    invalidLogin:'البريد الإلكتروني أو كلمة المرور غير صحيحة.', emailInUse:'هذا البريد مسجل بالفعل.',
    weakPassword:'كلمة المرور ضعيفة؛ استخدم 6 أحرف على الأقل.', invalidEmail:'صيغة البريد الإلكتروني غير صحيحة.',
    network:'تعذر الاتصال. تحقق من الإنترنت ثم حاول مرة أخرى.', permission:'Firebase رفض العملية بسبب قواعد الصلاحيات. راجع Database Rules.',
    generic:'حدث خطأ غير متوقع: ', sentReset:'تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك.',
    saved:'تم الحفظ بنجاح.', projectStatus:'جاري', projectAdded:'تمت إضافة المشروع.', accountCreated:'تم إنشاء طلب الحساب.',

    recipientsNotFound:'لم يتم العثور على المستخدمين التاليين: ', authRequired:'يجب تسجيل الدخول أولاً.',
    company:'اسم الشركة', signInHint:'استخدم البريد الإلكتروني وكلمة المرور المسجلين في النظام.',
    registrationHint:'سيتم إنشاء حساب دخول وإرسال طلب موافقة للمدير. لن تتمكن من استخدام النظام قبل الموافقة.',
    profile:'الملف الشخصي', adminOnly:'هذه الوظيفة متاحة لمدير النظام فقط.',
    noAccount:'لا يوجد ملف مستخدم نشط لهذا الحساب.'
  },
  en: {
    app:'Projects & Cash Flow Management', login:'Sign in', email:'Email address', password:'Password',
    username:'Username', fullName:'Full name', jobTitle:'Job title / Department', loginBtn:'Sign in',
    createRequest:'Request a new account', register:'Submit account request', language:'العربية', forgot:'Forgot password?',
    loading:'Verifying...', dashboard:'Dashboard', statement:'Account statement', master:'Master data',
    projects:'Projects', messages:'Messages', profile:'Profile', logout:'Sign out',
    clients:'Clients', vendors:'Vendors', users:'Users', pending:'Pending requests', activity:'Activity log',
    accountType:'Account type', client:'Client', vendor:'Vendor', selectAccount:'Select account', due:'Total due',
    paid:'Total paid / collected', remaining:'Remaining balance', code:'Code', name:'Name', phone:'Phone',
    add:'Add', save:'Save', projectCode:'Project code', projectName:'Project name', projectClient:'Client',
    amount:'Amount', status:'Status', choose:'Choose...', noData:'No data available', noLogs:'No activity recorded',
    newMessage:'New message', recipients:'Usernames separated by commas', subject:'Subject', body:'Message', send:'Send',
    inbox:'Inbox', approve:'Approve', reject:'Reject', changePhoto:'Change profile picture',
    sendReset:'Email a password reset link', currentPassword:'Current password', newPassword:'New password',
    savePassword:'Change password', requestSent:'Request submitted. Wait for administrator approval.', pendingApproval:'Your account is awaiting administrator approval.',
    profileMissing:'Authentication account exists, but its user profile is missing. Contact the administrator.',
    notActive:'This account is not active or has been disabled. Contact the administrator.',
    invalidLogin:'Incorrect email address or password.', emailInUse:'This email is already registered.',
    weakPassword:'Password is too weak; use at least 6 characters.', invalidEmail:'Invalid email address.',
    network:'Connection failed. Check your internet connection and try again.', permission:'Firebase denied this operation. Check the database security rules.',
    generic:'Unexpected error: ', sentReset:'A password reset link has been sent to your email.',
    saved:'Saved successfully.', projectStatus:'In progress', projectAdded:'Project added.', accountCreated:'Account request created.',
    noMessages:'No messages.', noProjects:'No projects.', loginFirst:'Please sign in first.',
    oldPasswordRequired:'Enter your current password first.', passwordChanged:'Password changed.',
    recipientsNotFound:'These users were not found: ', authRequired:'Please sign in first.',
    company:'Company name', signInHint:'Use the email address and password registered in the system.',
    registrationHint:'A sign-in account and an approval request will be created. You cannot use the system before approval.',
    profile:'Profile', adminOnly:'This action is available to the administrator only.',
    noAccount:'No active user profile is linked to this account.'
  }
};

function App(){
  const [lang,setLang] = useState(()=>localStorage.getItem('pestLang') || 'ar');
  const tr = key => words[lang][key] || key;
  const rtl = lang === 'ar';
  const [currentUser,setCurrentUser] = useState(null);
  const [authReady,setAuthReady] = useState(false);
  const [busy,setBusy] = useState(false);
  const [view,setView] = useState('login');
  const [authError,setAuthError] = useState('');
  const [authSuccess,setAuthSuccess] = useState('');
  const registrationInProgress = useRef(false);

  const [login,setLogin] = useState({email:'',password:''});
  const [request,setRequest] = useState({email:'',password:'',username:'',fullName:'',jobTitle:''});
  const [companyInfo,setCompanyInfo] = useState({name:rtl?'اسم الشركة':'Company name',logo:''});
  const [userRequests,setUserRequests] = useState([]);
  const [activeUsers,setActiveUsers] = useState([]);
  const [clients,setClients] = useState([]);
  const [vendors,setVendors] = useState([]);
  const [quotes,setQuotes] = useState([]);
  const [projects,setProjects] = useState([]);
  const [inflows,setInflows] = useState([]);
  const [outflows,setOutflows] = useState([]);
  const [logs,setLogs] = useState([]);
  const [messages,setMessages] = useState([]);
  const [tab,setTab] = useState('dashboard');
  const [showRequests,setShowRequests] = useState(false);
  const [account,setAccount] = useState({type:'client',code:''});
  const [master,setMaster] = useState({type:'client',code:'',name:'',phone:''});
  const [project,setProject] = useState({code:'',name:'',clientCode:'',amount:'',status:'جاري'});
  const [message,setMessage] = useState({recipients:'',subject:'',body:''});
  const [newPassword,setNewPassword] = useState('');
  const [currentPassword,setCurrentPassword] = useState('');

  useEffect(()=>{
    document.documentElement.lang = lang;
    document.documentElement.dir = rtl ? 'rtl' : 'ltr';
    localStorage.setItem('pestLang',lang);
  },[lang]);

  // Authentication is checked first. No database read is attempted before a user signs in.
  useEffect(()=>{
    let mounted = true;
    const unsubscribe = auth.onAuthStateChanged(async fbUser=>{
      if(!mounted) return;
      if(registrationInProgress.current) return;
      if(!fbUser){
        setCurrentUser(null);
        setAuthReady(true);
        return;
      }
      try{
        const snap = await db.ref('users/'+fbUser.uid).once('value');
        const profile = snap.val();
        if(!profile){
          const reqSnap = await db.ref('userRequests/'+fbUser.uid).once('value').catch(()=>null);
          const req = reqSnap && reqSnap.val();
          setAuthError(req && req.status==='rejected' ? (rtl?'تم رفض طلب الحساب. تواصل مع المدير.':'Your account request was rejected. Contact the administrator.') : (req ? tr('pendingApproval') : tr('profileMissing')));
          await auth.signOut();
          return;
        }
        const state = String(profile.status || '').toLowerCase();
        if(!['active','نشط','مفعل','enabled'].includes(state)){
          setAuthError(tr('notActive'));
          await auth.signOut();
          return;
        }
        setCurrentUser({...profile,uid:fbUser.uid,email:fbUser.email || profile.email || ''});
        setAuthError('');
      }catch(err){
        console.error('Load user profile:',err);
        setAuthError(firebaseErrorMessage(err,tr));
        await auth.signOut().catch(()=>{});
      }finally{
        if(mounted){setAuthReady(true);setBusy(false);}
      }
    });
    return ()=>{mounted=false;unsubscribe();};
  },[]);

  // Subscribe only after Firebase Authentication and the active profile are confirmed.
  useEffect(()=>{
    if(!currentUser) return;
    const refs=[];
    const watch=(path,handler)=>{
      const ref=db.ref(path);
      ref.on('value',handler,err=>console.error('Database listener '+path,err));
      refs.push({ref,handler});
    };
    watch('companyInfo',s=>setCompanyInfo(s.val() || {name:tr('company'),logo:''}));
    watch('clients',s=>setClients(toArray(s.val())));
    watch('vendors',s=>setVendors(toArray(s.val())));
    watch('quotes',s=>setQuotes(toArray(s.val())));
    watch('projects',s=>setProjects(toArray(s.val())));
    watch('inflows',s=>setInflows(toArray(s.val())));
    watch('outflows',s=>setOutflows(toArray(s.val())));
    watch('logs',s=>setLogs(toArray(s.val())));
    watch('messages/'+currentUser.uid,s=>setMessages(toArray(s.val())));
    if(currentUser.role==='admin'){
      watch('users',s=>setActiveUsers(toArray(s.val())));
      watch('userRequests',s=>setUserRequests(toArray(s.val())));
    }else{
      setActiveUsers([]);setUserRequests([]);
    }
    return ()=>refs.forEach(x=>x.ref.off('value',x.handler));
  },[currentUser]);

  function firebaseErrorMessage(err,tfn){
    const code=err && err.code ? err.code : '';
    if(code==='auth/invalid-email') return tfn('invalidEmail');
    if(['auth/user-not-found','auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(code)) return tfn('invalidLogin');
    if(code==='auth/email-already-in-use') return tfn('emailInUse');
    if(code==='auth/weak-password') return tfn('weakPassword');
    if(code==='auth/network-request-failed' || !navigator.onLine) return tfn('network');
    if(code==='PERMISSION_DENIED' || String(err && err.message).toLowerCase().includes('permission')) return tfn('permission');
    return tfn('generic')+(err && err.message ? err.message : 'Unknown error');
  }
  function toArray(obj){return obj ? Object.entries(obj).map(([key,val])=>({...val,id:val && val.id ? val.id : key,uid:val && val.uid ? val.uid : key})) : [];}
  const isAdmin=currentUser && currentUser.role==='admin';
  const money=n=>new Intl.NumberFormat(rtl?'ar-EG':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0));
  const accepted=s=>['مقبول','approved','Approved'].includes(s);
  const collected=s=>['تم التحصيل','collected','Collected'].includes(s);
  const paid=s=>['تم السداد','paid','Paid'].includes(s);

  async function addLog(action){
    if(!currentUser) return;
    const id=db.ref('logs').push().key;
    await db.ref('logs/'+id).set({id,user:currentUser.fullName || currentUser.email,time:new Date().toLocaleString(rtl?'ar-EG':'en-US'),action});
  }

  async function handleLogin(e){
    e.preventDefault();setAuthError('');setAuthSuccess('');setBusy(true);
    try{await auth.signInWithEmailAndPassword(login.email.trim(),login.password);setLogin({email:'',password:''});}
    catch(err){setAuthError(firebaseErrorMessage(err,tr));setBusy(false);}
  }

  async function handleRegister(e){
    e.preventDefault();setAuthError('');setAuthSuccess('');setBusy(true);
    const email=request.email.trim().toLowerCase();
    const username=request.username.trim();
    if(!email || !username || !request.fullName.trim() || !request.jobTitle.trim() || request.password.length<6){
      setAuthError(rtl?'أكمل البيانات وتأكد أن كلمة المرور 6 أحرف على الأقل.':'Complete all fields and use a password of at least 6 characters.');setBusy(false);return;
    }
    registrationInProgress.current=true;
    let credential=null;
    try{
      credential=await auth.createUserWithEmailAndPassword(email,request.password);
      const uid=credential.user.uid;
      await db.ref('userRequests/'+uid).set({
        uid,email,username,fullName:request.fullName.trim(),jobTitle:request.jobTitle.trim(),
        status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP
      });
      await auth.signOut();
      setRequest({email:'',password:'',username:'',fullName:'',jobTitle:''});
      setView('login');setAuthSuccess(tr('requestSent'));
    }catch(err){
      console.error('Account request:',err);
      if(credential && credential.user){
        await credential.user.delete().catch(()=>{});
        await auth.signOut().catch(()=>{});
      }
      setAuthError(firebaseErrorMessage(err,tr));
    }finally{registrationInProgress.current=false;setBusy(false);}
  }

  async function sendPasswordReset(){
    const email=(view==='login'?login.email:request.email).trim();
    if(!email){setAuthError(rtl?'أدخل بريدك الإلكتروني أولاً.':'Enter your email address first.');return;}
    try{await auth.sendPasswordResetEmail(email);setAuthError('');setAuthSuccess(tr('sentReset'));}
    catch(err){setAuthError(firebaseErrorMessage(err,tr));}
  }

  async function logout(){
    try{if(currentUser) await addLog('تسجيل خروج');await auth.signOut();setTab('dashboard');setMessages([]);}
    catch(err){setAuthError(firebaseErrorMessage(err,tr));}
  }

  async function approveRequest(req,approve){
    if(!isAdmin || !req.uid) return;
    try{
      if(approve){
        await db.ref('users/'+req.uid).set({
          uid:req.uid,email:req.email,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,
          role:'user',status:'active',avatar:'',createdAt:firebase.database.ServerValue.TIMESTAMP
        });
        await db.ref('userRequests/'+req.uid+'/status').set('approved');
        await addLog('اعتماد حساب: '+req.fullName);
      }else{
        await db.ref('userRequests/'+req.uid+'/status').set('rejected');
        await addLog('رفض طلب حساب: '+req.fullName);
      }
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function addMaster(e){
    e.preventDefault();
    const path=master.type==='client'?'clients':'vendors';
    const code=master.code.trim();
    if(!code || !master.name.trim()) return alert(tr('noData'));
    if(/[.#$\[\]/]/.test(code)) return alert('The code contains invalid characters: . # $ [ ] /');
    try{
      const ref=db.ref(path+'/'+code);
      const snap=await ref.once('value');
      if(snap.exists()) return alert(rtl?'الكود موجود بالفعل.':'This code already exists.');
      await ref.set({code,name:master.name.trim(),phone:master.phone.trim(),createdAt:firebase.database.ServerValue.TIMESTAMP});
      await addLog('إضافة '+(master.type==='client'?'عميل: ':'مورد: ')+master.name);
      setMaster({...master,code:'',name:'',phone:''});alert(tr('saved'));
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function addProject(e){
    e.preventDefault();
    const code=project.code.trim();
    if(!code || !project.name.trim()) return alert(tr('noData'));
    if(/[.#$\[\]/]/.test(code)) return alert('Invalid project code');
    try{
      const ref=db.ref('projects/'+code);const snap=await ref.once('value');
      if(snap.exists()) return alert(rtl?'كود المشروع موجود بالفعل.':'Project code already exists.');
      await ref.set({...project,code,name:project.name.trim(),amount:Number(project.amount||0),createdAt:firebase.database.ServerValue.TIMESTAMP});
      await addLog('إضافة مشروع: '+project.name);setProject({code:'',name:'',clientCode:'',amount:'',status:'جاري'});alert(tr('projectAdded'));
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function sendMessage(e){
    e.preventDefault();
    if(!isAdmin) return;
    const names=message.recipients.split(',').map(x=>x.trim()).filter(Boolean);
    if(!names.length || !message.subject.trim() || !message.body.trim()) return alert(tr('noData'));
    const missing=[];const tasks=[];
    names.forEach(name=>{
      const found=activeUsers.find(u=>u.email && u.uid && String(u.username||'').toLowerCase()===name.toLowerCase());
      if(!found || !found.uid) missing.push(name);
      else{
        const id=db.ref('messages/'+found.uid).push().key;
        tasks.push(db.ref('messages/'+found.uid+'/'+id).set({id,recipientUid:found.uid,senderUid:currentUser.uid,senderName:currentUser.fullName,subject:message.subject.trim(),body:message.body.trim(),date:new Date().toLocaleString(rtl?'ar-EG':'en-US')}));
      }
    });
    try{
      await Promise.all(tasks);
      if(missing.length) alert(tr('recipientsNotFound')+missing.join(', '));
      else alert(tr('saved'));
      setMessage({recipients:'',subject:'',body:''});await addLog('إرسال رسالة');
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function uploadAvatar(e){
    const file=e.target.files && e.target.files[0];if(!file || !currentUser) return;
    if(file.size>500000){alert(rtl?'اختر صورة أقل من 500 كيلوبايت.':'Choose an image smaller than 500 KB.');return;}
    const reader=new FileReader();
    reader.onload=async()=>{
      try{
        await db.ref('users/'+currentUser.uid+'/avatar').set(reader.result);
        setCurrentUser(old=>({...old,avatar:reader.result}));await addLog('تحديث الصورة الشخصية');
      }catch(err){alert(firebaseErrorMessage(err,tr));}
    };
    reader.readAsDataURL(file);
  }

  async function changePassword(e){
    e.preventDefault();
    if(!currentPassword || !newPassword) return alert(tr('oldPasswordRequired'));
    if(newPassword.length<6) return alert(tr('weakPassword'));
    try{
      const credential=firebase.auth.EmailAuthProvider.credential(auth.currentUser.email,currentPassword);
      await auth.currentUser.reauthenticateWithCredential(credential);
      await auth.currentUser.updatePassword(newPassword);
      setCurrentPassword('');setNewPassword('');alert(tr('passwordChanged'));
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  const pendingRequests=userRequests.filter(r=>r.status==='pending' && r.uid);
  const myMessages=messages;
  const selectedItems=account.type==='client'?clients:vendors;
  const chosen=selectedItems.find(x=>x.code===account.code);
  const totalDue=account.type==='client'
    ? quotes.filter(q=>q.clientCode===account.code && accepted(q.status)).reduce((s,x)=>s+Number(x.amount||0),0)
    : outflows.filter(x=>x.vendorCode===account.code).reduce((s,x)=>s+Number(x.amount||0),0);
  const totalPaid=account.type==='client'
    ? inflows.filter(x=>x.clientCode===account.code && collected(x.status)).reduce((s,x)=>s+Number(x.amount||0),0)
    : outflows.filter(x=>x.vendorCode===account.code && paid(x.status)).reduce((s,x)=>s+Number(x.amount||0),0);

  const nav=[['dashboard','fa-gauge'],['statement','fa-file-invoice-dollar'],['master','fa-database'],['projects','fa-diagram-project'],['messages','fa-envelope'],['profile','fa-user-gear']];

  if(!currentUser){
    return <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
      <div className="absolute top-4 left-4"><button onClick={()=>setLang(rtl?'en':'ar')} className="bg-white text-slate-900 px-4 py-2 rounded-lg font-bold">{tr('language')}</button></div>
      <div className="w-full max-w-md bg-white rounded-2xl shadow-2xl p-7">
        <div className="text-center mb-6"><div className="w-16 h-16 rounded-full bg-blue-600 text-white grid place-items-center mx-auto mb-3 text-2xl"><i className="fas fa-building"></i></div>
          <h1 className="text-xl font-bold text-slate-800">{tr('app')}</h1><p className="text-sm text-gray-500 mt-2">{companyInfo.name}</p></div>
        {authError && <div className="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg mb-3 text-sm">{authError}</div>}
        {authSuccess && <div className="bg-green-50 border border-green-200 text-green-700 p-3 rounded-lg mb-3 text-sm">{authSuccess}</div>}
        {!authReady && <div className="text-center text-sm text-gray-500 mb-3"><i className="fas fa-spinner fa-spin mr-2"></i>{tr('loading')}</div>}
        {view==='login'?<>
          <p className="text-sm text-gray-500 mb-4">{tr('signInHint')}</p>
          <form onSubmit={handleLogin} className="space-y-3">
            <label className="block text-sm font-bold">{tr('email')}<input type="email" autoComplete="username" required className="mt-1 w-full border rounded-lg p-3 font-normal" value={login.email} onChange={e=>setLogin({...login,email:e.target.value})}/></label>
            <label className="block text-sm font-bold">{tr('password')}<input type="password" autoComplete="current-password" required className="mt-1 w-full border rounded-lg p-3 font-normal" value={login.password} onChange={e=>setLogin({...login,password:e.target.value})}/></label>
            <button disabled={busy || !authReady} className="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-3 font-bold">{busy?tr('loading'):tr('loginBtn')}</button>
          </form>
          <button onClick={sendPasswordReset} className="text-sm text-blue-600 hover:underline mt-3">{tr('forgot')}</button>
          <div className="border-t mt-5 pt-4 text-center"><button onClick={()=>{setView('register');setAuthError('');setAuthSuccess('');}} className="text-blue-600 font-bold text-sm">{tr('createRequest')}</button></div>
        </>:<>
          <p className="text-sm text-gray-500 mb-4">{tr('registrationHint')}</p>
          <form onSubmit={handleRegister} className="space-y-3">
            <input required type="text" placeholder={tr('fullName')} className="w-full border rounded-lg p-3" value={request.fullName} onChange={e=>setRequest({...request,fullName:e.target.value})}/>
            <input required type="text" placeholder={tr('jobTitle')} className="w-full border rounded-lg p-3" value={request.jobTitle} onChange={e=>setRequest({...request,jobTitle:e.target.value})}/>
            <input required type="text" placeholder={tr('username')} className="w-full border rounded-lg p-3" value={request.username} onChange={e=>setRequest({...request,username:e.target.value})}/>
            <input required type="email" placeholder={tr('email')} className="w-full border rounded-lg p-3" value={request.email} onChange={e=>setRequest({...request,email:e.target.value})}/>
            <input required minLength="6" type="password" placeholder={tr('password')} className="w-full border rounded-lg p-3" value={request.password} onChange={e=>setRequest({...request,password:e.target.value})}/>
            <button disabled={busy} className="w-full bg-green-600 hover:bg-green-700 text-white rounded-lg p-3 font-bold">{busy?tr('loading'):tr('register')}</button>
          </form>
          <button onClick={()=>{setView('login');setAuthError('');}} className="w-full mt-3 bg-gray-100 rounded-lg p-3 text-sm">{rtl?'عودة لتسجيل الدخول':'Back to sign in'}</button>
        </>}
      </div>
    </div>;
  }

  return <div className="min-h-screen flex flex-col bg-gray-100">
    <header className="bg-slate-900 text-white p-3 px-5 flex justify-between items-center gap-3">
      <div className="flex items-center gap-3"><i className="fas fa-cubes text-blue-400 text-2xl"></i><div><h1 className="font-bold">{companyInfo.name || tr('app')}</h1><p className="text-xs text-slate-400">{tr('app')}</p></div></div>
      <div className="flex items-center gap-3">
        <button onClick={()=>setLang(rtl?'en':'ar')} className="bg-slate-700 px-3 py-2 rounded-lg text-sm">{tr('language')}</button>
        <button onClick={()=>setTab('messages')} className="relative"><i className="fas fa-envelope text-xl"></i>{myMessages.length>0&&<span className="absolute -top-2 -right-2 rounded-full bg-blue-600 text-xs px-1.5">{myMessages.length}</span>}</button>
        {isAdmin&&<div className="relative"><button onClick={()=>setShowRequests(!showRequests)} className="relative"><i className="fas fa-bell text-xl"></i>{pendingRequests.length>0&&<span className="absolute -top-2 -right-2 rounded-full bg-red-600 text-xs px-1.5">{pendingRequests.length}</span>}</button>
          {showRequests&&<div className="absolute top-9 right-0 z-50 w-80 bg-white text-slate-800 rounded-xl shadow-xl p-4"><h3 className="font-bold border-b pb-2">{tr('pending')} ({pendingRequests.length})</h3><div className="max-h-72 overflow-auto space-y-3 mt-3">
            {pendingRequests.length===0&&<p className="text-sm text-gray-500">{tr('noData')}</p>}
            {pendingRequests.map(req=><div key={req.uid} className="border rounded-lg p-3 text-sm"><p className="font-bold">{req.fullName}</p><p>{req.email}</p><p className="text-gray-500">{req.jobTitle} · {req.username}</p><div className="flex gap-2 mt-2"><button onClick={()=>approveRequest(req,true)} className="bg-green-600 text-white rounded px-3 py-1 flex-1">{tr('approve')}</button><button onClick={()=>approveRequest(req,false)} className="bg-red-600 text-white rounded px-3 py-1 flex-1">{tr('reject')}</button></div></div>)}
          </div></div>}</div>}
        <div className="hidden sm:block text-right"><p className="font-bold text-sm">{currentUser.fullName}</p><p className="text-xs text-green-300">{currentUser.jobTitle}</p></div>
        <button onClick={logout} title={tr('logout')} className="text-red-300"><i className="fas fa-power-off text-xl"></i></button>
      </div>
    </header>
    <div className="flex flex-1 flex-col md:flex-row">
      <aside className="w-full md:w-60 bg-white border-gray-200 p-3 space-y-1">
        {nav.map(([id,icon])=><button key={id} onClick={()=>setTab(id)} className={`nav-btn ${tab===id?'active':''} w-full text-start p-3 rounded-lg flex items-center gap-3`}><i className={`fas ${icon} w-5`}></i><span>{tr(id)}</span></button>)}
      </aside>
      <main className="flex-1 p-4 md:p-6 overflow-auto">
        {tab==='dashboard'&&<div className="space-y-5"><h2 className="font-bold text-xl">{tr('dashboard')}</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            {[[tr('clients'),clients.length,'fa-user-tie'],[tr('vendors'),vendors.length,'fa-truck'],[tr('projects'),projects.length,'fa-diagram-project'],[tr('users'),isAdmin?activeUsers.length:'—','fa-users']].map(([label,value,icon])=><div key={label} className="bg-white p-5 rounded-xl border shadow-sm flex justify-between items-center"><div><p className="text-sm text-gray-500">{label}</p><p className="text-2xl font-bold mt-1">{value}</p></div><i className={`fas ${icon} text-2xl text-blue-500`}></i></div>)}
          </div>
          <section className="bg-white p-5 rounded-xl border shadow-sm"><h3 className="font-bold border-b pb-3 mb-3">{tr('activity')}</h3>{logs.length===0?<p className="text-sm text-gray-500">{tr('noLogs')}</p>:logs.slice().reverse().map(x=><div key={x.id} className="py-2 border-b text-sm flex flex-wrap justify-between gap-2"><b className="text-blue-700">{x.user}: {x.action}</b><span className="text-gray-400">{x.time}</span></div>)}</section>
        </div>}

        {tab==='statement'&&<section className="bg-white rounded-xl border shadow-sm p-5 space-y-5"><h2 className="font-bold text-lg">{tr('statement')}</h2><div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
          <label className="text-sm font-bold">{tr('accountType')}<select className="block w-full border rounded-lg p-3 mt-1" value={account.type} onChange={e=>setAccount({type:e.target.value,code:''})}><option value="client">{tr('client')}</option><option value="vendor">{tr('vendor')}</option></select></label>
          <label className="text-sm font-bold">{tr('selectAccount')}<select className="block w-full border rounded-lg p-3 mt-1" value={account.code} onChange={e=>setAccount({...account,code:e.target.value})}><option value="">{tr('choose')}</option>{selectedItems.map(x=><option key={x.code} value={x.code}>{x.name} ({x.code})</option>)}</select></label>
        </div>
        {chosen&&<div className="grid grid-cols-1 md:grid-cols-3 gap-4">{[[tr('due'),totalDue,'blue'],[tr('paid'),totalPaid,'green'],[tr('remaining'),totalDue-totalPaid,'amber']].map(([label,value,color])=><div key={label} className={`bg-${color}-50 border-r-4 border-${color}-600 p-4 rounded`}><p className="text-sm text-gray-500 font-bold">{label}</p><p className="text-2xl font-bold mt-2">{money(value)} EGP</p></div>)}</div>}
        </section>}

        {tab==='master'&&<div className="space-y-5"><h2 className="font-bold text-xl">{tr('master')}</h2><section className="bg-white p-5 rounded-xl border shadow-sm"><form onSubmit={addMaster} className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <select className="border rounded-lg p-3" value={master.type} onChange={e=>setMaster({...master,type:e.target.value})}><option value="client">{tr('client')}</option><option value="vendor">{tr('vendor')}</option></select>
          <input required className="border rounded-lg p-3" placeholder={tr('code')} value={master.code} onChange={e=>setMaster({...master,code:e.target.value})}/>
          <input required className="border rounded-lg p-3" placeholder={tr('name')} value={master.name} onChange={e=>setMaster({...master,name:e.target.value})}/>
          <input className="border rounded-lg p-3" placeholder={tr('phone')} value={master.phone} onChange={e=>setMaster({...master,phone:e.target.value})}/>
          <button className="md:col-span-2 bg-blue-600 text-white rounded-lg p-3 font-bold"><i className="fas fa-plus mx-2"></i>{tr('add')}</button>
        </form></section>
        <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">{[[tr('clients'),clients],[tr('vendors'),vendors]].map(([label,list])=><section key={label} className="bg-white p-5 rounded-xl border"><h3 className="font-bold border-b pb-2 mb-2">{label}</h3><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-gray-50"><th className="p-2">{tr('code')}</th><th className="p-2">{tr('name')}</th><th className="p-2">{tr('phone')}</th></tr></thead><tbody>{list.map(x=><tr key={x.code} className="border-t"><td className="p-2">{x.code}</td><td className="p-2">{x.name}</td><td className="p-2">{x.phone}</td></tr>)}</tbody></table></div>{list.length===0&&<p className="text-sm text-gray-500 mt-3">{tr('noData')}</p>}</section>)}</div></div>}

        {tab==='projects'&&<div className="space-y-5"><h2 className="font-bold text-xl">{tr('projects')}</h2><section className="bg-white p-5 rounded-xl border"><form onSubmit={addProject} className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input required className="border rounded-lg p-3" placeholder={tr('projectCode')} value={project.code} onChange={e=>setProject({...project,code:e.target.value})}/>
          <input required className="border rounded-lg p-3" placeholder={tr('projectName')} value={project.name} onChange={e=>setProject({...project,name:e.target.value})}/>
          <select className="border rounded-lg p-3" value={project.clientCode} onChange={e=>setProject({...project,clientCode:e.target.value})}><option value="">{tr('choose')}</option>{clients.map(c=><option key={c.code} value={c.code}>{c.name}</option>)}</select>
          <input type="number" min="0" className="border rounded-lg p-3" placeholder={tr('amount')} value={project.amount} onChange={e=>setProject({...project,amount:e.target.value})}/>
          <button className="md:col-span-2 bg-blue-600 text-white rounded-lg p-3 font-bold">{tr('add')}</button>
        </form></section><section className="bg-white p-5 rounded-xl border overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-gray-50"><th className="p-2">{tr('projectCode')}</th><th className="p-2">{tr('projectName')}</th><th className="p-2">{tr('projectClient')}</th><th className="p-2">{tr('amount')}</th><th className="p-2">{tr('status')}</th></tr></thead><tbody>{projects.map(p=><tr key={p.id} className="border-t"><td className="p-2">{p.code}</td><td className="p-2">{p.name}</td><td className="p-2">{clients.find(c=>c.code===p.clientCode)?.name||p.clientCode}</td><td className="p-2">{money(p.amount)}</td><td className="p-2">{p.status}</td></tr>)}</tbody></table>{projects.length===0&&<p className="text-sm text-gray-500 mt-3">{tr('noProjects')}</p>}</section></div>}

        {tab==='messages'&&<div className="space-y-5"><h2 className="font-bold text-xl">{tr('messages')}</h2>{isAdmin&&<section className="bg-white p-5 rounded-xl border"><h3 className="font-bold mb-3">{tr('newMessage')}</h3><form onSubmit={sendMessage} className="space-y-3"><input required className="w-full border rounded-lg p-3" placeholder={tr('recipients')} value={message.recipients} onChange={e=>setMessage({...message,recipients:e.target.value})}/><input required className="w-full border rounded-lg p-3" placeholder={tr('subject')} value={message.subject} onChange={e=>setMessage({...message,subject:e.target.value})}/><textarea required rows="4" className="w-full border rounded-lg p-3" placeholder={tr('body')} value={message.body} onChange={e=>setMessage({...message,body:e.target.value})}></textarea><button className="bg-blue-600 text-white rounded-lg px-6 py-3 font-bold">{tr('send')}</button></form></section>}
          <section className="bg-white p-5 rounded-xl border"><h3 className="font-bold border-b pb-3 mb-3">{tr('inbox')}</h3>{myMessages.length===0?<p className="text-sm text-gray-500">{tr('noMessages')}</p>:myMessages.slice().reverse().map(m=><article key={m.id} className="border rounded-lg p-4 mb-3"><div className="flex justify-between gap-2"><b className="text-blue-700">{m.subject}</b><span className="text-xs text-gray-400">{m.date}</span></div><p className="text-xs text-gray-500 mt-1">{m.senderName}</p><p className="mt-3 text-sm whitespace-pre-wrap">{m.body}</p></article>)}</section></div>}

        {tab==='profile'&&<section className="bg-white p-5 rounded-xl border shadow-sm max-w-xl space-y-5"><h2 className="font-bold text-lg">{tr('profile')}</h2><div className="flex items-center gap-4">{currentUser.avatar?<img src={currentUser.avatar} className="w-20 h-20 rounded-full object-cover"/>:<div className="w-20 h-20 rounded-full bg-slate-800 text-white grid place-items-center text-2xl">{(currentUser.fullName||'?').charAt(0)}</div>}<div><b>{currentUser.fullName}</b><p className="text-sm text-gray-500">{currentUser.email}</p><label className="inline-block mt-2 bg-blue-600 text-white rounded-lg px-3 py-2 text-sm cursor-pointer">{tr('changePhoto')}<input type="file" accept="image/*" className="hidden" onChange={uploadAvatar}/></label></div></div>
          <form onSubmit={changePassword} className="border-t pt-4 space-y-3"><h3 className="font-bold">{tr('savePassword')}</h3><input type="password" required className="w-full border rounded-lg p-3" placeholder={tr('currentPassword')} value={currentPassword} onChange={e=>setCurrentPassword(e.target.value)}/><input type="password" minLength="6" required className="w-full border rounded-lg p-3" placeholder={tr('newPassword')} value={newPassword} onChange={e=>setNewPassword(e.target.value)}/><button className="bg-green-600 text-white rounded-lg px-5 py-3 font-bold">{tr('savePassword')}</button></form>
        </section>}
      </main>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
