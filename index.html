const PEST_CRM_MODULE_BUILD='20261124-crm-dropdown-portal-v2';
function PestCrmModuleSlot(props){
  const [PestCrmModule,setPestCrmModule]=useState(()=>window.PEST_CRM_MODULE||null);
  const [loadError,setLoadError]=useState('');
  useEffect(()=>{
    if(window.PEST_CRM_MODULE){setPestCrmModule(()=>window.PEST_CRM_MODULE);return;}
    let active=true;
    const script=document.createElement('script');
    script.src=new URL('./pest-crm-module.js?v='+PEST_CRM_MODULE_BUILD,window.location.href).href;
    script.async=true;
    script.onload=()=>{
      if(!active)return;
      if(typeof window.PEST_CRM_MODULE==='function'){
        setPestCrmModule(()=>window.PEST_CRM_MODULE);
        setLoadError('');
      }else setLoadError(props.rtl?'تم تحميل الملف لكن وحدة إدارة العملاء لم تبدأ. أعد تحميل البرنامج.':'The CRM file loaded, but the CRM module did not start. Reload the application.');
    };
    script.onerror=()=>{
      if(active)setLoadError(props.rtl?'تعذر تحميل وحدة إدارة العملاء. تحقق من الاتصال وحاول مرة أخرى.':'Could not load the CRM module. Check your connection and retry.');
    };
    document.head.appendChild(script);
    return ()=>{active=false;script.onload=null;script.onerror=null;};
  },[]);
  if(!PestCrmModule){
    return <section dir={props.rtl?'rtl':'ltr'} className="m-3 rounded-2xl border border-amber-300 bg-amber-50 p-5 text-amber-950 space-y-3">
      <h2 className="font-extrabold text-lg">{props.rtl?'إدارة العملاء والمبيعات':'Customer and sales management'}</h2>
      <p className="text-sm">{loadError||(props.rtl?'جارٍ تحميل وحدة إدارة العملاء...':'Loading the CRM module...')}</p>
      <button type="button" onClick={()=>window.location.reload()} className="rounded-lg bg-amber-700 px-4 py-2 text-white font-bold">{props.rtl?'إعادة تحميل البرنامج':'Reload application'}</button>
    </section>;
  }
  return <PestCrmModule {...props}/>;
}

function FinanceModuleSlot(props){
  const FINANCE_MODULE_BUILD='20261125-finance-value-filter-journal-attachments-v20';
  const [FinanceModule,setFinanceModule]=useState(()=>window.PEST_FINANCE_MODULE||null);
  const [loadError,setLoadError]=useState('');
  useEffect(()=>{
    if(window.PEST_FINANCE_MODULE&&window.PEST_FINANCE_MODULE_VERSION===FINANCE_MODULE_BUILD){
      setFinanceModule(()=>window.PEST_FINANCE_MODULE);
      setLoadError('');
      return;
    }
    let active=true;
    const script=document.createElement('script');
    const language=props.language||(props.rtl?'ar':'en');
    // Resolve the module beside the compiled application bundle, not beside
    // the current route. This prevents nested URLs from producing a bad path.
const appScript=Array.from(document.scripts).find(node=>{
      const filename=String(node.src||'').split('/').pop().split('?')[0].split('#')[0];
      return filename.startsWith('app.')&&filename.endsWith('.js');
    });
    const assetBase=appScript&&appScript.src?appScript.src:(document.baseURI||window.location.href);
    const moduleUrl=new URL('./financial-module.js',assetBase);
    moduleUrl.searchParams.set('v',FINANCE_MODULE_BUILD);
    moduleUrl.searchParams.set('lang',language);
    script.src=moduleUrl.href;
    script.async=true;
    let settled=false;
    const timeoutId=window.setTimeout(()=>{
      if(active&&!settled)setLoadError('استغرق تحميل مكوّن الحسابات وقتًا أطول من المعتاد. تحقق من الاتصال ثم أعد المحاولة.');
    },15000);
    const clearLoadTimer=()=>{window.clearTimeout(timeoutId);};
    script.onload=()=>{
      clearLoadTimer();
      if(!active)return;
      settled=true;
      if(typeof window.PEST_FINANCE_MODULE==='function'&&window.PEST_FINANCE_MODULE_VERSION===FINANCE_MODULE_BUILD){
        setFinanceModule(()=>window.PEST_FINANCE_MODULE);
        setLoadError('');
      }else setLoadError('تم تحميل ملف الحسابات، لكن رقم الإصدار بداخله لا يطابق التطبيق. أعد النشر ثم حاول مرة أخرى.');
    };
    script.onerror=()=>{
      clearLoadTimer();
      if(!active)return;
      settled=true;
      setLoadError('تعذر تحميل ملف واجهة الحسابات من المسار: '+moduleUrl.pathname+'. تحقق من اكتمال نشر ملفات التطبيق.');
    };
    document.head.appendChild(script);
    return ()=>{
      active=false;
      clearLoadTimer();
      script.onload=null;
      script.onerror=null;
      if(!settled&&script.parentNode)script.parentNode.removeChild(script);
    };
  },[props.language,props.rtl]);
  if(!FinanceModule)return <section dir={props.rtl?'rtl':'ltr'} className="m-3 rounded-2xl border border-amber-300 bg-amber-50 p-5 text-amber-950 space-y-3">
    <h2 className="font-extrabold text-lg">{props.rtl?'تعذر فتح النظام المالي':'Unable to Open Financial System'}</h2>
    <p className="text-sm">{loadError||(props.rtl?'جارٍ تحميل مكوّن الحسابات...':'Loading accounting module...')}</p>
    <button type="button" onClick={()=>window.location.reload()} className="rounded-lg bg-amber-700 px-4 py-2 text-white font-bold">{props.rtl?'إعادة تحميل البرنامج':'Reload Application'}</button>
  </section>;
  return <FinanceModule {...props}/>;
}

    let active=true;
    let cached=null;
    try{
      const raw=localStorage.getItem(cacheKey);
      if(raw){
        const parsed=JSON.parse(raw);
        if(parsed&&parsed.rates&&Number(parsed.rates.EGP)===1)cached=parsed;
      }
    }catch(_){}
    if(cached){
      setFxRates(cached);
      setFxRateStatus('ready');
    }
    const cacheAge=cached?Date.now()-Number(cached.fetchedAt||0):Infinity;
    const refreshMs=23*60*60*1000;
    let lastAttemptAt=Number(cached?.fetchedAt||0);

      lastAttemptAt=Date.now();
      try{
        const response=await fetch('https://open.er-api.com/v6/latest/EGP',{cache:'no-store'});

        console.warn('Exchange-rate refresh failed:',err);

      }
    };
    if(cacheAge>=refreshMs){
      setFxRateStatus(cached?'stale':'loading');
      void loadRates();
    }

    const subscribeCollection=(key,ref,setter,onMutation)=>{

      };

        const row=normalise(snapshot);

        if(index<0)rows=[...rows,row];

        const rowKey=String(snapshot.key);
        rows=rows.filter(item=>String(item.id)!==rowKey&&String(item.uid)!==rowKey);
        setter(rows);
        if(onMutation)onMutation('removed',null,snapshot);
      };
      const handlers={
        child_added:snapshot=>upsert(snapshot,'added'),
        child_changed:snapshot=>upsert(snapshot,'changed'),
        child_removed:remove

        console.error('Lazy Firebase collection '+key,error);
        Object.entries(handlers).forEach(([eventName,handler])=>ref.off(eventName,handler));

      };

  function unlockNotificationAudio(){
    if(!notificationPreferencesRef.current.sound||typeof window==='undefined')return;
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;
    try{
      if(!notificationAudioRef.current)notificationAudioRef.current=new AudioContextClass();
      if(notificationAudioRef.current.state==='suspended')notificationAudioRef.current.resume().catch(()=>{});
    }catch(err){console.warn('Notification audio is unavailable:',err);}

  function playIncomingNotificationSound(){
    if(!notificationPreferencesRef.current.sound||window.PEST_NATIVE?.isNative)return;
    const context=notificationAudioRef.current;
    if(!context||context.state!=='running')return;
    try{
      const now=context.currentTime;
      [880,1174].forEach((frequency,index)=>{
        const oscillator=context.createOscillator();
        const gain=context.createGain();
        oscillator.type='sine';
        oscillator.frequency.setValueAtTime(frequency,now+index*0.13);
        gain.gain.setValueAtTime(0.0001,now+index*0.13);
        gain.gain.exponentialRampToValueAtTime(0.12,now+index*0.13+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+index*0.13+0.12);
        oscillator.connect(gain);gain.connect(context.destination);
        oscillator.start(now+index*0.13);oscillator.stop(now+index*0.13+0.14);
      });
    }catch(err){console.warn('Could not play notification sound:',err);}
  }

  async function attachmentWorkerRequest(path,method='GET',body,extraHeaders={},rawBody=false,asBlob=false){

      const detail=payload.error||('Attachment service returned HTTP '+response.status+'.');
      if(/Google Drive authorization expired or was revoked/i.test(String(detail))){
        setDriveConnectionStatus(old=>({...old,connected:false,needsReauthorization:true,authorizationStatus:'reauthorization_required'}));

      if(response.status===401)throw new Error((rtl?'رفضت خدمة المرفقات رمز الدخول بعد تحديثه: ':'The attachment service rejected the refreshed sign-in token: ')+detail);
      throw new Error(detail);
    }
    return asBlob?response.blob():response.json();
  }

  function attachmentMimeType(file){
    const ext=String(file?.name||'').split('.').pop().toLowerCase();
    const map={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',txt:'text/plain',csv:'text/csv',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
    return map[ext]||file?.type||'application/octet-stream';
  }
  const inlineAttachmentStatusKey=(entityType,entityId,file)=>[entityType||'generic',entityId||'pending',file.name,file.size,file.lastModified].join('::');
  async function previewInlineAttachment(file){
    try{
      const mime=attachmentMimeType(file),name=file.name||'Attachment';
      if(mime==='application/pdf'||mime.startsWith('image/')){
        setAttachmentPreview({kind:'media',url:URL.createObjectURL(file),fileName:name,mimeType:mime});
      }else if(mime==='text/plain'||mime==='text/csv'){
        setAttachmentPreview({kind:'text',fileName:name,text:(await file.text()).slice(0,500000)});
      }else if(mime==='application/vnd.ms-excel'||mime==='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'){
        const workbook=window.XLSX.read(await file.arrayBuffer(),{type:'array'});
        const sheet=workbook.Sheets[workbook.SheetNames[0]];
        const rows=sheet?window.XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',blankrows:false}).slice(0,200).map(row=>row.slice(0,24)):[];
        setAttachmentPreview({kind:'table',fileName:name,rows});
      }else{
        setAttachmentPreview({kind:'unsupported',url:URL.createObjectURL(file),fileName:name,mimeType:mime});
      }
    }catch(error){alert((rtl?'تعذرت معاينة الملف: ':'Could not preview file: ')+String(error.message||error));}
  }
  async function uploadQueuedInlineAttachment(file,files,setFiles,uploadContext){
    const entityType=uploadContext?.entityType||'cashCustody',entityId=String(uploadContext?.entityId||'');

    const statusKey=inlineAttachmentStatusKey(entityType,entityId,file);
    setInlineAttachmentStatuses(old=>({...old,[statusKey]:{state:'uploading',message:''}}));
    try{
      const result=await attachmentWorkerRequest('/attachments/upload','POST',file,{
        'Content-Type':attachmentMimeType(file),
        'X-Attachment-Entity-Type':entityType,
        'X-Attachment-Entity-Id':entityId,
        'X-Attachment-File-Name':encodeURIComponent(file.name)
      },true,false);
      if(entityType==='cashCustodyDraft'&&result.attachment){
        setCashCustodyStagedAttachments(old=>[...old.filter(item=>item.id!==result.attachment.id),result.attachment]);
      }
      setInlineAttachmentStatuses(old=>({...old,[statusKey]:{state:'success',message:rtl?'تم رفع الملف والتحقق من حفظه.':'Upload completed and file was saved.'}}));
      setFiles(old=>old.filter(item=>item!==file));
      if(entityType==='cashCustodyDraft'||entityType==='cashCustody'){
        setCashCustodyNotice((rtl?'تم رفع الملف بنجاح إلى مساحة المرفقات: ':'File uploaded successfully to attachment storage: ')+file.name);
      }else{
        await refreshRecordAttachmentPanel(entityType,entityId);
        if(entityType===attachmentEntityType&&entityId===attachmentEntityId)await refreshAttachmentList();
      }
      await refreshDriveConnectionStatus();
      await addLog('رفع مرفق: '+file.name,currentUser,{entityType:'attachment',entityId:entityType+'/'+entityId});
    }catch(error){
      const message=String(error.message||error);
      setInlineAttachmentStatuses(old=>({...old,[statusKey]:{state:'error',message}}));
      setCashCustodyNotice((rtl?'فشل رفع الملف '+file.name+': ':'Upload failed for '+file.name+': ')+message);
    }
  }

  async function saveAttachmentEditor(){

    if(!requirePermission('attachments','edit'))return;
    setAttachmentEditorBusy(true);setAttachmentEditorNotice('');
    try{
      const {entityType,entityId,attachment}=attachmentEditor;
      if(attachmentEditor.editable&&attachmentMarkupDirty){
        const base=attachmentBaseCanvasRef.current,markup=attachmentMarkupCanvasRef.current;
        let replacementBlob;
        if(attachmentEditor.mimeType==='application/pdf'){
          if(!window.PDFLib)throw new Error(rtl?'تعذر تحميل مكتبة تعديل PDF.':'Could not load the PDF editing library.');
          const pdf=await window.PDFLib.PDFDocument.load(await attachmentEditor.blob.arrayBuffer());

          replacementBlob=new Blob([await pdf.save()],{type:'application/pdf'});
        }else{
          const merged=document.createElement('canvas');merged.width=base.width;merged.height=base.height;
          const ctx=merged.getContext('2d');ctx.drawImage(base,0,0);ctx.drawImage(markup,0,0);

          'Content-Type':attachmentEditor.mimeType,
          'X-Attachment-Entity-Type':entityType,

          'X-Attachment-Id':attachment.id,
          'X-Attachment-File-Name':encodeURIComponent(attachment.fileName)

  async function finishCashCustodyAttachmentLink(targetId=cashCustodyPendingLinkTargetId,targetOwnerUid=cashCustodyPendingLinkOwnerUid||cashCustodyTargetUid||currentUser.uid){
    if(!targetId)return {ok:true};
    targetOwnerUid=String(targetOwnerUid||currentUser.uid);
    const sourceEntityId=currentUser.uid+'--'+cashCustodyDraftId;
    const targetEntityId=targetOwnerUid+'--'+targetId;
    try{
      localStorage.setItem('pestCashCustodyAttachmentTarget:'+currentUser.uid,targetId);
      localStorage.setItem('pestCashCustodyAttachmentOwner:'+currentUser.uid,targetOwnerUid);
    }catch(_){}
    setCashCustodyBusy(true);
    try{
      const targetSnapshot=await db.ref('cashCustodies/'+targetOwnerUid+'/transactions/'+targetId).once('value');
      if(!targetSnapshot.exists())throw new Error(rtl?'حركة العُهدة المحفوظة لم تعد موجودة.':'The saved cash-custody movement no longer exists.');
      let stagedItems=[...cashCustodyStagedAttachments];
      if(!stagedItems.length){
        const stagedResult=await attachmentWorkerRequest('/attachments?entityType=cashCustodyDraft&entityId='+encodeURIComponent(sourceEntityId),'GET');
        stagedItems=Array.isArray(stagedResult.attachments)?stagedResult.attachments:[];
        setCashCustodyStagedAttachments(stagedItems);
      }
      const linked=await attachmentWorkerRequest('/attachments?entityType=cashCustody&entityId='+encodeURIComponent(targetEntityId),'GET');
      const linkedIds=new Set((linked.attachments||[]).map(x=>x.id));
      for(const item of stagedItems){
        if(!linkedIds.has(item.id)){
          await attachmentWorkerRequest('/attachments/attach','POST',{id:item.id,sourceEntityType:'cashCustodyDraft',sourceEntityId,targetEntityType:'cashCustody',targetEntityId,targetOwnerUid});
          linkedIds.add(item.id);
        }
        setCashCustodyStagedAttachments(old=>old.filter(x=>x.id!==item.id));
      }
      await refreshRecordAttachmentPanel('cashCustody',targetEntityId);
      setCashCustodyPendingLinkTargetId('');
      resetCashCustodyAttachmentDraft();
      setCashCustodyNotice(rtl?'تم ربط جميع المرفقات بالحركة بنجاح.':'All uploaded files are now linked to the movement.');
      return {ok:true};
    }catch(error){
      const message=String(error.message||error);
      setCashCustodyPendingLinkTargetId(targetId);
      setCashCustodyNotice((rtl?'الحركة محفوظة، لكن تعذر ربط بعض المرفقات. اضغط «إكمال ربط المرفقات» لإعادة المحاولة. السبب: ':'The movement is saved, but some files could not be linked. Use “Finish linking attachments” to retry. Reason: ')+message);
      return {ok:false,message};
    }finally{setCashCustodyBusy(false);}
  }

  }

  async function compressProfileImage(file){
    if(!file || !file.type || !file.type.startsWith('image/')) throw new Error(rtl?'اختر ملف صورة صالحاً.':'Choose a valid image file.');
    if(file.size>12*1024*1024) throw new Error(rtl?'حجم الصورة الأصلية كبير جداً (الحد 12 ميجابايت).':'The original image is too large (12 MB maximum).');
    const objectUrl=URL.createObjectURL(file);
    const image=new Image();
    await new Promise((resolve,reject)=>{
      image.onload=()=>{URL.revokeObjectURL(objectUrl);resolve();};
      image.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error(rtl?'تعذر قراءة الصورة.':'The image could not be read.'));};
      image.src=objectUrl;
    });
    if(!image.naturalWidth || !image.naturalHeight) throw new Error(rtl?'ملف الصورة غير صالح.':'The image file is invalid.');
    let edge=480;
    for(let attempt=0;attempt<7;attempt++){
      const scale=Math.min(1,edge/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      const context=canvas.getContext('2d');
      if(!context) throw new Error(rtl?'تعذر تجهيز الصورة.':'Could not process the image.');
      context.fillStyle='#ffffff';
      context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(image,0,0,canvas.width,canvas.height);
      const quality=Math.max(0.48,0.84-(attempt*0.07));
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
      if(blob && blob.size<=140*1024){
        return await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(reader.result);
          reader.onerror=()=>reject(new Error(rtl?'تعذر تجهيز الصورة للحفظ.':'Could not prepare the image for saving.'));
          reader.readAsDataURL(blob);
        });
      }
      edge=Math.max(160,Math.round(edge*0.82));
    }
    throw new Error(rtl?'تعذر ضغط الصورة إلى الحجم المناسب. اختر صورة أصغر.':'Could not compress the image enough. Please choose a smaller image.');
  }

  async function submitCashCustodyTransfer(){

    const targetType=cashCustodyTransferTarget==='current'?'current':'custody';
    const targetUid=targetType==='custody'?cashCustodyTransferTarget:'';
    const partnerInfo=targetType==='current'?getConfiguredPartnerCurrentAccount(ownerUid):null;
    if(!cashCustodyTransferPreview)return alert(rtl?'انتظر حتى يتم احتساب القيد من الخادم وعرضه قبل الإرسال.':'Wait for the server-calculated journal preview before submitting.');
    if(targetType==='custody'&&(!targetUid||targetUid===ownerUid))return alert(rtl?'اختر صاحب عهدة آخر مختلفًا عن صاحب الحركة الأصلية.':'Select a different receiving custody owner.');
    if(targetType==='current'&&!partnerInfo)return alert(rtl?'لا يوجد حساب جاري شريك مربوط بصاحب العهدة المحدد.':'The custody owner is not linked to a partner current account.');

    if(!Number.isFinite(amount)||amount<=0)return alert(rtl?'قيمة الحركة غير صحيحة.':'Invalid movement amount.');
    const fromName=(userDirectory.find(u=>u.uid===ownerUid)||{}).fullName||((ownerUid===currentUser.uid&&currentUser.fullName)||ownerUid);
    const toUser=targetType==='custody'?(userDirectory.find(u=>u.uid===targetUid)||{}):null;
    const toName=targetType==='current'?(partnerInfo.partnerName+' ('+partnerInfo.accountCode+')'):(toUser.fullName||toUser.username||toUser.email||targetUid);

    const debitTotal=lines.reduce((sum,line)=>sum+Number(line.debit||0),0),creditTotal=lines.reduce((sum,line)=>sum+Number(line.credit||0),0);
    if(!lines.length||Math.abs(debitTotal-creditTotal)>0.01)return alert(rtl?'القيد المعروض غير متوازن أو لا يحتوي على تفاصيل. تم إيقاف العملية.':'The displayed journal is empty or unbalanced. Transfer cancelled.');
    if(!window.confirm((rtl?'سيتم إرسال القيد المحسوب من النظام التالي إلى المراجعة فقط. لن تتغير الأرصدة قبل الاعتماد.\\n\\nمن: ':'This server-calculated journal will be submitted for review only. Balances will not change before approval.\n\nFrom: ')+fromName+'\n'+(rtl?'إلى: ':'To: ')+toName+'\n'+(rtl?'المبلغ: ':'Amount: ')+money(cashCustodyTransferPreview.amount||amount)+' EGP\n\n'+lines.map(line=>(line.accountCode+' | '+(line.accountName||line.description||'')+' | مدين '+money(line.debit)+' | دائن '+money(line.credit))).join('\n')+'\n\n'+(rtl?'هل تريد إرسال القيد للمراجعة؟':'Submit this journal for review?')))return;
    setCashCustodyBusy(true);setCashCustodyNotice('');
    try{

        ?await sendPushWorkerRequest('/finance',{action:'transferPartnerCurrentAccount',ownerUid,transactionId:transaction.id,direction:'toCurrent'})
        :await sendPushWorkerRequest('/finance',{action:'transferCashCustodyMovement',ownerUid,transactionId:transaction.id,destinationOwnerUid:targetUid});
      await addLog('إرسال تحويل حركة عهدة للمراجعة',currentUser,{entityType:'cash-custody-transfer',entityId:ownerUid+'/'+transaction.id,metadata:{destinationType:targetType,destinationOwnerUid:targetUid||'',journalId:result.journalId,amount,currency:'EGP'}});
      setCashCustodyNotice((rtl?'تم إرسال القيد إلى المراجعة. لن يتغير رصيد أي عهدة قبل الاعتماد. رقم القيد: ':'Journal submitted for review. No custody balance changes before approval. Journal: ')+(result.journalNumber||result.journalId)+'.');
      setCashCustodyTransferDialog(null);
    }catch(error){setCashCustodyNotice((rtl?'تعذر إرسال التحويل: ':'Transfer submission failed: ')+String(error.message||error));}

  async function transferAllCashCustodyToPartnerCurrent(ownerUid){

    if(!isConfiguredPartnerCurrentOwner(ownerUid))return alert(rtl?'هذا المستخدم غير مربوط بحساب جاري شريك.':'This user is not linked to a partner current account.');

    const candidates=cashCustodyRows.filter(t=>t&&t.status==='approved'&&t.bookScope==='personal'&&t.pairRole!=='counterparty'&&String(t.currency||'EGP').toUpperCase()==='EGP'&&!(t.partnerCurrentAccountTransfer&&t.partnerCurrentAccountTransfer.active===true)&&!(t.partnerCurrentAccountTransfer&&t.partnerCurrentAccountTransfer.pending===true));

    const amount=money(total)+' EGP';

    setCashCustodyBusy(true);setCashCustodyNotice('');

        }catch(error){failed++;if(!firstError)firstError=String(error.message||error);}
      }
      setCashCustodyNotice(rtl?'تم إرسال '+success+' حركة بإجمالي '+amount+' للمراجعة'+(failed?'، وتعذر إرسال '+failed+' حركة. أول سبب: '+firstError:'')+'. لن يتغير أي رصيد قبل اعتماد القيود.':'Sent '+success+' movements totaling '+amount+' for review'+(failed?'; '+failed+' failed. First reason: '+firstError:'')+'. Balances will not change before journal approval.');

  async function transferPartnerCustodyMovementsBulk(direction){
    if(!isAdmin||!hasPermission('cashCustody','edit'))return alert(rtl?'تحويلات جاري الشركاء متاحة لمدير النظام فقط.':'Only an administrator can transfer partner custody movements.');

    const directionLabel=direction==='toCurrent'?(rtl?'من العهدة الشخصية إلى جاري الشريك':'Personal custody to partner current account'):(rtl?'من جاري الشريك إلى العهدة الشخصية':'Partner current account back to personal custody');

          action:'transferPartnerCurrentAccountBulk',ownerUid:cashCustodyTarget,direction,
          transactionIds:batch.map(t=>t.id)
        });

      }
      const submitted=allResults.filter(item=>item.success);
      const failed=allResults.filter(item=>!item.success&&!item.skipped);
      const skipped=allResults.filter(item=>item.skipped);
      const submittedGross=submitted.reduce((sum,item)=>sum+Number(item.amount||0),0);
      if(submitted.length){
        await addLog(direction==='toCurrent'?'تحويل مجموعة حركات العهدة إلى جاري الشريك':'إعادة مجموعة حركات جاري الشريك إلى العهدة',currentUser,{
          entityType:'partner-current-account',entityId:cashCustodyTarget,
          metadata:{partnerAccountCode:cashCustodyPartnerOwnerInfo.accountCode,direction,movementCount:submitted.length,netBalance,totalAmount:submittedGross,journalIds:submitted.map(item=>item.journalId)}
        });
      }
      let notice=rtl

      await addLog((status==='approved'?'اعتماد':'رفض')+' حركة عهدة '+transaction.id,currentUser,{entityType:'cash-custody',entityId:ownerUid+'/'+transaction.id,metadata:{status,paired:Boolean(transaction.linkedTransactionId)}});

    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function deleteCashCustodyDraft(transaction){
    if(!requirePermission('cashCustody','delete'))return;
    const ownerUid=cashCustodyTargetUid||currentUser.uid;
    if(ownerUid!==currentUser.uid&&(!isAdmin||!hasPermission('cashCustody','viewOthers')))return alert(rtl?'لا تملك صلاحية حذف عهدة هذا المستخدم.':'You cannot delete this user\'s custody movement.');
    if(!transaction)return;
    if(transaction.pairRole==='counterparty')return alert(rtl?'هذه حركة مقابلة. احذف الحركة الأصلية من دفتر الطرف الذي سجلها.':'This is a linked counterpart entry. Delete the originating movement from the sender\'s ledger.');
    if(transaction.status==='approved'&&!isAdmin)return alert(rtl?'حذف الحركة المعتمدة متاح لمدير النظام فقط.':'Only an administrator can delete an approved movement.');
    if(!window.confirm((rtl?'حذف حركة العهدة؟ سيتم حذف الحركة المقابلة المرتبطة بها، وسيعاد احتساب الرصيد مع الاحتفاظ بأثر الحذف في سجل النشاط.\n':'Delete this custody movement and its linked counterpart? Balances will be recalculated and the deletion retained in the audit log.\n')+(transaction.description||transaction.id)))return;
    try{
      if(hasPermission('attachments','delete'))await deleteRecordAttachments('cashCustody',ownerUid+'--'+transaction.id);
      const updates={['cashCustodies/'+ownerUid+'/transactions/'+transaction.id]:null};
      if(transaction.linkedTransactionId&&transaction.linkedOwnerUid)updates['cashCustodies/'+transaction.linkedOwnerUid+'/transactions/'+transaction.linkedTransactionId]=null;
      if(transaction.linkedProjectEventId&&transaction.projectCode)updates['projects/'+transaction.projectCode+'/events/'+transaction.linkedProjectEventId]=null;
      await db.ref().update(updates);
      await addLog('حذف حركة عهدة '+transaction.id,currentUser,{entityType:'cash-custody',entityId:ownerUid+'/'+transaction.id,changes:auditChanges(transaction,null),metadata:{pairedDeleted:Boolean(transaction.linkedTransactionId),partyEventDeleted:Boolean(transaction.linkedProjectEventId)}});
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function updateRequestStatus(req,status){
    if(!isAdmin || !req.uid) return;
    try{
      if(!req._hasAuthUid){
        if(status==='approved') return alert(tr('legacyReapply'));
        await db.ref('userRequests/'+req.id+'/status').set(status==='pending'?'مؤجل':'غير موافق');
        await addLog('تعديل حالة طلب قديم '+req.fullName+' إلى '+status);
        return;
      }
      const updates={};
      updates['userRequests/'+req.uid+'/status']=status;
      if(status==='approved'){
        updates['users/'+req.uid]={uid:req.uid,email:req.email,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,whatsapp:req.whatsapp||'',role:'user',status:'active',permissions:{},avatar:req.avatar||'',createdAt:firebase.database.ServerValue.TIMESTAMP};
        updates['userDirectory/'+req.uid]={uid:req.uid,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,whatsapp:req.whatsapp||'',avatar:req.avatar||'',status:'active'};
      }else{
        // Update profile/directory only when they already exist. A pending request
        // does not yet have a users/{uid} profile, so creating one here breaks login.
        const [userSnap,dirSnap]=await Promise.all([
          db.ref('users/'+req.uid).once('value'),
          db.ref('userDirectory/'+req.uid).once('value')
        ]);
        if(userSnap.exists()) updates['users/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
        if(dirSnap.exists()) updates['userDirectory/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
      }
      await db.ref().update(updates);
      await addLog('تغيير حالة طلب '+req.fullName+' إلى '+status);
      setRequestStatusDrafts(old=>{const next={...old};delete next[req.uid];return next;});
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function sendExcelImport(e){
    e.preventDefault();if(!isAdmin) return;
    const file=e.target.elements.excelFile.files[0];if(!file) return alert(tr('noData'));
    try{
      const buffer=await file.arrayBuffer();
      const workbook=XLSX.read(buffer,{type:'array'});
      const updates={};let imported=0;let skipped=0;
      const norm=v=>String(v||'').trim().toLowerCase().replace(/[\s_\-]+/g,'');
      const aliases={type:['type','recordtype','نوع','النوع'],phone:['phone','mobile','telephone','هاتف','الهاتف','تليفون'],clientCode:['clientcode','customercode','كود العميل','كودالعميل'],amount:['amount','value','القيمة','المبلغ'],status:['status','الحالة']};
      const get=(row,keys)=>{for(const [k,v] of Object.entries(row)){if(keys.map(norm).includes(norm(k)) && v!==undefined && v!==null && String(v).trim()!=='') return String(v).trim();}return '';};
      const normalizeExcelDate=value=>{
        const raw=String(value||'').trim();
        if(!raw) return '';
        const formatDate=(y,m,d)=>String(y)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)){
          const parts=raw.split('-').map(Number);
          return formatDate(parts[0],parts[1],parts[2]);
        }
        if(/^\d+(\.\d+)?$/.test(raw) && XLSX.SSF && XLSX.SSF.parse_date_code){
          const serial=XLSX.SSF.parse_date_code(Number(raw));
          if(serial && serial.y && serial.m && serial.d) return formatDate(serial.y,serial.m,serial.d);
        }
        const dmy=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
        if(dmy){
          const day=Number(dmy[1]),month=Number(dmy[2]),year=Number(dmy[3]);
          if(day>=1&&day<=31&&month>=1&&month<=12) return formatDate(year,month,day);
        }
        const parsed=new Date(raw);
        if(!Number.isNaN(parsed.getTime())) return formatDate(parsed.getFullYear(),parsed.getMonth()+1,parsed.getDate());
        return raw;
      };
      workbook.SheetNames.forEach(sheetName=>{
        const sheetKey=norm(sheetName);
        if(['instructions','readme','guide','تعليمات','ارشادات','إرشادات'].includes(sheetKey)) return;
        const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',raw:true});
        rows.forEach(row=>{
          const typeRaw=get(row,aliases.type).toLowerCase();
          const sheet=norm(sheetName);
          let type=typeRaw;
          if(!type){if(['clients','client','customers','customer','العملاء','عميل'].includes(sheet)) type='client';else if(['vendors','vendor','suppliers','supplier','الموردون','الموردين','مورد'].includes(sheet)) type='vendor';else if(['projects','project','المشروعات','المشاريع','مشروع'].includes(sheet)) type='project';}
          if(['clients','customer','customers','العملاء','عميل'].includes(type)) type='client';
          if(['vendors','supplier','suppliers','الموردون','الموردين','مورد'].includes(type)) type='vendor';
          if(['projects','المشروعات','المشاريع','مشروع'].includes(type)) type='project';
          const codeKeys=type==='project'?['projectcode','code','كودالمشروع','كود']:type==='vendor'?['vendorcode','suppliercode','code','كودالمورد','كود']:['clientcode','customercode','code','كودالعميل','كود'];
          const nameKeys=type==='project'?['projectname','name','اسم المشروع','اسمالمشروع','الاسم','اسم']:type==='vendor'?['vendorname','suppliername','name','اسم المورد','اسمالمورد','الاسم','اسم']:['clientname','customername','name','اسم العميل','اسمالعميل','الاسم','اسم'];
          const code=get(row,codeKeys),name=get(row,nameKeys);
          if(!['client','vendor','project'].includes(type)||!code||!name||/[.#$\[\]/]/.test(code)){skipped++;return;}
          if(type==='client'||type==='vendor'){
            const path=(type==='client'?'clients/':'vendors/')+code;
            updates[path+'/code']=code;updates[path+'/name']=name;
            const fieldAliases={englishName:['englishname','english name','الاسم بالانجليزية','الاسم بالإنجليزية'],phone:['phone','telephone','هاتف','الهاتف','تليفون'],mobile:['mobile','محمول'],alternatePhone:['alternatephone','phone2','هاتف اضافي'],email:['email','البريد الالكتروني','البريد الإلكتروني'],alternateEmail:['alternateemail','email2','بريد اضافي'],whatsapp:['whatsapp','واتساب'],website:['website','الموقع الالكتروني'],taxNumber:['taxnumber','taxregistration','taxregistrationnumber','رقم التسجيل الضريبي','الرقم الضريبي'],commercialRegister:['commercialregister','السجل التجاري'],contactPerson:['contactperson','الشخص المسؤول'],contactTitle:['contacttitle','صفة المسؤول'],address:['address','العنوان'],city:['city','المدينة'],country:['country','الدولة'],postalCode:['postalcode','الرمز البريدي'],paymentTerms:['paymentterms','شروط السداد'],creditLimit:['creditlimit','الحد الائتماني'],currency:['currency','العملة'],bankName:['bankname','اسم البنك'],bankAccount:['bankaccount','رقم الحساب'],iban:['iban'],notes:['notes','ملاحظات']};
            Object.entries(fieldAliases).forEach(([field,keys])=>{const value=get(row,keys);if(value!=='') updates[path+'/'+field]=value;});imported++;
          }else{
            const path='projects/'+code;
            const amountText=get(row,aliases.amount).replace(/,/g,'');
            const amount=Number(amountText||0);
            const setIfProvided=(field,value)=>{if(value!=='' && value!==undefined && value!==null) updates[path+'/'+field]=value;};
            updates[path+'/code']=code;updates[path+'/name']=name;
            const clientCodes=get(row,['clientcodes','customercodes','clientcode','customercode','كود العميل','اكواد العملاء']).split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
            const vendorCodes=get(row,['vendorcodes','suppliercodes','vendorcode','suppliercode','كود المورد','اكواد الموردين']).split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
            if(clientCodes.length){updates[path+'/clientCodes']=clientCodes;updates[path+'/clientCode']=clientCodes[0];}
            if(vendorCodes.length) updates[path+'/vendorCodes']=vendorCodes;
            setIfProvided('amount',amountText!=='' && Number.isFinite(amount)?amount:'');
            setIfProvided('costBudget',get(row,['costbudget','estimatedcost','التكلفة التقديرية','التكلفة']));
            setIfProvided('status',get(row,aliases.status));setIfProvided('currency',get(row,['currency','العملة']));
            setIfProvided('contractNo',get(row,['contractno','رقم العقد']));setIfProvided('purchaseOrderNo',get(row,['purchaseorderno','رقم امر الشراء','رقم أمر الشراء']));
            setIfProvided('projectManager',get(row,['projectmanager','مدير المشروع']));setIfProvided('projectType',get(row,['projecttype','نوع المشروع','نوع التوريد']));
            setIfProvided('startDate',normalizeExcelDate(get(row,['startdate','تاريخ البدء'])));setIfProvided('expectedEndDate',normalizeExcelDate(get(row,['expectedenddate','تاريخ الانتهاء المتوقع'])));setIfProvided('actualEndDate',normalizeExcelDate(get(row,['actualenddate','تاريخ الانتهاء الفعلي'])));
            setIfProvided('location',get(row,['location','موقع التنفيذ']));setIfProvided('deliveryAddress',get(row,['deliveryaddress','عنوان التسليم']));
            setIfProvided('paymentTerms',get(row,['paymentterms','شروط السداد']));setIfProvided('scope',get(row,['scope','نطاق الأعمال']));setIfProvided('notes',get(row,['notes','ملاحظات']));
            imported++;
          }
        });
      });
      if(!imported) return alert(tr('importNoRows'));
      await db.ref().update(updates);await addLog('استيراد بيانات من Excel: '+imported+' سجل');setExcelSummary(tr('importSuccess')+imported+(skipped?' · '+skipped+' skipped':''));e.target.reset();
    }catch(err){console.error('Excel import:',err);alert(firebaseErrorMessage(err,tr));}
  }

  function triggerDownload(blob,filename){
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;link.download=filename;link.style.display='none';
    document.body.appendChild(link);link.click();link.remove();
    window.setTimeout(()=>URL.revokeObjectURL(url),2000);
  }

  function removeBackupSecrets(value){
    if(Array.isArray(value)) return value.map(removeBackupSecrets);
    if(!value || typeof value!=='object') return value;
    const safe={};
    Object.entries(value).forEach(([key,item])=>{
      if(/^(password|passwordhash|accesstoken|refreshtoken|idtoken|secret)$/i.test(key)) return;
      safe[key]=removeBackupSecrets(item);
    });
    return safe;
  }

  async function downloadDatabaseBackup(){if(!requirePermission('settings','manage'))return;
    setBackupBusy('database');setBackupMessage('');
    try{
      const snapshot=await db.ref('/').once('value');
      const payload={
        backupType:'Pest Platform Realtime Database Backup',
        createdAt:new Date().toISOString(),
        createdBy:{uid:currentUser.uid,email:currentUser.email,username:currentUser.username},
        data:removeBackupSecrets(snapshot.val()||{})
      };
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
      triggerDownload(blob,'PestPlatform_database_backup_'+backupFileStamp()+'.json');
      setBackupMessage(tr('backupCreated'));
      void addLog('تنزيل نسخة احتياطية من قاعدة البيانات');
    }catch(err){
      console.error('Database backup:',err);
      const message=err && (err.code==='PERMISSION_DENIED' || String(err.message||'').toLowerCase().includes('permission'))
        ? tr('backupPermission') : tr('backupFailed')+(err.message||'');
      setBackupMessage(message);
    }finally{setBackupBusy('');}
  }

    if(!code||!name) return alert(tr('noData'));

    const record={...master,code,name,partyType:type==='vendor'?'vendor':'customer',companyName:name,createdAt:master.createdAt||Date.now(),updatedAt:Date.now()};

      const previousSnap=editingMasterCode?await db.ref(path+'/'+editingMasterCode).once('value'):null;

    try{
      const [quoteSnap,inflowSnap,outflowSnap]=await Promise.all([
        db.ref('quotes').once('value'),db.ref('inflows').once('value'),db.ref('outflows').once('value')
      ]);
      const linkedLegacy={
        quotes:Object.values(quoteSnap.val()||{}).filter(row=>String(row&&row.projectCode||'')===String(item.code)).length,
        inflows:Object.values(inflowSnap.val()||{}).filter(row=>String(row&&row.projectCode||'')===String(item.code)).length,
        outflows:Object.values(outflowSnap.val()||{}).filter(row=>String(row&&row.projectCode||'')===String(item.code)).length

        await db.ref('projects/'+item.code).update({status:archived.status,active:false,archivedAt:archived.archivedAt,archivedBy:archived.archivedBy,archivedByName:archived.archivedByName});
        await addLog('أرشفة مشروع ذي تاريخ مالي: '+(item.name||item.code),currentUser,{entityType:'project',entityId:item.code,changes:auditChanges(item,archived),metadata:{financialEvents:financialEvents.length,linkedLegacy}});
        setTab('projects');
        alert(rtl?'تمت أرشفة المشروع مع الحفاظ على تاريخه المالي.':'The project was archived and its financial history was preserved.');
        return;
      }
      if(!window.confirm((rtl?'حذف المشروع وجميع أحداثه غير المالية نهائيًا؟ ':'Permanently delete this project and its non-financial events? ')+item.code+' · '+events.length+' '+(rtl?'حدث':'events')))return;
      await deleteRecordAttachments('project',item.code);
      for(const ev of events)await deleteRecordAttachments('projectEvent',item.code+'--'+ev.id);

      await addLog('حذف مشروع: '+(item.name||item.code),currentUser,{entityType:'project',entityId:item.code,changes:auditChanges(item,null),metadata:{deletedEvents:events.length,deletedFinancialEvents:0}});
      if(selectedProjectCode===item.code)setSelectedProjectCode('');
      if(editingProjectCode===item.code){setEditingProjectCode('');setProject(blankProject());setProjectFormOpen(false);}
      setTab('projects');

    }catch(err){alert((rtl?'تعذر حذف / أرشفة المشروع: ':'Could not delete/archive project: ')+String(err.message||err));}
  }

  async function closeProjectFinancialEvent(projectRecord,eventRecord){
    if(!requirePermission('projects','edit')||!projectRecord||!eventRecord||!['receivable','payable'].includes(eventRecord.financialEffect)||isClosedFinancialEvent(eventRecord))return;
    const relatedCashType=eventRecord.financialEffect==='receivable'?'customer_collection':'supplier_payment';
    const relatedTimeline=projectEvents(projectRecord);
    const samePartyEvents=relatedTimeline.filter(row=>['customer_receivable','supplier_commitment'].includes(row.type)&&row.partyType===eventRecord.partyType&&String(row.partyCode||'')===String(eventRecord.partyCode||'')&&!isClosedFinancialEvent(row));
    const cashRowsForThisEvent=relatedTimeline.filter(row=>row.type===relatedCashType&&String(row.partyType||'')===String(eventRecord.partyType||'')&&String(row.partyCode||'')===String(eventRecord.partyCode||'')&&(eventRecord.referenceNo?String(row.referenceNo||'')===String(eventRecord.referenceNo):samePartyEvents.length===1));
    const alreadyRecordedCash=cashRowsForThisEvent.reduce((sum,row)=>sum+cashEventAmount(row),0);
    const remainingDefault=Math.max(0,Number(eventRecord.amount||0)-Number(eventRecord.settledAmount||0)-alreadyRecordedCash);
    const reason=window.prompt(rtl?'بيان الإغلاق / طريقة التسوية (اختياري):':'Closure / settlement note (optional):',remainingDefault>0?(rtl?'تمت التسوية / الإقفال':'Settled / closed'):(rtl?'تم السداد / التحصيل بالكامل':'Fully paid / collected'))??null;
    if(reason===null)return;
    const closureAdjustmentAmount=remainingDefault;
    const after={...eventRecord,status:'closed',closureAdjustmentAmount,closureNote:String(reason).trim(),closedAt:firebase.database.ServerValue.TIMESTAMP,closedBy:currentUser.uid,closedByName:currentUser.fullName||currentUser.username||'',updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:currentUser.uid,updatedByName:currentUser.fullName||currentUser.username||''};
    try{
      await db.ref('projects/'+projectRecord.code+'/events/'+eventRecord.id).update({status:after.status,closureAdjustmentAmount,closureNote:after.closureNote,closedAt:after.closedAt,closedBy:after.closedBy,closedByName:after.closedByName,updatedAt:after.updatedAt,updatedBy:after.updatedBy,updatedByName:after.updatedByName});
      await addLog('إغلاق '+(eventRecord.financialEffect==='receivable'?'مستحق عميل':'التزام مورد')+': '+(eventRecord.actionName||eventRecord.id),currentUser,{entityType:'project-event',entityId:projectRecord.code+'/'+eventRecord.id,changes:auditChanges(eventRecord,after),metadata:{closureAdjustmentAmount}});
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function addProjectEvent(e){
    e.preventDefault();if(!requirePermission('projects',editingProjectEventId?'edit':'add'))return;
    const code=selectedProjectCode;const target=projects.find(p=>p.code===code);
    if(!target) return alert(tr('selectProject'));
    const action=projectActionOptions.find(x=>x.id===projectEvent.actionCode)||projectActionOptions[0];
    const partyType=projectEvent.partyType||action.party||'';
    const configuredEffect=action.effect||'none';
    // Only explicitly classified accounting events create journals. A quotation, purchase order,
    // delivery note or general project note stays operational even when it carries an estimated value.
    let effect=configuredEffect;
    if(effect==='cash_out'&&projectEvent.paymentMethod==='cheque'&&projectEvent.actionCode!=='cheque_cleared_out')effect='cheque_outstanding';
    if(effect==='cash_in'&&projectEvent.paymentMethod==='cheque'&&projectEvent.actionCode!=='cheque_cleared_in')effect='cheque_in_transit';
    const normalizedType=effect==='cash_in'?'customer_collection':effect==='cash_out'?'supplier_payment':effect==='receivable'?'customer_receivable':effect==='payable'?'supplier_commitment':projectEvent.actionCode;
    const id=editingProjectEventId||db.ref('projects/'+code+'/events').push().key;
    const existingEvent=editingProjectEventId&&target.events?target.events[editingProjectEventId]:null;
    const event={...projectEvent,id,projectCode:code,type:normalizedType,actionCode:projectEvent.actionCode,actionName:String(projectEvent.actionName||action.label).trim(),financialEffect:effect,date:projectEvent.date||new Date().toISOString().slice(0,10),dueDate:projectEvent.dueDate||'',partyCode:projectEvent.partyCode||'',partyType,referenceNo:String(projectEvent.referenceNo||'').trim(),quantity:Number(projectEvent.quantity||0),unit:String(projectEvent.unit||''),amount:Number(projectEvent.amount||0),settledAmount:Number(projectEvent.settledAmount||0),currency:projectEvent.currency||target.currency||'EGP',status:projectEvent.status||'open',paymentMethod:projectEvent.paymentMethod||'',responsible:String(projectEvent.responsible||'').trim(),priority:projectEvent.priority||'normal',note:String(projectEvent.note||'').trim(),createdBy:existingEvent?.createdBy||currentUser.uid,createdByName:existingEvent?.createdByName||currentUser.fullName,createdByAvatar:existingEvent?.createdByAvatar||currentUser.avatar||'',createdAt:existingEvent?.createdAt||firebase.database.ServerValue.TIMESTAMP,...(editingProjectEventId?{updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:currentUser.uid,updatedByName:currentUser.fullName}:{})};
    if(['cash_in','cash_out'].includes(effect)&&!['full','completed','paid','collected','تم السداد','تم التحصيل','تم الدفع','تم القبض','تم التنفيذ','منفذ'].includes(String(event.status).toLowerCase())&&event.settledAmount<=0){event.settledAmount=0;}
    try{
      const previousEvent=existingEvent||(editingProjectEventId?target.events&&target.events[id]:null);
      const saved=await sendPushWorkerRequest('/finance',{action:'submitProjectEvent',projectCode:code,event});
      if(!saved||saved.success!==true||!saved.event)throw new Error(rtl?'لم يؤكد النظام حفظ الحدث والقيد المقترح.':'The system did not confirm the project event and accounting draft.');
      const savedEvent=saved.event;
      try{if(eventPendingAttachments.length)await uploadInlineAttachments(eventPendingAttachments,'projectEvent',code+'--'+id,setEventPendingAttachments);}
      catch(attachmentError){setEditingProjectEventId(id);alert((rtl?'تم حفظ الحدث'+(saved.accountingImpact?' وإرسال القيد للمراجعة':'')+'، لكن تعذر رفع بعض المرفقات. أصلح الاتصال ثم اضغط حفظ التعديلات لإكمال الرفع.\n':'The event'+(saved.accountingImpact?' and review journal ':' ')+'was saved, but some attachments could not be uploaded. Fix the connection and save the event again to finish uploading.\n')+String(attachmentError.message||attachmentError));return;}
      await addLog((editingProjectEventId?'تعديل ':'إضافة ')+ 'حدث '+savedEvent.actionName+' للمشروع '+code,currentUser,{entityType:'project-event',entityId:code+'/'+id,changes:auditChanges(previousEvent,savedEvent),metadata:{accountingImpact:saved.accountingImpact,accountingStatus:saved.accountingStatus,journalId:saved.journalId||''}});
      setProjectEvent(blankProjectEvent());setEventPendingAttachments([]);setEditingProjectEventId('');
      alert(tr('eventSaved')+(saved.accountingImpact?(rtl?' — مؤثر: أُرسل القيد للمراجعة ولا يؤثر على الأرصدة قبل الاعتماد.':' — Financial: journal sent for review and will not affect balances before approval.'):(rtl?' — غير مؤثر محاسبيًا.':' — No accounting impact.')));

  function activeContextToken(text){

  function contextTokenSuggestionsFor(text){
    const match=activeContextToken(text);
    if(!match)return [];
    const marker=match[2],query=match[3]||'';
    if(marker==='@')return userDirectory.filter(u=>u.uid&&u.status==='active'&&u.uid!==currentUser.uid&&includesText([u.username,u.fullName,u.jobTitle].join(' '),query)).slice(0,8).map(u=>({type:'user',id:u.uid,label:u.fullName||u.username||u.uid,detail:'@'+(u.username||''),user:u}));
    if(marker==='#')return projects.filter(p=>{
      const status=String(p.status||'').toLowerCase();
      return p.code&&!['completed','closed','cancelled','archived','done','منتهي','مكتمل','مغلق','ملغي','مؤرشف','منتهى'].includes(status)&&includesText([p.code,p.name,p.contractNo,p.purchaseOrderNo].join(' '),query);
    }).slice(0,8).map(p=>({type:'project',id:p.code,label:p.name||p.code,detail:'#'+p.code,project:p}));
    if(marker==='&')return tasks.filter(t=>t.id&&includesText([t.title,t.description,t.status].join(' '),query)).slice(0,8).map(t=>({type:'task',id:t.id,label:t.title||t.id,detail:(t.status||'open')+' · '+t.id,task:t}));

  function contextTokenText(item){
    if(item.type==='user')return '@'+(item.user.username||item.user.uid);

  function insertContextToken(text,setter,item){
    const match=activeContextToken(text);
    if(!match)return;
    const prefix=String(text).slice(0,String(text).length-match[0].length)+(match[1]||'');
    setter(prefix+contextTokenText(item)+' ');
  }
  function messageContextReferences(body){
    const text=String(body||'');
    const projectCodes=[...text.matchAll(/#([^\s@#&]+)/g)].map(m=>m[1]);
    const taskTitles=[...text.matchAll(/&\[([^\]]+)\]/g)].map(m=>m[1].trim());
    const linkedProjects=[...new Set(projectCodes)].map(code=>{
      const p=projects.find(x=>String(x.code||'').toLowerCase()===String(code).toLowerCase());
      return p?{code:p.code,name:p.name||p.code}:null;
    }).filter(Boolean);
    const linkedTasks=[...new Set(taskTitles)].map(title=>{
      const t=tasks.find(x=>String(x.title||'').trim().toLowerCase()===title.toLowerCase());
      return t?{id:t.id,title:t.title||t.id,status:t.status||'open'}:{id:'',title,status:'referenced'};
    });
    return {linkedProjects,linkedTasks};
  }

  function pushTokenRecordId(token){

  async function persistPushToken(token,platform){
    const uid=currentUser?.uid||auth.currentUser?.uid||'';
    if(!uid||!token)throw new Error('Sign in before registering this device.');
    const tokenId=pushTokenRecordId(token);
    await db.ref('pushTokens/'+uid+'/'+tokenId).set({
      token:String(token),
      platform:platform==='android'?'android':'web',
      ...(platform==='web'?{origin:window.location.origin}:{}),
      updatedAt:firebase.database.ServerValue.TIMESTAMP
    });
    try{localStorage.setItem('pestPushTokenId:'+uid,tokenId);}catch(_){}

  function loadFirebaseMessagingCompat(){
    if(window.firebase&&window.firebase.messaging)return Promise.resolve();
    if(window.PEST_FIREBASE_MESSAGING_SCRIPT)return window.PEST_FIREBASE_MESSAGING_SCRIPT;
    window.PEST_FIREBASE_MESSAGING_SCRIPT=new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js';
      script.async=true;
      script.onload=()=>resolve();
      script.onerror=()=>reject(new Error('Could not load Firebase Messaging for web push.'));
      document.head.appendChild(script);
    });
    return window.PEST_FIREBASE_MESSAGING_SCRIPT;
  }
  async function setupWebPushForCurrentUser(requestPermission=false,knownConfig=null){
    if(!('serviceWorker' in navigator)||typeof Notification==='undefined')throw new Error(rtl?'المتصفح لا يدعم Web Push.':'This browser does not support Web Push.');
    const config=knownConfig||await loadPushConfig(true);
    if(!config.webVapidKey)throw new Error(rtl?'مفتاح Web Push العام غير مضبوط في Cloudflare بعد.':'The public Web Push VAPID key is not configured in Cloudflare yet.');
    let permission=Notification.permission;
    if(permission==='default'&&requestPermission)permission=await Notification.requestPermission();
    if(permission!=='granted'){
      if(requestPermission)throw new Error(rtl?'لم يتم السماح بإشعارات المتصفح. فعّلها من إعدادات الموقع.':'Browser notification permission was not granted. Enable it in site settings.');
      return null;
    }
    await loadFirebaseMessagingCompat();
    if(typeof firebase.messaging.isSupported==='function'&&!await firebase.messaging.isSupported())throw new Error(rtl?'هذا المتصفح لا يدعم Firebase Web Push في إعداداته الحالية.':'Firebase Web Push is not supported in this browser configuration.');
    const appBase=new URL('./',window.location.href);
    const serviceWorkerUrl=new URL('firebase-messaging-sw.js',appBase).toString();
    await navigator.serviceWorker.register(serviceWorkerUrl,{scope:appBase.pathname});
    // register() can resolve while the new worker is still installing. Firebase
    // PushManager.subscribe requires an active worker, so wait for the matching
    // scope to become ready before requesting the FCM token.
    const registration=await navigator.serviceWorker.ready;
    if(!registration.active)throw new Error(rtl?'لم يكتمل تشغيل خدمة الإشعارات في المتصفح. أعد المحاولة بعد لحظات.':'The notification service worker is not active yet. Please retry in a moment.');
    const messaging=firebase.messaging();
    if(!window.PEST_WEB_PUSH_FOREGROUND_LISTENER){
      messaging.onMessage(payload=>window.dispatchEvent(new CustomEvent('pest-push-received',{detail:payload?.data||{}})));
      window.PEST_WEB_PUSH_FOREGROUND_LISTENER=true;
    }
    const token=await messaging.getToken({vapidKey:config.webVapidKey,serviceWorkerRegistration:registration});
    if(!token)throw new Error(rtl?'لم يرجع Firebase رمزًا لهذا المتصفح.':'Firebase did not return a browser registration token.');
    await persistPushToken(token,'web');
    return {token,config};
  }
  async function enableDeviceNotifications(){

    setPushBusy(true);
    setPushStatus(rtl?'جاري تجهيز إشعارات هذا الجهاز...':'Preparing this device for push notifications...');
    try{
      let config=window.PEST_PUSH_CONFIG||{senderConfigured:false,webVapidKey:'',webPushConfigured:false};
      try{config=await loadPushConfig(true);}
      catch(configError){console.warn('Push sender configuration is not available yet:',configError);config={senderConfigured:false,webVapidKey:'',webPushConfigured:false};}
      if(window.PEST_NATIVE?.isNative){

          return;
        }
        setPushStatus(config.senderConfigured
          ?(rtl?'تم طلب تسجيل الجهاز؛ سيتم حفظ رمز FCM تلقائيًا.':'Device registration requested; the FCM token will be saved automatically.')

      }
      const result=await setupWebPushForCurrentUser(true,config);

      setPushStatus(config.senderConfigured

        :(rtl?'تم تسجيل المتصفح. تبقى خطوة إعداد خدمة الإرسال على Cloudflare.':'Browser token saved. Cloudflare sender setup is still required.'));
    }catch(error){

  async function sendPushWorkerRequest(path,body){
    const user=auth.currentUser;
    if(!user)throw new Error('No authenticated Firebase session.');
    const send=async(forceRefresh)=>{
      const idToken=await user.getIdToken(Boolean(forceRefresh));
      return fetch(PUSH_WORKER_BASE+path,{
        method:'POST',
        headers:{'Authorization':'Bearer '+idToken,'Content-Type':'application/json'},
        body:JSON.stringify(body||{}),
        cache:'no-store'
      });
    };
    let response=await send(false);
    if(response.status===401)response=await send(true);
    const payload=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(payload.error||('Push service returned HTTP '+response.status+'.'));
    return payload;
  }

  function normalizeWhatsAppNumber(value){
    let digits=String(value||'').replace(/\D/g,'');
    if(digits.startsWith('00'))digits=digits.slice(2);
    if(digits.startsWith('0')&&digits.length>=10)digits='20'+digits.slice(1);
    else if(digits.length===10&&digits.startsWith('1'))digits='20'+digits;
    return digits.length>=8&&digits.length<=15?digits:'';
  }

  function openWhatsAppDraft(){
    const textBody=[String(whatsappMessage.subject||'').trim(),String(whatsappMessage.body||'').trim()].filter(Boolean).join('\n\n');

    const drafts=[];
    const skipped=[];
    requested.forEach(contact=>{
      const digits=normalizeWhatsAppNumber(contact.phone);
      if(!digits){skipped.push(contact.label);return;}
      drafts.push({key:contact.key,label:contact.label,phone:digits,url:'https://wa.me/'+digits+'?text='+encodeURIComponent(textBody)});
    });
    if(!drafts.length)return alert(rtl?'لا توجد أرقام WhatsApp صحيحة ضمن الجهات المحددة.':'None of the selected contacts has a valid WhatsApp number.');
    setWhatsappDrafts(drafts);
    // Open only the first chat immediately; browsers often block bulk pop-ups.
    window.open(drafts[0].url,'_blank','noopener,noreferrer');
    void addLog('تجهيز رسائل WhatsApp لعدد '+drafts.length+' جهة اتصال');
    if(skipped.length)alert(rtl?'تم تجهيز '+drafts.length+' محادثة وتجاهل '+skipped.length+' جهة بدون رقم صالح.':'Prepared '+drafts.length+' chats; skipped '+skipped.length+' contacts without a valid number.');

  function assistantSearchScore(record,query){
    const q=String(query||'').toLowerCase();

    const hay=Object.values(record||{}).filter(v=>v===null||['string','number','boolean'].includes(typeof v)).join(' ').toLowerCase();
    return words.reduce((score,w)=>score+(hay.includes(w)?1:0),0);
  }

  function reportSafeCell(value,key=''){
    if(/password|token|secret|api.?key|authorization|refresh.?token|access.?token|avatar|photo|image|base64|dataurl|binary|download.?url|preview.?url|signed.?url|file.?url|logo/i.test(String(key||'')))return undefined;
    if(value===undefined)return undefined;
    if(value===null)return '';
    if(typeof value==='number'&&/(?:At|timestamp)$/i.test(String(key||''))&&value>1000000000000){
      const date=new Date(value);return Number.isNaN(date.getTime())?value:date.toLocaleString(rtl?'ar-EG-u-nu-latn':'en-US');
    }
    if(Array.isArray(value)){
      return value.map(item=>{
        if(item===null||item===undefined)return '';
        if(typeof item==='object')return item.name||item.fullName||item.username||item.title||item.code||item.fileName||JSON.stringify(item);
        return String(item);
      }).filter(Boolean).join('، ');
    }
    if(typeof value==='object'){
      const safe={};
      Object.entries(value).forEach(([childKey,childValue])=>{
        const child=reportSafeCell(childValue,childKey);
        if(child!==undefined&&child!=='')safe[childKey]=child;
      });
      try{return JSON.stringify(safe);}catch(_){return '';}
    }
    if(typeof value==='string'){
      const clean=value.replace(/\u0000/g,'');
      return clean.length>3500?clean.slice(0,3500)+'…':clean;
    }
    return value;
  }
  function normalizeReportRows(rows){
    return (Array.isArray(rows)?rows:[]).map(row=>{
      const source=row&&typeof row==='object'&&!Array.isArray(row)?row:{detail:row};
      const output={};
      Object.entries(source).forEach(([key,value])=>{
        const safe=reportSafeCell(value,key);
        if(safe!==undefined)output[reportFieldLabel(key)]=safe;
      });
      return output;
    });
  }
  function escapeReportHtml(value){

      const report=buildCurrentScreenReport(),normalized=report.datasets.map(dataset=>({...dataset,rows:normalizeReportRows(dataset.rows)}));
      const workbook=Excel.utils.book_new();

      const navy='17365D',blue='1F4E78',teal='0F766E',lightBlue='EAF2F8',pale='F4F7FB',green='E2F0D9',amber='FFF2CC',white='FFFFFF',ink='243447',muted='64748B',line='D7E0EA';
      const edge={style:'thin',color:{rgb:line}};
      const boxBorder={top:edge,bottom:edge,left:edge,right:edge};
      const font=(color,bold,size)=>({name:'Arial',sz:size||10,bold:!!bold,color:{rgb:color||ink}});
      const fill=color=>({patternType:'solid',fgColor:{rgb:color}});
      const applyRange=(sheet,range,style)=>{
        const decoded=Excel.utils.decode_range(range);
        for(let row=decoded.s.r;row<=decoded.e.r;row++){
          for(let col=decoded.s.c;col<=decoded.e.c;col++){
            const address=Excel.utils.encode_cell({r:row,c:col});
            if(!sheet[address])sheet[address]={t:'s',v:''};
            sheet[address].s=JSON.parse(JSON.stringify(style));
          }
        }
      };
      const merge=(sheet,range)=>{sheet['!merges']=sheet['!merges']||[];sheet['!merges'].push(Excel.utils.decode_range(range));};
      const colName=index=>{let n=index+1,name='';while(n){const rem=(n-1)%26;name=String.fromCharCode(65+rem)+name;n=Math.floor((n-1)/26);}return name;};
      const summaryRows=[
        [report.company],
        [report.title],
        [report.subtitle],
        [rtl?'تاريخ إعداد التقرير':'Report date',report.generatedAt.toLocaleString(rtl?'ar-EG-u-nu-latn':'en-US'),rtl?'إعداد':'Prepared by',report.generatedBy,rtl?'عدد أوراق التفاصيل':'Detail sheets',normalized.length],
        [rtl?'نطاق الفلاتر':'Applied filters',report.filterText],
        [],
        [rtl?'ملخص التقرير':'REPORT SUMMARY'],
        [rtl?'المؤشر':'Metric',rtl?'القيمة':'Value',rtl?'المؤشر':'Metric',rtl?'القيمة':'Value',rtl?'المؤشر':'Metric',rtl?'القيمة':'Value',rtl?'المؤشر':'Metric',rtl?'القيمة':'Value']
      ];
      const metrics=report.metrics.length?report.metrics:[{label:rtl?'عدد السجلات':'Records',value:normalized.reduce((sum,item)=>sum+item.rows.length,0)}];
      for(let index=0;index<metrics.length;index+=4){
        const row=[];
        for(let slot=0;slot<4;slot++){
          const metric=metrics[index+slot];
          row.push(metric?metric.label:'',metric?metric.value:'');
        }
        summaryRows.push(row);
      }
      summaryRows.push([]);
      const datasetTitleRow=summaryRows.length;
      summaryRows.push([rtl?'محتويات التقرير':'REPORT CONTENTS']);
      const datasetHeaderRow=summaryRows.length;
      summaryRows.push([rtl?'ورقة التفاصيل':'Detail sheet',rtl?'عدد السجلات':'Records',rtl?'الوصف':'Description']);
      normalized.forEach(dataset=>summaryRows.push([dataset.name,dataset.rows.length,rtl?'تفاصيل السجلات المتاحة حسب صلاحيات الشاشة':'Records available within this screen and its permissions']));
      const summary=Excel.utils.aoa_to_sheet(summaryRows);
      summary['!cols']=[{wch:23},{wch:22},{wch:23},{wch:22},{wch:23},{wch:22},{wch:23},{wch:22}];
      summary['!rows']=[{hpt:32},{hpt:27},{hpt:22},{hpt:28},{hpt:36},{hpt:9},{hpt:25},{hpt:30},...metrics.map(()=>({hpt:27})),{hpt:9},{hpt:25},{hpt:28},...normalized.map(()=>({hpt:26}))];
      summary['!pageSetup']={orientation:'landscape',fitToWidth:1,fitToHeight:1};
      summary['!freeze']={xSplit:0,ySplit:8,topLeftCell:'A9',activePane:'bottomLeft',state:'frozen'};
      merge(summary,'A1:H1');merge(summary,'A2:H2');merge(summary,'A3:H3');merge(summary,'A5:H5');merge(summary,'A7:H7');
      merge(summary,'A'+(datasetTitleRow+1)+':H'+(datasetTitleRow+1));
      applyRange(summary,'A1:H1',{font:font(white,true,18),fill:fill(navy),alignment:{horizontal:'center',vertical:'center'},border:boxBorder});
      applyRange(summary,'A2:H2',{font:font(white,true,14),fill:fill(blue),alignment:{horizontal:'center',vertical:'center'},border:boxBorder});
      applyRange(summary,'A3:H3',{font:font(muted,false,10),fill:fill(pale),alignment:{horizontal:'center',vertical:'center',wrapText:true},border:boxBorder});
      applyRange(summary,'A4:H5',{font:font(ink,false,10),fill:fill('F8FAFC'),alignment:{horizontal:rtl?'right':'left',vertical:'center',wrapText:true},border:boxBorder});
      applyRange(summary,'A7:H7',{font:font(white,true,12),fill:fill(teal),alignment:{horizontal:'center',vertical:'center'},border:boxBorder});
      applyRange(summary,'A8:H8',{font:font(white,true,10),fill:fill(blue),alignment:{horizontal:'center',vertical:'center',wrapText:true},border:boxBorder});
      for(let row=8;row<8+Math.ceil(metrics.length/4);row++){
        for(let slot=0;slot<4;slot++){
          const col=slot*2;
          applyRange(summary,Excel.utils.encode_range({s:{r:row,c:col},e:{r:row,c:col}}),{font:font(white,true,9),fill:fill(blue),alignment:{horizontal:'center',vertical:'center',wrapText:true},border:boxBorder});
          applyRange(summary,Excel.utils.encode_range({s:{r:row,c:col+1},e:{r:row,c:col+1}}),{font:font(ink,true,11),fill:fill(row%2?lightBlue:'F8FAFC'),alignment:{horizontal:'center',vertical:'center',wrapText:true},border:boxBorder});
        }
      }
      applyRange(summary,Excel.utils.encode_range({s:{r:datasetTitleRow,c:0},e:{r:datasetTitleRow,c:7}}),{font:font(white,true,12),fill:fill(teal),alignment:{horizontal:'center',vertical:'center'},border:boxBorder});
      applyRange(summary,Excel.utils.encode_range({s:{r:datasetHeaderRow,c:0},e:{r:datasetHeaderRow,c:2}}),{font:font(white,true,10),fill:fill(blue),alignment:{horizontal:'center',vertical:'center'},border:boxBorder});
      if(normalized.length)applyRange(summary,Excel.utils.encode_range({s:{r:datasetHeaderRow+1,c:0},e:{r:datasetHeaderRow+normalized.length,c:2}}),{font:font(ink,false,10),fill:fill('FFFFFF'),alignment:{horizontal:rtl?'right':'left',vertical:'center',wrapText:true},border:boxBorder});
      Excel.utils.book_append_sheet(workbook,summary,rtl?'ملخص التقرير':'Summary');
      const usedNames=new Set([rtl?'ملخص التقرير':'Summary']);
      normalized.forEach((dataset,datasetIndex)=>{
        const columns=[];
        dataset.rows.forEach(row=>Object.keys(row).forEach(key=>{if(!columns.includes(key))columns.push(key);}));
        if(!columns.length)columns.push(rtl?'بيان':'Details');
        const matrix=[columns,...dataset.rows.map(row=>columns.map(key=>row[key]===undefined?'':row[key]))];
        if(!dataset.rows.length)matrix.push([rtl?'لا توجد سجلات ضمن نطاق التقرير':'No records within the report scope']);
        const sheet=Excel.utils.aoa_to_sheet(matrix);
        const lastCol=colName(columns.length-1),lastRow=matrix.length;
        const widths=columns.map((column,columnIndex)=>{
          const sample=matrix.slice(1,Math.min(matrix.length,61)).map(row=>String(row[columnIndex]===undefined?'':row[columnIndex]));
          return {wch:Math.max(13,Math.min(48,Math.max(String(column).length,...sample.map(value=>Math.min(48,value.length)))+2))};
        });
        sheet['!cols']=widths;
        sheet['!autofilter']={ref:'A1:'+lastCol+Math.max(1,dataset.rows.length+1)};
        sheet['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
        sheet['!pageSetup']={orientation:'landscape',fitToWidth:1,fitToHeight:0};
        const decoded=Excel.utils.decode_range(sheet['!ref']||'A1:A1');
        for(let row=decoded.s.r;row<=decoded.e.r;row++){
          for(let col=decoded.s.c;col<=decoded.e.c;col++){
            const address=Excel.utils.encode_cell({r:row,c:col});
            if(!sheet[address])sheet[address]={t:'s',v:''};
            const cell=sheet[address],header=row===0;
            cell.s={
              font:header?font(white,true,10):font(ink,false,9),
              fill:fill(header?blue:(row%2===0?'F4F7FB':white)),
              alignment:{horizontal:typeof cell.v==='number'?'right':(rtl?'right':'left'),vertical:'center',wrapText:true},
              border:boxBorder
            };
            if(!header&&typeof cell.v==='number'&&/(amount|received|spent|balance|cost|settled|quantity|limit|value|المبلغ|الرصيد|له|عليه|الكمية|التكلفة)/i.test(columns[col]))cell.s.numFmt='#,##0.00;[Red](#,##0.00);-';

        }

        let sheetName=rawName,serial=2;
        while(usedNames.has(sheetName)){const suffix=' '+serial++;sheetName=rawName.slice(0,31-suffix.length)+suffix;}
        usedNames.add(sheetName);
        Excel.utils.book_append_sheet(workbook,sheet,sheetName);
      });
      const stamp=report.generatedAt.toISOString().slice(0,10).replace(/-/g,'');
      Excel.writeFile(workbook,'Pest_'+reportSafeFilePart(report.title)+'_'+stamp+'.xlsx');
      void addLog('تصدير تقرير Excel: '+report.title,currentUser,{entityType:'report',entityId:tab,metadata:{sheets:normalized.length+1,records:normalized.reduce((sum,item)=>sum+item.rows.length,0)}});
    }catch(error){
      console.error('Report Excel export:',error);
      alert((rtl?'تعذر إنشاء تقرير Excel: ':'Could not create Excel report: ')+String(error.message||error));
    }
  }

  function beginAttachmentPreviewResize(event){
    if(event.pointerType==='mouse'&&event.button!==0)return;
    event.preventDefault();
    const mobile=window.innerWidth<768;
    const direction=document.documentElement.dir==='rtl'?'rtl':'ltr';
    const onMove=moveEvent=>{
      if(mobile){
        setAttachmentPreviewHeight(Math.max(220,Math.min(Math.round(window.innerHeight*.78),Math.round(window.innerHeight-moveEvent.clientY))));
      }else{
        const next=direction==='rtl'?moveEvent.clientX:window.innerWidth-moveEvent.clientX;
        setAttachmentPreviewWidth(Math.max(280,Math.min(Math.round(window.innerWidth*.68),Math.round(next))));
      }
    };
    const onStop=()=>{
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onStop);
      window.removeEventListener('pointercancel',onStop);
    };
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onStop);
    window.addEventListener('pointercancel',onStop);
  }
  function resizeAttachmentPreviewByKeyboard(event){
    const mobile=window.innerWidth<768;
    const arrows=mobile?['ArrowUp','ArrowDown']:['ArrowLeft','ArrowRight'];
    if(!arrows.includes(event.key)&&!['Home','End'].includes(event.key))return;
    event.preventDefault();
    if(mobile){
      if(event.key==='Home')setAttachmentPreviewHeight(220);
      else if(event.key==='End')setAttachmentPreviewHeight(Math.round(window.innerHeight*.78));
      else setAttachmentPreviewHeight(value=>Math.max(220,Math.min(Math.round(window.innerHeight*.78),value+(event.key==='ArrowUp'?24:-24))));
    }else{
      const direction=document.documentElement.dir==='rtl'?'rtl':'ltr';
      if(event.key==='Home')setAttachmentPreviewWidth(280);
      else if(event.key==='End')setAttachmentPreviewWidth(Math.min(760,Math.round(window.innerWidth*.68)));
      else{
        const increase=(event.key==='ArrowRight')===(direction==='rtl');
        setAttachmentPreviewWidth(value=>Math.max(280,Math.min(Math.round(window.innerWidth*.68),value+(increase?24:-24))));
      }
    }
  }

ompleted')}</option><option value="notPaid">{tr('notPaid')}</option></select><label className="text-sm">{tr('fromDate')}<input type="date" className="block border rounded-lg p-2 w-full" value={reportFrom} onChange={e=>setReportFrom(e.target.value)}/></label><label className="text-sm">{tr('toDate')}<input type="date" className="block border rounded-lg p-2 w-full" value={reportTo} onChange={e=>setReportTo(e.target.value)}/></label><button onClick={()=>{setReportSearch('');setReportFrom('');setReportTo('');setReportStatus('all');}} className="bg-gray-100 rounded-lg p-3">{tr('clear')}</button></section>

              <textarea rows="1" className="app-chat-compose-input" value={onlineChatDraft} onChange={e=>setOnlineChatDraft(e.target.value)} onKeyDown={handleMessageComposerKeyDown} placeholder={rtl?'اكتب رسالة خاصة...':'Write a private message...'}></textarea>
              {hasPermission('attachments','add')&&<label className="app-chat-attach-button" title={rtl?'إرفاق صورة أو ملف':'Attach an image or file'}><i className="fas fa-paperclip"></i><span>{rtl?'مرفق':'Attached'}</span>{onlineChatPendingAttachments.length>0&&<b>{onlineChatPendingAttachments.length}</b>}<input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.xls,.xlsx,.csv,.txt" className="hidden" onChange={e=>selectChatAttachments(e,setOnlineChatPendingAttachments)}/></label>}
              <button type="submit" className="app-chat-send-button" disabled={onlineChatSending||(!onlineChatDraft.trim()&&!onlineChatPendingAttachments.length)||!hasPermission('messages','add')} title={rtl?'إرسال للطرف الآخر فقط':'Send only to this person'}><i className={'fas '+(onlineChatSending?'fa-spinner fa-spin':'fa-paper-plane')}></i><span>{onlineChatSending?(rtl?'جارٍ الإرسال...':'Sending...'):(rtl?'إرسال':'Send')}</span></button>
            </form>
            <div className="app-online-chat-footnote">{rtl?'هذه المحادثة خاصة بينك وبين هذا المستخدم فقط.':'This conversation is private between you and this user only.'}</div>
          </section>
        </div>}
        <div className="app-floating-actions">
          <button type="button" className="app-messages-launcher" onClick={()=>{setAssistantOpen(false);setMessageShortcutOpen(old=>!old);}} aria-label={rtl?'فتح الرسائل':'Open messages'}><i className="fas fa-comments text-lg"></i><span>{rtl?'الرسائل':'Messages'}</span>{shortcutUnreadCount>0&&<b>{shortcutUnreadCount>99?'99+':shortcutUnreadCount}</b>}</button>
          {hasPermission('aiAgent','view')&&<button type="button" className="app-ai-launcher" onClick={()=>{setMessageShortcutOpen(false);setAssistantOpen(old=>!old);}} aria-label={rtl?'فتح المساعد الذكي':'Open AI assistant'}><i className="fas fa-wand-magic-sparkles text-lg"></i><span>{rtl?'اسأل المساعد':'Ask AI'}</span></button>}
        </div>
      </>}
  </div>;
}

class AppErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={hasError:false,error:null}; }
  static getDerivedStateFromError(error){ return {hasError:true,error}; }
  componentDidCatch(error,info){ console.error('Application render error:',error,info); }
  render(){
    if(this.state.hasError){
      const msg=this.state.error && this.state.error.message ? this.state.error.message : 'Unknown error';
      return <div className="min-h-screen bg-slate-100 flex items-center justify-center p-5"><div className="bg-white max-w-2xl w-full rounded-xl border shadow p-6"><h1 className="font-bold text-red-700 text-xl mb-3">تعذر عرض الشاشة الرئيسية</h1><p className="text-gray-700 mb-3">حدث خطأ أثناء تشغيل الواجهة. أرسل نص الخطأ التالي للدعم الفني:</p><pre className="whitespace-pre-wrap break-words bg-gray-100 rounded p-3 text-sm">{msg}</pre><button className="mt-4 bg-blue-600 text-white rounded px-4 py-2" onClick={()=>window.location.reload()}>إعادة تحميل البرنامج</button></div></div>;
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppErrorBoundary><App/></AppErrorBoundary>);

</script>
<script>
(()=>{
  const WORKER_URL=window.location.hostname.endsWith('-pest-platform.ai-mhdiab90.workers.dev')
    ? window.location.origin
    : 'https://pest-platform.ai-mhdiab90.workers.dev';
  const agentRequest=async(path,method='POST',body)=>{
    const firebaseAuth=window.PEST_FIREBASE_AUTH;
    const user=firebaseAuth&&firebaseAuth.currentUser;
    if(!user)throw new Error('No active Firebase session. Please sign in again.');
    const send=async(forceRefresh)=>{
      const idToken=await user.getIdToken(Boolean(forceRefresh));
      const headers={'Authorization':'Bearer '+idToken};
      const options={method,headers,cache:'no-store'};
      if(body!==undefined){headers['Content-Type']='application/json';options.body=JSON.stringify(body);}
      return fetch(WORKER_URL+path,options);
    };
    let response=await send(false);
    if(response.status===401)response=await send(true);
    let payload={};
    try{payload=await response.json();}catch(_){}
    if(!response.ok)throw new Error(payload.error||('AI Agent returned HTTP '+response.status+'.'));
    return payload;
  };
  window.pestAIAgentAsk=(prompt,context)=>agentRequest('/agent','POST',{prompt:String(prompt||''),context:String(context||'')});
  window.pestAIAgentExecute=actions=>agentRequest('/execute','POST',{actions:Array.isArray(actions)?actions:[]});
  window.pestAIAgentListDashboards=()=>agentRequest('/dashboards','GET');
  window.pestAIAgentDeleteDashboard=id=>agentRequest('/dashboards','DELETE',{id:String(id||'')});
  window.pestAIAgentListSchedules=()=>agentRequest('/schedules','GET');
  window.pestAIAgentCreateSchedule=schedule=>agentRequest('/schedules','POST',schedule||{});
  window.pestAIAgentUpdateSchedule=update=>agentRequest('/schedules','POST',update||{});
  window.pestAIAgentDeleteSchedule=id=>agentRequest('/schedules','DELETE',{id:String(id||'')});
  window.pestWhatsAppNotifyMessage=messageId=>agentRequest('/whatsapp/notify-message','POST',{messageId:String(messageId||'')});
  window.pestAIAsk=async prompt=>{
    const result=await window.pestAIAgentAsk(prompt,'');
    return result&&result.answer?result.answer:'';
  };
  window.pestAIStatus='checking';
  window.pestAIProviders={cloudflare:false,openrouter:false};
  window.pestAISchedulingAvailable=false;
  window.pestWhatsAppNotificationsAvailable=false;
  (async()=>{
    try{
      const response=await fetch(WORKER_URL+'/health',{method:'GET',cache:'no-store'});
      const health=await response.json();
      if(!response.ok||health.ok!==true)throw new Error('AI Agent Worker health check failed.');
      window.pestAIProviders=health.providers||{};
      window.pestAIModels=health.models||{};
      window.pestAISchedulingAvailable=health.schedulingAvailable===true;
      window.pestWhatsAppNotificationsAvailable=health.whatsappNotificationsAvailable===true;
      window.pestAIStatus=(window.pestAIProviders.cloudflare||window.pestAIProviders.openrouter)?'ready':'unavailable';
    }catch(error){
      console.error('AI Agent Worker health check:',error);
      window.pestAIStatus='unavailable';
    }
    window.dispatchEvent(new Event('pest-ai-ready'));
  })();
})();;
</script>
</body>
</html>
