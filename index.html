<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة المشروعات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div id="root" class="w-full max-w-md p-4"></div>

    <script type="text/babel">
        function App() {
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (username === 'admin' && password === 'Pest@1234') {
                    setIsLoggedIn(true);
                    setError('');
                } else {
                    setError('اسم المستخدم أو كلمة المرور غير صحيحة (استخدم admin / Pest@1234)');
                }
            };

            if (!isLoggedIn) {
                return (
                    <div className="bg-white rounded-2xl shadow-xl p-8 border border-gray-200">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-white text-2xl font-bold">
                                <i className="fa-solid fa-building"></i>
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800">تسجيل الدخول للنظام</h2>
                        </div>
                        {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-xs mb-4 text-center font-bold">{error}</div>}
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1">اسم المستخدم</label>
                                <input type="text" required className="w-full border p-2.5 rounded-lg text-sm outline-none focus:border-blue-600" value={username} onChange={e => setUsername(e.target.value)} placeholder="admin" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1">كلمة المرور</label>
                                <input type="password" required className="w-full border p-2.5 rounded-lg text-sm outline-none focus:border-blue-600" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">دخول</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-2xl shadow-xl p-8 border border-gray-200 text-center space-y-4">
                    <h2 className="text-2xl font-bold text-green-600">مرحباً بك يا مدير النظام!</h2>
                    <p className="text-gray-600 text-sm">تم تسجيل الدخول بنجاح والاتصال بالواجهة الرئيسية.</p>
                    <button onClick={() => setIsLoggedIn(false)} className="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold">تسجيل الخروج</button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
