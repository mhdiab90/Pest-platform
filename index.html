    /* User-selectable navigation layouts and recently opened screens */
    .app-sidebar{display:flex;flex-direction:column;gap:8px}
    .app-sidebar-nav-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
    .app-recent-screens{flex:0 0 auto;border-top:1px solid rgba(100,116,139,.18);padding-top:10px;margin-top:8px}
    .app-recent-heading{display:flex;align-items:center;gap:7px;color:#64748b;font-size:.78rem;font-weight:800;padding:0 7px 7px}
    .app-recent-list{display:flex;flex-direction:column;gap:4px}
    .app-recent-item{display:flex;align-items:center;gap:8px;min-width:0;width:100%;padding:7px 9px;border:1px solid transparent;border-radius:8px;text-align:start;color:#475569;font-size:.82rem;transition:background .15s,border-color .15s}
    .app-recent-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .app-recent-item:hover{background:rgba(255,255,255,.7);border-color:rgba(100,116,139,.13)}
    .app-recent-item.active{background:var(--brand-soft);color:var(--brand-hover);border-color:color-mix(in srgb,var(--brand) 18%,white);font-weight:700}
    .app-top-navigation{position:relative;z-index:35;flex:0 0 auto;width:100%;padding:10px 14px 8px;background:rgba(255,255,255,.76);border-bottom:1px solid rgba(100,116,139,.13);box-shadow:0 5px 16px rgba(15,23,42,.035);backdrop-filter:blur(10px)}
    .app-top-navigation-main{overflow:visible}
    .app-nav-grid-top{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
    .app-nav-grid-top .app-nav-group{position:relative;flex:0 0 auto;margin:0}
    .app-nav-grid-top .app-nav-parent{width:auto;min-height:40px;padding:9px 12px;white-space:nowrap;background:rgba(255,255,255,.72)}
    .app-nav-grid-top .nav-btn{width:auto;min-height:40px;padding:9px 12px;white-space:nowrap}
    .app-nav-grid-top .app-nav-children{position:absolute;top:calc(100% + 5px);inset-inline-start:0;z-index:120;min-width:220px;max-width:min(88vw,320px);max-height:62vh;overflow:auto;margin:0;padding:7px;background:#fff;border:1px solid rgba(100,116,139,.18);border-inline-start-width:1px;border-radius:12px;box-shadow:0 14px 34px rgba(15,23,42,.15)}
    .app-nav-grid-top .app-nav-child{padding:9px 10px;border-radius:8px}
    .app-nav-grid-top .app-nav-group.has-active>.app-nav-parent{background:var(--brand-soft);color:var(--brand-hover);border-color:color-mix(in srgb,var(--brand) 22%,white)}
    .app-recent-screens.is-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:0;border-bottom:0;padding-top:8px;margin-top:7px}
    .app-recent-screens.is-top .app-recent-heading{padding:0;white-space:nowrap}
    .app-recent-screens.is-top .app-recent-list{flex:1 1 auto;display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;min-width:0}
    .app-recent-screens.is-top .app-recent-item{width:auto;max-width:220px;padding:5px 9px;background:rgba(255,255,255,.66);border-color:rgba(100,116,139,.12)}
    .app-recent-screens.is-top .app-recent-item.active{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 20%,white)}
    .app-layout-toggle{flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;color:#334155;border:1px solid rgba(100,116,139,.15);background:rgba(255,255,255,.26)}
    .app-layout-toggle:hover{background:rgba(255,255,255,.58)}
    @media(max-width:767px){
      .app-sidebar{max-height:none;overflow:visible}

    /* Balanced two-tone theme: slightly deeper navigation and softly tinted content */
    :root{
      --brand-tint-1:color-mix(in srgb,var(--brand) var(--brand-mix-1,5%),white);
      --brand-tint-2:color-mix(in srgb,var(--brand) var(--brand-mix-2,10%),white);
      --brand-tint-3:color-mix(in srgb,var(--brand) var(--brand-mix-3,16%),white);
      --brand-tint-4:color-mix(in srgb,var(--brand) var(--brand-mix-4,22%),white);
      --brand-tint-border:color-mix(in srgb,var(--brand) 24%,#dbe2ea);
    }
    .app-shell-header{
      background:linear-gradient(112deg,var(--brand-tint-3) 0%,var(--brand-tint-2) 54%,var(--brand-tint-4) 100%)!important;
    }
    .app-sidebar{
      background:linear-gradient(165deg,var(--brand-tint-3) 0%,var(--brand-tint-2) 56%,var(--brand-tint-3) 100%)!important;
      border-color:var(--brand-tint-border)!important;
    }
    .app-sidebar .app-nav-parent{
      background:color-mix(in srgb,var(--brand) 8%,white);
      border-color:color-mix(in srgb,var(--brand) 19%,white);
    }
    .app-sidebar .app-nav-parent:hover{
      background:var(--brand-tint-3);
      border-color:color-mix(in srgb,var(--brand) 29%,white);
    }
    .app-sidebar .app-nav-parent[aria-expanded="true"]{
      background:var(--brand-tint-4);
      border-color:color-mix(in srgb,var(--brand) 34%,white);
    }
    .app-sidebar .app-nav-child.active,.app-sidebar .nav-btn.active{
      background:var(--brand-tint-2);
      border-color:color-mix(in srgb,var(--brand) 27%,white);
    }
    .app-top-navigation{
      background:linear-gradient(105deg,var(--brand-tint-2) 0%,var(--brand-tint-1) 52%,var(--brand-tint-3) 100%);
      border-bottom-color:var(--brand-tint-border);
    }
    .app-nav-grid-top .app-nav-parent{
      background:color-mix(in srgb,var(--brand) 7%,white);
      border:1px solid color-mix(in srgb,var(--brand) 16%,white);
    }
    .app-nav-grid-top .app-nav-parent:hover,
    .app-nav-grid-top .nav-btn:hover{
      background:var(--brand-tint-3);
    }
    .app-nav-grid-top .app-nav-group.has-active>.app-nav-parent{
      background:var(--brand-tint-4);
      border-color:color-mix(in srgb,var(--brand) 32%,white);
    }
    .app-collapsible>summary{
      background:linear-gradient(105deg,var(--brand-tint-3) 0%,var(--brand-tint-2) 58%,#fff 100%);
      border-inline-start-width:4px;
    }
    .app-collapsible{
      background:#fff;
      border-color:var(--brand-tint-border);
    }
    .app-workspace .bg-white.rounded-xl,
    .app-workspace section.bg-white{
      background:linear-gradient(145deg,#fff 0%,var(--brand-tint-1) 100%);
      border-color:color-mix(in srgb,var(--brand) 9%,#e5e7eb);
    }
    .app-recent-item.active,
    .app-recent-screens.is-top .app-recent-item.active{
      background:var(--brand-tint-3);
      border-color:color-mix(in srgb,var(--brand) 27%,white);
    }

  function playIncomingNotificationSound(){
    if(!notificationPreferencesRef.current.sound)return;
    const context=notificationAudioRef.current;
    if(!context||context.state!=='running')return;
    try{
      const now=context.currentTime;
      [880,1174].forEach((frequency,index)=>{
        const oscillator=context.createOscillator();
        const gain=context.createGain();
        oscillator.type='sine';
        oscillator.frequency.setValueAtTime(frequency,now+index*0.13);
        gain.gain.setValueAtTime(0.0001,now+index*0.13);
        gain.gain.exponentialRampToValueAtTime(0.12,now+index*0.13+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+index*0.13+0.12);
        oscillator.connect(gain);gain.connect(context.destination);
        oscillator.start(now+index*0.13);oscillator.stop(now+index*0.13+0.14);
      });
    }catch(err){console.warn('Could not play notification sound:',err);}
  }

  async function attachmentWorkerRequest(path,method='GET',body,extraHeaders={},rawBody=false,asBlob=false){
    const user=window.PEST_FIREBASE_AUTH?.currentUser||auth.currentUser;
    if(!user)throw new Error(rtl?'جلسة الدخول غير موجودة. سجّل الدخول مرة أخرى.':'No active Firebase session. Please sign in again.');
    const send=async(forceRefresh)=>{
      const idToken=await user.getIdToken(Boolean(forceRefresh));
      if(!idToken)throw new Error('Firebase did not return an ID token.');
      const headers={'Authorization':'Bearer '+idToken,...(extraHeaders||{})};
      const options={method,headers,cache:'no-store'};
      if(body!==undefined){if(rawBody)options.body=body;else{headers['Content-Type']='application/json';options.body=JSON.stringify(body);}}
      return fetch('https://pest-platform.ai-mhdiab90.workers.dev'+path,options);
    };
    let response=await send(false);
    if(response.status===401){
      // Refresh the Firebase ID token and retry once. The same File/Blob body
      // is reusable, so failed attachment uploads do not need to be selected again.
      try{response=await send(true);}
      catch(refreshError){throw new Error((rtl?'تعذر تجديد جلسة Firebase. سجّل الخروج ثم ادخل مرة أخرى. ':'Could not refresh the Firebase session. Sign out and sign in again. ')+String(refreshError.message||refreshError));}
    }
    if(!response.ok){
      let payload={};try{payload=await response.json();}catch(_){}
      const detail=payload.error||('Attachment service returned HTTP '+response.status+'.');
      if(response.status===401)throw new Error((rtl?'رفضت خدمة المرفقات رمز الدخول بعد تحديثه: ':'The attachment service rejected the refreshed sign-in token: ')+detail);
      throw new Error(detail);
    }
    return asBlob?response.blob():response.json();
  }

  async function compressProfileImage(file){
    if(!file || !file.type || !file.type.startsWith('image/')) throw new Error(rtl?'اختر ملف صورة صالحاً.':'Choose a valid image file.');
    if(file.size>12*1024*1024) throw new Error(rtl?'حجم الصورة الأصلية كبير جداً (الحد 12 ميجابايت).':'The original image is too large (12 MB maximum).');
    const objectUrl=URL.createObjectURL(file);
    const image=new Image();
    await new Promise((resolve,reject)=>{
      image.onload=()=>{URL.revokeObjectURL(objectUrl);resolve();};
      image.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error(rtl?'تعذر قراءة الصورة.':'The image could not be read.'));};
      image.src=objectUrl;
    });
    if(!image.naturalWidth || !image.naturalHeight) throw new Error(rtl?'ملف الصورة غير صالح.':'The image file is invalid.');
    let edge=480;
    for(let attempt=0;attempt<7;attempt++){
      const scale=Math.min(1,edge/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      const context=canvas.getContext('2d');
      if(!context) throw new Error(rtl?'تعذر تجهيز الصورة.':'Could not process the image.');
      context.fillStyle='#ffffff';
      context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(image,0,0,canvas.width,canvas.height);
      const quality=Math.max(0.48,0.84-(attempt*0.07));
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
      if(blob && blob.size<=140*1024){
        return await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(reader.result);
          reader.onerror=()=>reject(new Error(rtl?'تعذر تجهيز الصورة للحفظ.':'Could not prepare the image for saving.'));
          reader.readAsDataURL(blob);
        });
      }
      edge=Math.max(160,Math.round(edge*0.82));
    }
    throw new Error(rtl?'تعذر ضغط الصورة إلى الحجم المناسب. اختر صورة أصغر.':'Could not compress the image enough. Please choose a smaller image.');
  }

      }
      updates[sourcePath+transactionId]=sourceRecord;
      if(cashCustodyEditingId){
        if(existing?.linkedTransactionId&&!canPair)updates['cashCustodies/'+existing.linkedOwnerUid+'/transactions/'+existing.linkedTransactionId]=null;
      }
      await db.ref().update(updates);
      let notificationSent=false,notificationError='';
      if(notificationToCreate){try{await db.ref('cashCustodyNotifications/'+notificationToCreate.ownerUid+'/'+notificationToCreate.notificationId).set(notificationToCreate.record);notificationSent=true;}catch(error){notificationError=String(error.message||error);console.warn('Cash custody notification could not be delivered:',error);}}
      let linkResult={ok:true};
      if(cashCustodyStagedAttachments.length){
        const transactionOwnerUid=sourceOwnerUid;
        setCashCustodyPendingLinkTargetId(transactionId);setCashCustodyPendingLinkOwnerUid(transactionOwnerUid);
        try{localStorage.setItem('pestCashCustodyAttachmentTarget:'+currentUser.uid,transactionId);localStorage.setItem('pestCashCustodyAttachmentOwner:'+currentUser.uid,transactionOwnerUid);}catch(_){}
        linkResult=await finishCashCustodyAttachmentLink(transactionId,transactionOwnerUid);
      }else resetCashCustodyAttachmentDraft();
      await addLog((cashCustodyEditingId?'تعديل':'تسجيل')+' حركة عهدة: '+(cashCustodyTypeLabels[cashCustodyForm.type]||cashCustodyForm.type),currentUser,{entityType:'cash-custody',entityId:sourceOwnerUid+'/'+transactionId,changes:cashCustodyEditingId?auditChanges(previousCashCustodyRecord,sourceRecord):{},metadata:{amount,currency:base.currency,status:transactionStatus,counterpartyType,counterpartyUid,counterpartyCode,paired:Boolean(sourceRecord.linkedTransactionId),attachmentsLinked:Boolean(linkResult.ok)}});
      setCashCustodyEditingId('');setCashCustodyForm({type:'expense',date:new Date().toISOString().slice(0,10),amount:'',currency:'EGP',counterparty:'',counterpartyType:'',counterpartyUid:'',counterpartyCode:'',counterpartyName:'',projectCode:'',reference:'',description:''});
      const savedMessage=rtl?(transactionStatus==='approved'?'تم حفظ الحركة واعتمادها.':'تم حفظ الحركة وهي في انتظار الاعتماد.'):(transactionStatus==='approved'?'Movement saved and approved.':'Movement saved and awaiting approval.');
      setCashCustodyNotice(savedMessage+(sourceRecord.linkedTransactionId?(rtl?(notificationSent?' وتم تسجيل الحركة المقابلة وإرسال الإشعار.':' تم تسجيل الحركة المقابلة، لكن تعذر إرسال الإشعار: '+notificationError):(notificationSent?' The linked entry and notification were saved.':' The linked entry was saved, but its notification failed: '+notificationError)):'')+(linkResult.ok?'':(rtl?' تعذر ربط بعض الملفات: '+linkResult.message+' استخدم زر إكمال ربط المرفقات.':' Some files could not be linked: '+linkResult.message+' Use Finish linking attachments.')));
    }catch(err){setCashCustodyNotice(firebaseErrorMessage(err,tr));}
    finally{setCashCustodyBusy(false);}
  }

  async function reviewCashCustodyTransaction(ownerUid,transaction,status){
    if(!requirePermission('cashCustody','approve'))return;
    if(ownerUid!==currentUser.uid&&!hasPermission('cashCustody','viewOthers'))return alert(rtl?'لا تملك صلاحية عرض عهدة هذا المستخدم.':'You do not have permission to view this user\'s custody.');
    if(ownerUid===currentUser.uid&&!isAdmin)return alert(rtl?'لا يمكنك اعتماد حركتك الشخصية.':'You cannot approve your own transaction.');
    if(!transaction||transaction.status!=='pending'||!['approved','rejected'].includes(status))return;
    try{
      const updates={},review={status,reviewedBy:currentUser.uid,reviewedByName:currentUser.fullName||currentUser.username||'',reviewedAt:firebase.database.ServerValue.TIMESTAMP};
      Object.entries(review).forEach(([key,value])=>{updates['cashCustodies/'+ownerUid+'/transactions/'+transaction.id+'/'+key]=value;});
      if(transaction.linkedTransactionId&&transaction.linkedOwnerUid){
        Object.entries(review).forEach(([key,value])=>{updates['cashCustodies/'+transaction.linkedOwnerUid+'/transactions/'+transaction.linkedTransactionId+'/'+key]=value;});
      }
      await db.ref().update(updates);
      await addLog((status==='approved'?'اعتماد':'رفض')+' حركة عهدة '+transaction.id,currentUser,{entityType:'cash-custody',entityId:ownerUid+'/'+transaction.id,metadata:{status,paired:Boolean(transaction.linkedTransactionId)}});
      if(ownerUid!==currentUser.uid)await loadCashCustodyTarget(ownerUid);
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function deleteCashCustodyDraft(transaction){
    if(!requirePermission('cashCustody','delete'))return;
    const ownerUid=cashCustodyTargetUid||currentUser.uid;
    if(ownerUid!==currentUser.uid&&(!isAdmin||!hasPermission('cashCustody','viewOthers')))return alert(rtl?'لا تملك صلاحية حذف عهدة هذا المستخدم.':'You cannot delete this user\'s custody movement.');
    if(!transaction)return;
    if(transaction.pairRole==='counterparty')return alert(rtl?'هذه حركة مقابلة. احذف الحركة الأصلية من دفتر الطرف الذي سجلها.':'This is a linked counterpart entry. Delete the originating movement from the sender\'s ledger.');
    if(transaction.status==='approved'&&!isAdmin)return alert(rtl?'حذف الحركة المعتمدة متاح لمدير النظام فقط.':'Only an administrator can delete an approved movement.');
    if(!window.confirm((rtl?'حذف حركة العهدة؟ سيتم حذف الحركة المقابلة المرتبطة بها، وسيعاد احتساب الرصيد مع الاحتفاظ بأثر الحذف في سجل النشاط.\n':'Delete this custody movement and its linked counterpart? Balances will be recalculated and the deletion retained in the audit log.\n')+(transaction.description||transaction.id)))return;
    try{
      if(hasPermission('attachments','delete'))await deleteRecordAttachments('cashCustody',ownerUid+'--'+transaction.id);
      const updates={['cashCustodies/'+ownerUid+'/transactions/'+transaction.id]:null};
      if(transaction.linkedTransactionId&&transaction.linkedOwnerUid)updates['cashCustodies/'+transaction.linkedOwnerUid+'/transactions/'+transaction.linkedTransactionId]=null;
      if(transaction.linkedProjectEventId&&transaction.projectCode)updates['projects/'+transaction.projectCode+'/events/'+transaction.linkedProjectEventId]=null;
      await db.ref().update(updates);
      await addLog('حذف حركة عهدة '+transaction.id,currentUser,{entityType:'cash-custody',entityId:ownerUid+'/'+transaction.id,changes:auditChanges(transaction,null),metadata:{pairedDeleted:Boolean(transaction.linkedTransactionId),partyEventDeleted:Boolean(transaction.linkedProjectEventId)}});
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function updateRequestStatus(req,status){
    if(!isAdmin || !req.uid) return;
    try{
      if(!req._hasAuthUid){
        if(status==='approved') return alert(tr('legacyReapply'));
        await db.ref('userRequests/'+req.id+'/status').set(status==='pending'?'مؤجل':'غير موافق');
        await addLog('تعديل حالة طلب قديم '+req.fullName+' إلى '+status);
        return;
      }
      const updates={};
      updates['userRequests/'+req.uid+'/status']=status;
      if(status==='approved'){
        updates['users/'+req.uid]={uid:req.uid,email:req.email,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,whatsapp:req.whatsapp||'',role:'user',status:'active',permissions:{},avatar:req.avatar||'',createdAt:firebase.database.ServerValue.TIMESTAMP};
        updates['userDirectory/'+req.uid]={uid:req.uid,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,whatsapp:req.whatsapp||'',avatar:req.avatar||'',status:'active'};
      }else{
        // Update profile/directory only when they already exist. A pending request
        // does not yet have a users/{uid} profile, so creating one here breaks login.
        const [userSnap,dirSnap]=await Promise.all([
          db.ref('users/'+req.uid).once('value'),
          db.ref('userDirectory/'+req.uid).once('value')
        ]);
        if(userSnap.exists()) updates['users/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
        if(dirSnap.exists()) updates['userDirectory/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
      }
      await db.ref().update(updates);
      await addLog('تغيير حالة طلب '+req.fullName+' إلى '+status);
      setRequestStatusDrafts(old=>{const next={...old};delete next[req.uid];return next;});
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function sendExcelImport(e){
    e.preventDefault();if(!isAdmin) return;
    const file=e.target.elements.excelFile.files[0];if(!file) return alert(tr('noData'));
    try{
      const buffer=await file.arrayBuffer();
      const workbook=XLSX.read(buffer,{type:'array'});
      const updates={};let imported=0;let skipped=0;
      const norm=v=>String(v||'').trim().toLowerCase().replace(/[\s_\-]+/g,'');
      const aliases={type:['type','recordtype','نوع','النوع'],phone:['phone','mobile','telephone','هاتف','الهاتف','تليفون'],clientCode:['clientcode','customercode','كود العميل','كودالعميل'],amount:['amount','value','القيمة','المبلغ'],status:['status','الحالة']};
      const get=(row,keys)=>{for(const [k,v] of Object.entries(row)){if(keys.map(norm).includes(norm(k)) && v!==undefined && v!==null && String(v).trim()!=='') return String(v).trim();}return '';};
      const normalizeExcelDate=value=>{
        const raw=String(value||'').trim();
        if(!raw) return '';
        const formatDate=(y,m,d)=>String(y)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)){
          const parts=raw.split('-').map(Number);
          return formatDate(parts[0],parts[1],parts[2]);
        }
        if(/^\d+(\.\d+)?$/.test(raw) && XLSX.SSF && XLSX.SSF.parse_date_code){
          const serial=XLSX.SSF.parse_date_code(Number(raw));
          if(serial && serial.y && serial.m && serial.d) return formatDate(serial.y,serial.m,serial.d);
        }
        const dmy=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
        if(dmy){
          const day=Number(dmy[1]),month=Number(dmy[2]),year=Number(dmy[3]);
          if(day>=1&&day<=31&&month>=1&&month<=12) return formatDate(year,month,day);
        }
        const parsed=new Date(raw);
        if(!Number.isNaN(parsed.getTime())) return formatDate(parsed.getFullYear(),parsed.getMonth()+1,parsed.getDate());
        return raw;
      };
      workbook.SheetNames.forEach(sheetName=>{
        const sheetKey=norm(sheetName);
        if(['instructions','readme','guide','تعليمات','ارشادات','إرشادات'].includes(sheetKey)) return;
        const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',raw:true});
        rows.forEach(row=>{
          const typeRaw=get(row,aliases.type).toLowerCase();
          const sheet=norm(sheetName);
          let type=typeRaw;
          if(!type){if(['clients','client','customers','customer','العملاء','عميل'].includes(sheet)) type='client';else if(['vendors','vendor','suppliers','supplier','الموردون','الموردين','مورد'].includes(sheet)) type='vendor';else if(['projects','project','المشروعات','المشاريع','مشروع'].includes(sheet)) type='project';}
          if(['clients','customer','customers','العملاء','عميل'].includes(type)) type='client';
          if(['vendors','supplier','suppliers','الموردون','الموردين','مورد'].includes(type)) type='vendor';
          if(['projects','المشروعات','المشاريع','مشروع'].includes(type)) type='project';
          const codeKeys=type==='project'?['projectcode','code','كودالمشروع','كود']:type==='vendor'?['vendorcode','suppliercode','code','كودالمورد','كود']:['clientcode','customercode','code','كودالعميل','كود'];
          const nameKeys=type==='project'?['projectname','name','اسم المشروع','اسمالمشروع','الاسم','اسم']:type==='vendor'?['vendorname','suppliername','name','اسم المورد','اسمالمورد','الاسم','اسم']:['clientname','customername','name','اسم العميل','اسمالعميل','الاسم','اسم'];
          const code=get(row,codeKeys),name=get(row,nameKeys);
          if(!['client','vendor','project'].includes(type)||!code||!name||/[.#$\[\]/]/.test(code)){skipped++;return;}
          if(type==='client'||type==='vendor'){
            const path=(type==='client'?'clients/':'vendors/')+code;
            updates[path+'/code']=code;updates[path+'/name']=name;
            const fieldAliases={englishName:['englishname','english name','الاسم بالانجليزية','الاسم بالإنجليزية'],phone:['phone','telephone','هاتف','الهاتف','تليفون'],mobile:['mobile','محمول'],alternatePhone:['alternatephone','phone2','هاتف اضافي'],email:['email','البريد الالكتروني','البريد الإلكتروني'],alternateEmail:['alternateemail','email2','بريد اضافي'],whatsapp:['whatsapp','واتساب'],website:['website','الموقع الالكتروني'],taxNumber:['taxnumber','taxregistration','taxregistrationnumber','رقم التسجيل الضريبي','الرقم الضريبي'],commercialRegister:['commercialregister','السجل التجاري'],contactPerson:['contactperson','الشخص المسؤول'],contactTitle:['contacttitle','صفة المسؤول'],address:['address','العنوان'],city:['city','المدينة'],country:['country','الدولة'],postalCode:['postalcode','الرمز البريدي'],paymentTerms:['paymentterms','شروط السداد'],creditLimit:['creditlimit','الحد الائتماني'],currency:['currency','العملة'],bankName:['bankname','اسم البنك'],bankAccount:['bankaccount','رقم الحساب'],iban:['iban'],notes:['notes','ملاحظات']};
            Object.entries(fieldAliases).forEach(([field,keys])=>{const value=get(row,keys);if(value!=='') updates[path+'/'+field]=value;});imported++;
          }else{
            const path='projects/'+code;
            const amountText=get(row,aliases.amount).replace(/,/g,'');
            const amount=Number(amountText||0);
            const setIfProvided=(field,value)=>{if(value!=='' && value!==undefined && value!==null) updates[path+'/'+field]=value;};
            updates[path+'/code']=code;updates[path+'/name']=name;
            const clientCodes=get(row,['clientcodes','customercodes','clientcode','customercode','كود العميل','اكواد العملاء']).split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
            const vendorCodes=get(row,['vendorcodes','suppliercodes','vendorcode','suppliercode','كود المورد','اكواد الموردين']).split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
            if(clientCodes.length){updates[path+'/clientCodes']=clientCodes;updates[path+'/clientCode']=clientCodes[0];}
            if(vendorCodes.length) updates[path+'/vendorCodes']=vendorCodes;
            setIfProvided('amount',amountText!=='' && Number.isFinite(amount)?amount:'');
            setIfProvided('costBudget',get(row,['costbudget','estimatedcost','التكلفة التقديرية','التكلفة']));
            setIfProvided('status',get(row,aliases.status));setIfProvided('currency',get(row,['currency','العملة']));
            setIfProvided('contractNo',get(row,['contractno','رقم العقد']));setIfProvided('purchaseOrderNo',get(row,['purchaseorderno','رقم امر الشراء','رقم أمر الشراء']));
            setIfProvided('projectManager',get(row,['projectmanager','مدير المشروع']));setIfProvided('projectType',get(row,['projecttype','نوع المشروع','نوع التوريد']));
            setIfProvided('startDate',normalizeExcelDate(get(row,['startdate','تاريخ البدء'])));setIfProvided('expectedEndDate',normalizeExcelDate(get(row,['expectedenddate','تاريخ الانتهاء المتوقع'])));setIfProvided('actualEndDate',normalizeExcelDate(get(row,['actualenddate','تاريخ الانتهاء الفعلي'])));
            setIfProvided('location',get(row,['location','موقع التنفيذ']));setIfProvided('deliveryAddress',get(row,['deliveryaddress','عنوان التسليم']));
            setIfProvided('paymentTerms',get(row,['paymentterms','شروط السداد']));setIfProvided('scope',get(row,['scope','نطاق الأعمال']));setIfProvided('notes',get(row,['notes','ملاحظات']));
            imported++;
          }
        });
      });
      if(!imported) return alert(tr('importNoRows'));
      await db.ref().update(updates);await addLog('استيراد بيانات من Excel: '+imported+' سجل');setExcelSummary(tr('importSuccess')+imported+(skipped?' · '+skipped+' skipped':''));e.target.reset();
    }catch(err){console.error('Excel import:',err);alert(firebaseErrorMessage(err,tr));}
  }

  function triggerDownload(blob,filename){
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;link.download=filename;link.style.display='none';
    document.body.appendChild(link);link.click();link.remove();
    window.setTimeout(()=>URL.revokeObjectURL(url),2000);
  }

  function removeBackupSecrets(value){
    if(Array.isArray(value)) return value.map(removeBackupSecrets);
    if(!value || typeof value!=='object') return value;
    const safe={};
    Object.entries(value).forEach(([key,item])=>{
      if(/^(password|passwordhash|accesstoken|refreshtoken|idtoken|secret)$/i.test(key)) return;
      safe[key]=removeBackupSecrets(item);
    });
    return safe;
  }

  async function downloadDatabaseBackup(){if(!requirePermission('settings','manage'))return;
    setBackupBusy('database');setBackupMessage('');

      const snapshot=await db.ref('/').once('value');
      const payload={
        backupType:'Pest Platform Realtime Database Backup',
        createdAt:new Date().toISOString(),
        createdBy:{uid:currentUser.uid,email:currentUser.email,username:currentUser.username},
        data:removeBackupSecrets(snapshot.val()||{})
      };
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
      triggerDownload(blob,'PestPlatform_database_backup_'+backupFileStamp()+'.json');
      setBackupMessage(tr('backupCreated'));
      void addLog('تنزيل نسخة احتياطية من قاعدة البيانات');

      console.error('Database backup:',err);

        ? tr('backupPermission') : tr('backupFailed')+(err.message||'');
      setBackupMessage(message);
    }finally{setBackupBusy('');}
  }

  async function closeProjectFinancialEvent(projectRecord,eventRecord){
    if(!requirePermission('projects','edit')||!projectRecord||!eventRecord||!['receivable','payable'].includes(eventRecord.financialEffect)||isClosedFinancialEvent(eventRecord))return;
    const relatedCashType=eventRecord.financialEffect==='receivable'?'customer_collection':'supplier_payment';
    const relatedTimeline=projectEvents(projectRecord);
    const samePartyEvents=relatedTimeline.filter(row=>['customer_receivable','supplier_commitment'].includes(row.type)&&row.partyType===eventRecord.partyType&&String(row.partyCode||'')===String(eventRecord.partyCode||'')&&!isClosedFinancialEvent(row));
    const cashRowsForThisEvent=relatedTimeline.filter(row=>row.type===relatedCashType&&String(row.partyType||'')===String(eventRecord.partyType||'')&&String(row.partyCode||'')===String(eventRecord.partyCode||'')&&(eventRecord.referenceNo?String(row.referenceNo||'')===String(eventRecord.referenceNo):samePartyEvents.length===1));
    const alreadyRecordedCash=cashRowsForThisEvent.reduce((sum,row)=>sum+cashEventAmount(row),0);
    const remainingDefault=Math.max(0,Number(eventRecord.amount||0)-Number(eventRecord.settledAmount||0)-alreadyRecordedCash);
    const reason=window.prompt(rtl?'بيان الإغلاق / طريقة التسوية (اختياري):':'Closure / settlement note (optional):',remainingDefault>0?(rtl?'تمت التسوية / الإقفال':'Settled / closed'):(rtl?'تم السداد / التحصيل بالكامل':'Fully paid / collected'))??null;
    if(reason===null)return;
    const closureAdjustmentAmount=remainingDefault;
    const after={...eventRecord,status:'closed',closureAdjustmentAmount,closureNote:String(reason).trim(),closedAt:firebase.database.ServerValue.TIMESTAMP,closedBy:currentUser.uid,closedByName:currentUser.fullName||currentUser.username||'',updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:currentUser.uid,updatedByName:currentUser.fullName||currentUser.username||''};
    try{
      await db.ref('projects/'+projectRecord.code+'/events/'+eventRecord.id).update({status:after.status,closureAdjustmentAmount,closureNote:after.closureNote,closedAt:after.closedAt,closedBy:after.closedBy,closedByName:after.closedByName,updatedAt:after.updatedAt,updatedBy:after.updatedBy,updatedByName:after.updatedByName});
      await addLog('إغلاق '+(eventRecord.financialEffect==='receivable'?'مستحق عميل':'التزام مورد')+': '+(eventRecord.actionName||eventRecord.id),currentUser,{entityType:'project-event',entityId:projectRecord.code+'/'+eventRecord.id,changes:auditChanges(eventRecord,after),metadata:{closureAdjustmentAmount}});
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

    try{

      catch(attachmentError){setEditingProjectEventId(id);alert((rtl?'تم حفظ الحدث، لكن تعذر رفع بعض المرفقات. أصلح الاتصال ثم اضغط حفظ التعديلات لإكمال الرفع.\n':'The event was saved, but some attachments could not be uploaded. Fix the connection and save the event again to finish uploading.\n')+String(attachmentError.message||attachmentError));return;}

  function activeContextToken(text){
    return String(text||'').match(/(^|\s)([@#&])([^\s@#&]*)$/);
  }
  function contextTokenSuggestionsFor(text){
    const match=activeContextToken(text);
    if(!match)return [];
    const marker=match[2],query=match[3]||'';
    if(marker==='@')return userDirectory.filter(u=>u.uid&&u.status==='active'&&u.uid!==currentUser.uid&&includesText([u.username,u.fullName,u.jobTitle].join(' '),query)).slice(0,8).map(u=>({type:'user',id:u.uid,label:u.fullName||u.username||u.uid,detail:'@'+(u.username||''),user:u}));
    if(marker==='#')return projects.filter(p=>{
      const status=String(p.status||'').toLowerCase();
      return p.code&&!['completed','closed','cancelled','archived','done','منتهي','مكتمل','مغلق','ملغي','مؤرشف','منتهى'].includes(status)&&includesText([p.code,p.name,p.contractNo,p.purchaseOrderNo].join(' '),query);
    }).slice(0,8).map(p=>({type:'project',id:p.code,label:p.name||p.code,detail:'#'+p.code,project:p}));
    if(marker==='&')return tasks.filter(t=>t.id&&includesText([t.title,t.description,t.status].join(' '),query)).slice(0,8).map(t=>({type:'task',id:t.id,label:t.title||t.id,detail:(t.status||'open')+' · '+t.id,task:t}));
    return [];
  }
  function contextTokenText(item){
    if(item.type==='user')return '@'+(item.user.username||item.user.uid);
    if(item.type==='project')return '#'+item.project.code;
    return '&['+String(item.task.title||item.task.id).replace(/[\[\]]/g,'').trim()+']';
  }
  function insertContextToken(text,setter,item){
    const match=activeContextToken(text);
    if(!match)return;
    const prefix=String(text).slice(0,String(text).length-match[0].length)+(match[1]||'');
    setter(prefix+contextTokenText(item)+' ');
  }
  function messageContextReferences(body){
    const text=String(body||'');
    const projectCodes=[...text.matchAll(/#([^\s@#&]+)/g)].map(m=>m[1]);
    const taskTitles=[...text.matchAll(/&\[([^\]]+)\]/g)].map(m=>m[1].trim());
    const linkedProjects=[...new Set(projectCodes)].map(code=>{
      const p=projects.find(x=>String(x.code||'').toLowerCase()===String(code).toLowerCase());
      return p?{code:p.code,name:p.name||p.code}:null;
    }).filter(Boolean);
    const linkedTasks=[...new Set(taskTitles)].map(title=>{
      const t=tasks.find(x=>String(x.title||'').trim().toLowerCase()===title.toLowerCase());
      return t?{id:t.id,title:t.title||t.id,status:t.status||'open'}:{id:'',title,status:'referenced'};
    });
    return {linkedProjects,linkedTasks};
  }
  function contextTokenClass(part){
    if(part.startsWith('@'))return 'app-message-mention';
    if(part.startsWith('#'))return 'app-message-project';
    if(part.startsWith('&['))return 'app-message-task';
    return '';
  }
  function renderMessageBody(body){
    return latinDigits(body).split(/(@[^\s@#&]+|#[^\s@#&]+|&\[[^\]]+\])/g).map((part,index)=>{const tokenClass=contextTokenClass(part);return tokenClass?<span key={index} className={tokenClass}>{part}</span>:part;});
  }

  function normalizeWhatsAppNumber(value){
    let digits=String(value||'').replace(/\D/g,'');
    if(digits.startsWith('00'))digits=digits.slice(2);
    if(digits.startsWith('0')&&digits.length>=10)digits='20'+digits.slice(1);
    else if(digits.length===10&&digits.startsWith('1'))digits='20'+digits;
    return digits.length>=8&&digits.length<=15?digits:'';
  }

  function openWhatsAppDraft(){
    const textBody=[String(whatsappMessage.subject||'').trim(),String(whatsappMessage.body||'').trim()].filter(Boolean).join('\n\n');
    if(!textBody)return alert(rtl?'اكتب نص الرسالة في محرر WhatsApp أولاً.':'Write the message in the WhatsApp message box first.');
    const selected=whatsappContacts.filter(c=>whatsappTargets.includes(c.key));
    const requested=[...selected];
    if(String(whatsappManualNumber||'').trim())requested.push({key:'manual',label:rtl?'رقم يدوي':'Manual number',phone:whatsappManualNumber});
    if(!requested.length)return alert(rtl?'حدد جهة اتصال واحدة على الأقل أو أدخل رقم الهاتف.':'Select at least one contact or enter a phone number.');
    const drafts=[];
    const skipped=[];
    requested.forEach(contact=>{
      const digits=normalizeWhatsAppNumber(contact.phone);
      if(!digits){skipped.push(contact.label);return;}
      drafts.push({key:contact.key,label:contact.label,phone:digits,url:'https://wa.me/'+digits+'?text='+encodeURIComponent(textBody)});
    });
    if(!drafts.length)return alert(rtl?'لا توجد أرقام WhatsApp صحيحة ضمن الجهات المحددة.':'None of the selected contacts has a valid WhatsApp number.');
    setWhatsappDrafts(drafts);
    // Open only the first chat immediately; browsers often block bulk pop-ups.
    window.open(drafts[0].url,'_blank','noopener,noreferrer');
    void addLog('تجهيز رسائل WhatsApp لعدد '+drafts.length+' جهة اتصال');
    if(skipped.length)alert(rtl?'تم تجهيز '+drafts.length+' محادثة وتجاهل '+skipped.length+' جهة بدون رقم صالح.':'Prepared '+drafts.length+' chats; skipped '+skipped.length+' contacts without a valid number.');

  function assistantSearchScore(record,query){
    const q=String(query||'').toLowerCase();
    const words=q.split(/\s+/).filter(w=>w.length>1 && !['عن','من','الى','إلى','في','على','ما','هو','هي','هل','كم','مع','the','and','for','with','what','how','show','tell'].includes(w));
    if(!words.length) return 0;
    const hay=Object.values(record||{}).filter(v=>v===null||['string','number','boolean'].includes(typeof v)).join(' ').toLowerCase();
    return words.reduce((score,w)=>score+(hay.includes(w)?1:0),0);
  }
  function assistantPickRows(rows,query,keys,limit=8){
    const list=Array.isArray(rows)?rows:[];
    const scored=list.map(row=>({row,score:assistantSearchScore(row,query)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    const queryWords=String(query||'').toLowerCase().split(/\s+/).filter(w=>w.length>1 && !['عن','من','الى','إلى','في','على','ما','هو','هي','هل','كم','مع','the','and','for','with','what','how','show','tell'].includes(w));
    const picked=scored.length?scored.slice(0,limit).map(x=>x.row):(queryWords.length===0?list.slice().sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).slice(0,Math.min(4,limit)):[]);
    return picked.map(row=>Object.fromEntries(keys.filter(k=>row&&row[k]!==undefined&&row[k]!==null&&row[k]!=='').map(k=>[k,row[k]])));
  }

      if(typeof window.pestAIAgentAsk!=='function') throw new Error('AI Agent Worker update is required.');
      const context=buildAssistantContext(question);
      const historyText=history.slice(-10).map(m=>(m.role==='user'?'User':'AI Agent')+': '+m.content).join('\n');
      const prompt='أجب عن الطلب الأحدث باستخدام أدوات البحث داخل البرنامج عند الحاجة. إذا طلبت إضافة أو تعديل أو حذف أو إرسال رسالة، جهّز الإجراء للمراجعة ولا تنفذه قبل تأكيد المستخدم.\n\nCONVERSATION:\n'+historyText+'\n\nLATEST REQUEST:\n'+question;

          </div>
          <div className="px-3 pt-3 space-y-2">
            <div className="flex items-center gap-2"><input className="min-w-0 flex-1 rounded-lg border p-2 text-sm text-slate-900" value={messageShortcutSearch} onChange={e=>setMessageShortcutSearch(e.target.value)} placeholder={rtl?'ابحث في رسائلك...':'Search your messages...'}/><button type="button" onClick={()=>{setMessageShortcutSearch('');setMessageShortcutOpen(false);navigateToTab('messages');}} className="rounded-lg bg-slate-100 text-slate-700 px-3 py-2 text-xs font-bold">{rtl?'كل الرسائل':'Full screen'}</button></div>
            <div className="flex flex-wrap items-center gap-2 text-[11px]">
              <button type="button" onClick={()=>setSoundNotificationsEnabled(v=>!v)} className={'rounded-full px-2.5 py-1 '+(soundNotificationsEnabled?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-600')}>{rtl?(soundNotificationsEnabled?'الصوت مفعّل':'الصوت متوقف'):(soundNotificationsEnabled?'Sound on':'Sound off')}</button>
              <button type="button" onClick={toggleDesktopNotifications} className={'rounded-full px-2.5 py-1 '+(desktopNotificationsEnabled?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-800')}>{rtl?(desktopNotificationsEnabled?'إشعار الكمبيوتر مفعّل':'تفعيل إشعار الكمبيوتر'):(desktopNotificationsEnabled?'Desktop alerts on':'Enable desktop alerts')}</button>
              {typeof Notification!=='undefined'&&Notification.permission==='denied'&&<span className="text-rose-600">{rtl?'اسمح بالإشعارات من إعدادات المتصفح':'Allow notifications in browser settings'}</span>}
            </div>
            {typeof Notification!=='undefined'&&Notification.permission==='default'&&!desktopNotificationsEnabled&&<p className="text-[11px] text-gray-500">{rtl?'اضغط «تفعيل إشعار الكمبيوتر» ووافق على رسالة المتصفح لظهور التنبيه خارج البرنامج.':'Press Enable desktop alerts and allow the browser prompt to show notifications outside the app.'}</p>}
          </div>
          <div className="app-messages-shortcut-list" ref={shortcutMessagesScrollRef}>
            {shortcutMessages.length===0?<p className="text-center text-gray-500 p-6 text-sm">{rtl?'لا توجد رسائل مطابقة.':'No matching messages.'}</p>:shortcutMessages.map(m=>{
              const outgoing=m.copyType==='sent'||m.senderUid===currentUser.uid;
              const recipientLabel=m.visibility==='public'?(rtl?'كل المستخدمين':'All users'):(Array.isArray(m.recipientNames)&&m.recipientNames.length?m.recipientNames.join('، '):(userDirectory.find(u=>u.uid===m.recipientUid)?.fullName||m.recipientUid||''));
              const palette=messagePaletteFor(m);
              return <article key={m.id} className="app-message-shortcut-item" style={{backgroundColor:palette.background,borderColor:palette.border,borderInlineStart:'4px solid '+palette.accent}}>
                <div className="flex justify-between items-start gap-2"><b className="text-xs" style={{color:palette.text}}>{outgoing?(rtl?'أنت إلى: ':'You to: ')+recipientLabel:(m.senderName||(rtl?'رسالة واردة':'Incoming message'))}</b><time className="text-[10px] text-gray-400">{latinDigits(m.date||'')}</time></div>
                {m.replyTo&&<div className="mt-2 rounded-lg bg-white/70 border-s-4 border-indigo-300 p-2"><small className="font-bold text-indigo-700">{rtl?'رد على: ':'Reply to: '}{m.replyTo.senderName||''}</small><p className="text-xs text-gray-600 line-clamp-2">{m.replyTo.body||''}</p></div>}
                <b className="block text-sm mt-1">{m.subject|| (rtl?'محادثة سريعة':'Quick chat')}</b>
                <p className="text-sm whitespace-pre-wrap break-words mt-1">{renderMessageBody(m.body)}</p>{renderMessageReactions(m)}
                {(m.linkedProjects||[]).length+(m.linkedTasks||[]).length>0&&<div className="flex flex-wrap gap-1 mt-2">{(m.linkedProjects||[]).map((ref,i)=><button key={'p'+i} type="button" onClick={()=>{if(ref.code){setSelectedProjectCode(ref.code);setTab('projectDetail');setMessageShortcutOpen(false);}}} className="app-message-project text-[10px]">#{ref.name||ref.code}</button>)}{(m.linkedTasks||[]).map((ref,i)=><button key={'t'+i} type="button" onClick={()=>{setTab('tasks');setMessageShortcutOpen(false);}} className="app-message-task text-[10px]">&amp;{ref.title||ref.id}</button>)}</div>}
                <div className="flex items-center justify-between gap-2 mt-2"><span className="text-[10px] text-gray-500">{outgoing?(rtl?'مرسلة':'Sent'):(m.read===true?(rtl?'مقروءة':'Read'):(rtl?'غير مقروءة':'Unread'))}</span><button type="button" onClick={()=>openShortcutReply(m)} className="rounded-lg bg-indigo-50 text-indigo-700 px-3 py-1.5 text-xs font-bold"><i className="fas fa-reply me-1"></i>{rtl?'رد':'Reply'}</button></div>
              </article>;
            })}
          </div>
          {replyingToMessage&&<form onSubmit={sendMessageReply} className="app-messages-shortcut-reply app-message-reply-composer">
            <div className="flex justify-between items-center gap-2"><b className="text-xs text-indigo-800">{rtl?'الرد على':'Reply to'} {replyingToMessage.senderName||''}</b><button type="button" onClick={cancelMessageReply} className="text-xs text-gray-500">{rtl?'إغلاق':'Close'}</button></div>
            <div className="rounded-lg bg-indigo-50 border-s-4 border-indigo-300 p-2 text-xs text-gray-700 line-clamp-2">{replyingToMessage.body}</div>
            <div className="relative"><textarea rows="2" required className="app-message-reply-field w-full border-2 border-indigo-300 rounded-lg p-2 text-sm font-bold leading-6 bg-indigo-50/30 text-slate-900" value={replyDraft} onChange={e=>setReplyDraft(e.target.value)} onKeyDown={handleMessageComposerKeyDown} placeholder={rtl?'اكتب ردك باستخدام @ # & ...':'Reply using @ # & ...'}></textarea>
              {replyMentionSuggestions.length>0&&<div className="absolute bottom-full inset-x-0 z-50 max-h-48 overflow-y-auto rounded-lg bg-white border shadow-xl">{replyMentionSuggestions.map(item=><button key={item.type+':'+item.id} type="button" onClick={()=>insertReplyMention(item)} className="flex justify-between w-full p-2 text-start text-sm hover:bg-slate-50"><span>{item.label}<small className="block text-xs text-gray-500">{item.detail}</small></span><b>{item.type==='user'?'@':item.type==='project'?'#':'&'}</b></button>)}</div>}
            </div>
            <button type="submit" className="w-full rounded-lg bg-indigo-600 text-white p-2 text-sm font-bold">{rtl?'إرسال الرد':'Send reply'}</button>
          </form>}
          <form onSubmit={sendQuickChatMessage} className="app-messages-shortcut-composer">
            <div className="relative"><textarea rows="2" value={chatDraft} onChange={e=>setChatDraft(e.target.value)} onKeyDown={handleMessageComposerKeyDown} placeholder={rtl?'رسالة جديدة: @ مستخدم، # مشروع، & مهمة':'New message: @ user, # project, & task'} className="w-full rounded-lg border p-2 text-sm text-slate-900"></textarea>
              {chatMentionSuggestions.length>0&&<div className="absolute bottom-full inset-x-0 z-50 max-h-48 overflow-y-auto rounded-lg bg-white border shadow-xl">{chatMentionSuggestions.map(item=><button key={item.type+':'+item.id} type="button" onClick={()=>insertChatMention(item)} className="flex justify-between w-full p-2 text-start text-sm hover:bg-slate-50"><span>{item.label}<small className="block text-xs text-gray-500">{item.detail}</small></span><b>{item.type==='user'?'@':item.type==='project'?'#':'&'}</b></button>)}</div>}
            </div>
            <div className="flex items-center justify-between gap-2"><small className="text-[10px] text-gray-500">{rtl?'استخدم @ لتحديد المستلم':'Use @ to choose recipients'}</small><button type="submit" disabled={chatSending||!chatDraft.trim()} className="rounded-lg bg-teal-600 text-white px-4 py-2 text-sm font-bold disabled:opacity-50"><i className="fas fa-paper-plane me-1"></i>{rtl?'إرسال':'Send'}</button></div>
          </form>
        </section>}
        <div className="app-floating-actions">
          <button type="button" className="app-messages-launcher" onClick={()=>{setAssistantOpen(false);setMessageShortcutOpen(old=>!old);}} aria-label={rtl?'فتح الرسائل':'Open messages'}><i className="fas fa-comments text-lg"></i><span>{rtl?'الرسائل':'Messages'}</span>{shortcutUnreadCount>0&&<b>{shortcutUnreadCount>99?'99+':shortcutUnreadCount}</b>}</button>
          {hasPermission('aiAgent','view')&&<button type="button" className="app-ai-launcher" onClick={()=>{setMessageShortcutOpen(false);setAssistantOpen(old=>!old);}} aria-label={rtl?'فتح المساعد الذكي':'Open AI assistant'}><i className="fas fa-wand-magic-sparkles text-lg"></i><span>{rtl?'اسأل المساعد':'Ask AI'}</span></button>}
        </div>
      </>}
  </div>;
}

class AppErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={hasError:false,error:null}; }
  static getDerivedStateFromError(error){ return {hasError:true,error}; }
  componentDidCatch(error,info){ console.error('Application render error:',error,info); }
  render(){
    if(this.state.hasError){
      const msg=this.state.error && this.state.error.message ? this.state.error.message : 'Unknown error';
      return <div className="min-h-screen bg-slate-100 flex items-center justify-center p-5"><div className="bg-white max-w-2xl w-full rounded-xl border shadow p-6"><h1 className="font-bold text-red-700 text-xl mb-3">تعذر عرض الشاشة الرئيسية</h1><p className="text-gray-700 mb-3">حدث خطأ أثناء تشغيل الواجهة. أرسل نص الخطأ التالي للدعم الفني:</p><pre className="whitespace-pre-wrap break-words bg-gray-100 rounded p-3 text-sm">{msg}</pre><button className="mt-4 bg-blue-600 text-white rounded px-4 py-2" onClick={()=>window.location.reload()}>إعادة تحميل البرنامج</button></div></div>;
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppErrorBoundary><App/></AppErrorBoundary>);

</script>
<script>
(()=>{
  const WORKER_URL='https://pest-platform.ai-mhdiab90.workers.dev';
  const agentRequest=async(path,method='POST',body)=>{
    const firebaseAuth=window.PEST_FIREBASE_AUTH;
    const user=firebaseAuth&&firebaseAuth.currentUser;
    if(!user)throw new Error('No active Firebase session. Please sign in again.');
    const send=async(forceRefresh)=>{
      const idToken=await user.getIdToken(Boolean(forceRefresh));
      const headers={'Authorization':'Bearer '+idToken};
      const options={method,headers,cache:'no-store'};
      if(body!==undefined){headers['Content-Type']='application/json';options.body=JSON.stringify(body);}
      return fetch(WORKER_URL+path,options);
    };
    let response=await send(false);
    if(response.status===401)response=await send(true);
    let payload={};
    try{payload=await response.json();}catch(_){}
    if(!response.ok)throw new Error(payload.error||('AI Agent returned HTTP '+response.status+'.'));
    return payload;
  };
  window.pestAIAgentAsk=(prompt,context)=>agentRequest('/agent','POST',{prompt:String(prompt||''),context:String(context||'')});
  window.pestAIAgentExecute=actions=>agentRequest('/execute','POST',{actions:Array.isArray(actions)?actions:[]});
  window.pestAIAgentListDashboards=()=>agentRequest('/dashboards','GET');
  window.pestAIAgentDeleteDashboard=id=>agentRequest('/dashboards','DELETE',{id:String(id||'')});
  window.pestAIAgentListSchedules=()=>agentRequest('/schedules','GET');
  window.pestAIAgentCreateSchedule=schedule=>agentRequest('/schedules','POST',schedule||{});
  window.pestAIAgentUpdateSchedule=update=>agentRequest('/schedules','POST',update||{});
  window.pestAIAgentDeleteSchedule=id=>agentRequest('/schedules','DELETE',{id:String(id||'')});
  window.pestWhatsAppNotifyMessage=messageId=>agentRequest('/whatsapp/notify-message','POST',{messageId:String(messageId||'')});
  window.pestAIAsk=async prompt=>{
    const result=await window.pestAIAgentAsk(prompt,'');
    return result&&result.answer?result.answer:'';
  };
  window.pestAIStatus='checking';
  window.pestAIProviders={cloudflare:false,openrouter:false};
  window.pestAISchedulingAvailable=false;
  window.pestWhatsAppNotificationsAvailable=false;
  (async()=>{
    try{
      const response=await fetch(WORKER_URL+'/health',{method:'GET',cache:'no-store'});
      const health=await response.json();
      if(!response.ok||health.ok!==true)throw new Error('AI Agent Worker health check failed.');
      window.pestAIProviders=health.providers||{};
      window.pestAIModels=health.models||{};
      window.pestAISchedulingAvailable=health.schedulingAvailable===true;
      window.pestWhatsAppNotificationsAvailable=health.whatsappNotificationsAvailable===true;
      window.pestAIStatus=(window.pestAIProviders.cloudflare||window.pestAIProviders.openrouter)?'ready':'unavailable';
    }catch(error){
      console.error('AI Agent Worker health check:',error);
      window.pestAIStatus='unavailable';
    }
    window.dispatchEvent(new Event('pest-ai-ready'));
  })();
})();;
</script>
