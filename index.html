<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة المشروعات والتدفقات النقدية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="root">
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600 mb-3"></i>
                <p class="text-gray-600 font-bold">جاري تحميل النظام والمكودات...</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyBPrzHFEIM3AOFclTzJ1SpG_Nq6BKHgrSo",
            authDomain: "pest-plat-form.firebaseapp.com",
            databaseURL: "https://pest-plat-form-default-rtdb.firebaseio.com",
            projectId: "pest-plat-form",
            storageBucket: "pest-plat-form.firebasestorage.app",
            messagingSenderId: "237071041951",
            appId: "1:237071041951:web:a501285338ec178a65a9aa"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const { useState, useEffect } = React;

        function App() {
            const [currentUser, setCurrentUser] = useState({ name: "محمد حامد", role: "admin" });
            const [activeTab, setActiveTab] = useState("dashboard");
            
            // Master Data States
            const [clients, setClients] = useState([]);
            const [vendors, setVendors] = useState([]);
            const [masterProjects, setMasterProjects] = useState([]);
            const [systemUsers, setSystemUsers] = useState([]);

            // Transactional States
            const [quotes, setQuotes] = useState([]);
            const [projects, setProjects] = useState([]);
            const [inflows, setInflows] = useState([]);
            const [outflows, setOutflows] = useState([]);
            const [logs, setLogs] = useState([]);

            // Form States
            const [clientForm, setClientForm] = useState({ code: '', name: '', phone: '' });
            const [vendorForm, setVendorForm] = useState({ code: '', name: '', phone: '' });
            const [userForm, setUserForm] = useState({ name: '', role: 'sales' });
            const [newQuote, setNewQuote] = useState({ clientCode: '', title: '', amount: '', paymentTerms: 'كاش' });

            useEffect(() => {
                db.ref('clients').on('value', s => setClients(s.val() ? Object.values(s.val()) : []));
                db.ref('vendors').on('value', s => setVendors(s.val() ? Object.values(s.val()) : []));
                db.ref('systemUsers').on('value', s => setSystemUsers(s.val() ? Object.values(s.val()) : []));
                db.ref('quotes').on('value', s => setQuotes(s.val() ? Object.values(s.val()) : []));
                db.ref('projects').on('value', s => setProjects(s.val() ? Object.values(s.val()) : []));
                db.ref('inflows').on('value', s => setInflows(s.val() ? Object.values(s.val()) : []));
                db.ref('outflows').on('value', s => setOutflows(s.val() ? Object.values(s.val()) : []));
                db.ref('logs').on('value', s => setLogs(s.val() ? Object.values(s.val()) : []));
            }, []);

            const addLog = (action) => {
                const id = Date.now();
                db.ref(`logs/${id}`).set({ id, user: currentUser.name, time: new Date().toLocaleTimeString('ar-EG'), action });
            };

            // Master Data Handlers
            const addClient = (e) => {
                e.preventDefault();
                const code = clientForm.code || 'CUST-' + (clients.length + 1).toString().padStart(3, '0');
                db.ref(`clients/${code}`).set({ code, name: clientForm.name, phone: clientForm.phone });
                addLog(`إضافة عميل جديد: ${clientForm.name} (${code})`);
                setClientForm({ code: '', name: '', phone: '' });
            };

            const addVendor = (e) => {
                e.preventDefault();
                const code = vendorForm.code || 'SUP-' + (vendors.length + 1).toString().padStart(3, '0');
                db.ref(`vendors/${code}`).set({ code, name: vendorForm.name, phone: vendorForm.phone });
                addLog(`إضافة مورد جديد: ${vendorForm.name} (${code})`);
                setVendorForm({ code: '', name: '', phone: '' });
            };

            const addUser = (e) => {
                e.preventDefault();
                const id = 'USR-' + Date.now();
                db.ref(`systemUsers/${id}`).set({ id, name: userForm.name, role: userForm.role });
                addLog(`إضافة مستخدم جديد: ${userForm.name} بصلاحية (${userForm.role})`);
                setUserForm({ name: '', role: 'sales' });
            };

            const createQuote = (e) => {
                e.preventDefault();
                const qId = 'Q-' + Date.now();
                const selectedClient = clients.find(c => c.code === newQuote.clientCode);
                const quoteObj = {
                    id: qId,
                    clientCode: newQuote.clientCode,
                    clientName: selectedClient ? selectedClient.name : newQuote.clientCode,
                    title: newQuote.title,
                    amount: Number(newQuote.amount),
                    status: 'قيد الانتظار',
                    date: new Date().toLocaleDateString('ar-EG'),
                    paymentTerms: newQuote.paymentTerms
                };
                db.ref(`quotes/${qId}`).set(quoteObj);
                addLog(`إصدار عرض سعر للعميل: ${quoteObj.clientName}`);
                setNewQuote({ clientCode: '', title: '', amount: '', paymentTerms: 'كاش' });
            };

            const updateQuoteStatus = (qId, newStatus) => {
                const target = quotes.find(q => q.id === qId);
                if (!target) return;
                db.ref(`quotes/${qId}/status`).set(newStatus);
                addLog(`تعديل حالة عرض السعر (${target.title}) إلى: ${newStatus}`);

                if (newStatus === 'مقبول') {
                    const pId = 'PRJ-' + (projects.length + 1).toString().padStart(3, '0');
                    db.ref(`projects/${pId}`).set({ id: pId, title: target.title, client: target.clientName, budget: target.amount, status: 'قيد التنفيذ' });
                    db.ref(`inflows/INF-${Date.now()}`).set({ client: target.clientName, amount: target.amount, method: target.paymentTerms, status: 'مستحق' });
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg">
                        <div className="flex items-center space-x-3 space-x-reverse">
                            <i className="fa-solid fa-cubes text-blue-400 text-2xl"></i>
                            <h1 className="text-xl font-bold">منظومة المشروعات والبيانات الأساسية (Master Data)</h1>
                        </div>
                        <div className="flex items-center space-x-3 space-x-reverse">
                            <span className="text-sm bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                                <i className="fa-solid fa-user-shield text-green-400 ml-2"></i>
                                {currentUser.name} ({currentUser.role})
                            </span>
                        </div>
                    </header>

                    <div className="flex flex-1">
                        <aside className="w-64 bg-white border-l border-gray-200 p-4 space-y-2">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-right p-3 rounded-lg flex items-center space-x-3 space-x-reverse ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-600 font-bold' : 'hover:bg-gray-50'}`}>
                                <i className="fa-solid fa-gauge w-6"></i><span>لوحة التحكم</span>
                            </button>
                            <button onClick={() => setActiveTab('masterData')} className={`w-full text-right p-3 rounded-lg flex items-center space-x-3 space-x-reverse ${activeTab === 'masterData' ? 'bg-blue-50 text-blue-600 font-bold' : 'hover:bg-gray-50'}`}>
                                <i className="fa-solid fa-database w-6"></i><span>البيانات الأساسية (Master Data)</span>
                            </button>
                            <button onClick={() => setActiveTab('users')} className={`w-full text-right p-3 rounded-lg flex items-center space-x-3 space-x-reverse ${activeTab === 'users' ? 'bg-blue-50 text-blue-600 font-bold' : 'hover:bg-gray-50'}`}>
                                <i className="fa-solid fa-users-gear w-6"></i><span>المستخدمين والصلاحيات</span>
                            </button>
                            <button onClick={() => setActiveTab('quotes')} className={`w-full text-right p-3 rounded-lg flex items-center space-x-3 space-x-reverse ${activeTab === 'quotes' ? 'bg-blue-50 text-blue-600 font-bold' : 'hover:bg-gray-50'}`}>
                                <i className="fa-solid fa-file-invoice-dollar w-6"></i><span>عروض الأسعار</span>
                            </button>
                            <button onClick={() => setActiveTab('projects')} className={`w-full text-right p-3 rounded-lg flex items-center space-x-3 space-x-reverse ${activeTab === 'projects' ? 'bg-blue-50 text-blue-600 font-bold' : 'hover:bg-gray-50'}`}>
                                <i className="fa-solid fa-diagram-project w-6"></i><span>المشروعات والطلبات</span>
                            </button>
                        </aside>

                        <main className="flex-1 p-6">
                            {activeTab === 'masterData' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* إدارة العملاء */}
                                    <div className="bg-white p-5 rounded-xl border shadow-sm space-y-4">
                                        <h3 className="font-bold text-blue-900 border-b pb-2"><i className="fa-solid fa-building ml-2"></i>تكويد العملاء</h3>
                                        <form onSubmit={addClient} className="space-y-3">
                                            <input type="text" placeholder="الكود (تلقائي إن ترك فارغاً)" className="w-full border p-2 rounded text-sm" value={clientForm.code} onChange={e => setClientForm({...clientForm, code: e.target.value})} />
                                            <input type="text" placeholder="اسم العميل" required className="w-full border p-2 rounded text-sm" value={clientForm.name} onChange={e => setClientForm({...clientForm, name: e.target.value})} />
                                            <button type="submit" className="w-full bg-blue-600 text-white p-2 rounded text-sm font-bold">إضافة عميل</button>
                                        </form>
                                        <div className="max-h-48 overflow-y-auto space-y-2 border-t pt-2">
                                            {clients.map(c => (
                                                <div key={c.code} className="flex justify-between items-center bg-gray-50 p-2 rounded text-xs">
                                                    <span className="font-mono bg-blue-100 px-2 py-0.5 rounded text-blue-800">{c.code}</span>
                                                    <span className="font-bold">{c.name}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* إدارة الموردين */}
                                    <div className="bg-white p-5 rounded-xl border shadow-sm space-y-4">
                                        <h3 className="font-bold text-amber-900 border-b pb-2"><i className="fa-solid fa-truck ml-2"></i>تكويد الموردين</h3>
                                        <form onSubmit={addVendor} className="space-y-3">
                                            <input type="text" placeholder="الكود (تلقائي إن ترك فارغاً)" className="w-full border p-2 rounded text-sm" value={vendorForm.code} onChange={e => setVendorForm({...vendorForm, code: e.target.value})} />
                                            <input type="text" placeholder="اسم المورد" required className="w-full border p-2 rounded text-sm" value={vendorForm.name} onChange={e => setVendorForm({...vendorForm, name: e.target.value})} />
                                            <button type="submit" className="w-full bg-amber-600 text-white p-2 rounded text-sm font-bold">إضافة مورد</button>
                                        </form>
                                        <div className="max-h-48 overflow-y-auto space-y-2 border-t pt-2">
                                            {vendors.map(v => (
                                                <div key={v.code} className="flex justify-between items-center bg-gray-50 p-2 rounded text-xs">
                                                    <span className="font-mono bg-amber-100 px-2 py-0.5 rounded text-amber-800">{v.code}</span>
                                                    <span className="font-bold">{v.name}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'users' && (
                                <div className="bg-white p-5 rounded-xl border shadow-sm space-y-4 max-w-xl">
                                    <h3 className="font-bold text-gray-800 border-b pb-2"><i className="fa-solid fa-users-gear ml-2"></i>إدارة المستخدمين والصلاحيات</h3>
                                    <form onSubmit={addUser} className="space-y-3">
                                        <input type="text" placeholder="اسم المستخدم" required className="w-full border p-2 rounded text-sm" value={userForm.name} onChange={e => setUserForm({...userForm, name: e.target.value})} />
                                        <select className="w-full border p-2 rounded text-sm" value={userForm.role} onChange={e => setUserForm({...userForm, role: e.target.value})}>
                                            <option value="sales">مبيعات (عروض الأسعار)</option>
                                            <option value="purchasing">مشتريات (أوامر الشراء)</option>
                                            <option value="finance">مالية (التحصيلات والالتزامات)</option>
                                            <option value="admin">مدير نظام (صلاحية كاملة)</option>
                                        </select>
                                        <button type="submit" className="w-full bg-green-600 text-white p-2 rounded text-sm font-bold">حفظ المستخدم</button>
                                    </form>
                                    <div className="space-y-2 border-t pt-3">
                                        {systemUsers.map(u => (
                                            <div key={u.id} className="flex justify-between items-center bg-gray-50 p-2.5 rounded text-sm">
                                                <span className="font-bold">{u.name}</span>
                                                <span className="bg-gray-200 px-2 py-1 rounded text-xs">{u.role}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'quotes' && (
                                <div className="space-y-6">
                                    <div className="bg-white p-5 rounded-xl border shadow-sm">
                                        <h3 className="font-bold mb-4">إصدار عرض سعر متوافق مع المكونات</h3>
                                        <form onSubmit={createQuote} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                            <select required className="border p-2 rounded text-sm" value={newQuote.clientCode} onChange={e => setNewQuote({...newQuote, clientCode: e.target.value})}>
                                                <option value="">اختر العميل من Master Data</option>
                                                {clients.map(c => <option key={c.code} value={c.code}>{c.name} ({c.code})</option>)}
                                            </select>
                                            <input type="text" placeholder="تفاصيل الخدمة/المشروع" required className="border p-2 rounded text-sm" value={newQuote.title} onChange={e => setNewQuote({...newQuote, title: e.target.value})} />
                                            <input type="number" placeholder="القيمة" required className="border p-2 rounded text-sm" value={newQuote.amount} onChange={e => setNewQuote({...newQuote, amount: e.target.value})} />
                                            <select className="border p-2 rounded text-sm" value={newQuote.paymentTerms} onChange={e => setNewQuote({...newQuote, paymentTerms: e.target.value})}>
                                                <option value="كاش">كاش</option>
                                                <option value="تحويل بنكي">تحويل بنكي</option>
                                            </select>
                                            <button type="submit" className="md:col-span-4 bg-blue-600 text-white p-2 rounded font-bold text-sm">إنشاء عرض السعر</button>
                                        </form>
                                    </div>
                                    <div className="bg-white rounded-xl border shadow-sm overflow-hidden">
                                        <table className="w-full text-right text-sm">
                                            <thead className="bg-gray-50 border-b">
                                                <tr>
                                                    <th className="p-3">العرض</th>
                                                    <th className="p-3">العميل المكود</th>
                                                    <th className="p-3">المبلغ</th>
                                                    <th className="p-3">الحالة</th>
                                                    <th className="p-3">الإجراء</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {quotes.map(q => (
                                                    <tr key={q.id} className="border-b">
                                                        <td className="p-3">{q.title}</td>
                                                        <td className="p-3 font-bold">{q.clientName} ({q.clientCode})</td>
                                                        <td className="p-3 font-bold">{q.amount.toLocaleString()} ج.م</td>
                                                        <td className="p-3">{q.status}</td>
                                                        <td className="p-3 space-x-1 space-x-reverse">
                                                            {q.status === 'قيد الانتظار' && (
                                                                <>
                                                                    <button onClick={() => updateQuoteStatus(q.id, 'مقبول')} className="bg-green-600 text-white px-2 py-1 rounded text-xs font-bold">قبول</button>
                                                                    <button onClick={() => updateQuoteStatus(q.id, 'مرفوض')} className="bg-red-600 text-white px-2 py-1 rounded text-xs font-bold">رفض</button>
                                                                </>
                                                            )}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'dashboard' && (
                                <div className="space-y-4">
                                    <h3 className="font-bold text-lg text-gray-800">سجل عمليات المنظومة وتحديثات البيانات</h3>
                                    <div className="bg-white p-4 rounded-xl border space-y-2 max-h-80 overflow-y-auto">
                                        {logs.map(l => (
                                            <div key={l.id} className="text-xs border-b pb-1 flex justify-between">
                                                <span className="font-bold text-blue-600">{l.user}: {l.action}</span>
                                                <span className="text-gray-400">{l.time}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'projects' && (
                                <div className="bg-white p-4 rounded-xl border space-y-3">
                                    <h3 className="font-bold text-gray-800">المشروعات النشطة والأكواد</h3>
                                    {projects.map(p => (
                                        <div key={p.id} className="p-3 bg-gray-50 border rounded flex justify-between items-center">
                                            <div>
                                                <span className="font-mono bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded ml-2">{p.id}</span>
                                                <span className="font-bold">{p.title}</span>
                                            </div>
                                            <span className="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">{p.status}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
