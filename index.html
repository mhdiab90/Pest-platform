  async function addLog(action,userOverride=currentUser){

      await db.ref('logs/'+id).set({id,user:userOverride.fullName || userOverride.email,time:new Date().toLocaleString(rtl?'ar-EG':'en-US'),action});

  async function handleLogin(e){
    e.preventDefault();setAuthError('');setAuthSuccess('');setBusy(true);
    try{await auth.signInWithEmailAndPassword(login.email.trim(),login.password);setLogin({email:'',password:''});}
    catch(err){setAuthError(firebaseErrorMessage(err,tr));setBusy(false);}
  }

  async function handleRegister(e){
    e.preventDefault();setAuthError('');setAuthSuccess('');setBusy(true);
    const email=request.email.trim().toLowerCase();
    const username=request.username.trim();
    if(!email || !username || !request.fullName.trim() || !request.jobTitle.trim() || request.password.length<6){
      setAuthError(rtl?'أكمل البيانات وتأكد أن كلمة المرور 6 أحرف على الأقل.':'Complete all fields and use a password of at least 6 characters.');setBusy(false);return;
    }
    if(/[.#$\[\]/]/.test(username)){setAuthError(rtl?'اسم المستخدم يحتوي على رموز غير مسموح بها.':'Username contains invalid characters.');setBusy(false);return;}
    registrationInProgress.current=true;
    let credential=null;let requestSaved=false;
    try{
      credential=await auth.createUserWithEmailAndPassword(email,request.password);
      const uid=credential.user.uid;
      await db.ref('userRequests/'+uid).set({uid,email,username,fullName:request.fullName.trim(),jobTitle:request.jobTitle.trim(),status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP});
      requestSaved=true;
      // Best-effort sign-out; once the request is saved, do not delete the Auth account or report a false failure.
      try{await auth.signOut();}catch(signOutErr){console.warn('Request saved, but local sign-out needs retry:',signOutErr);}
      setRequest({email:'',password:'',username:'',fullName:'',jobTitle:''});
      setView('login');setAuthError('');setAuthSuccess(tr('requestSent'));
    }catch(err){
      console.error('Account request:',err);
      if(credential && credential.user && !requestSaved){
        try{await credential.user.delete();}catch(deleteErr){console.warn('Temporary auth cleanup failed:',deleteErr);}
        try{await auth.signOut();}catch(signOutErr){console.warn(signOutErr);}
      }
      setAuthError(firebaseErrorMessage(err,tr));
    }finally{registrationInProgress.current=false;setBusy(false);}

  async function updateRequestStatus(req,status){
    if(!isAdmin || !req.uid) return;

      if(!req._hasAuthUid){
        if(status==='approved') return alert(tr('legacyReapply'));
        await db.ref('userRequests/'+req.id+'/status').set(status==='pending'?'مؤجل':'غير موافق');
        await addLog('تعديل حالة طلب قديم '+req.fullName+' إلى '+status);
        return;
      }
      const updates={};
      updates['userRequests/'+req.uid+'/status']=status;
      if(status==='approved'){
        updates['users/'+req.uid]={uid:req.uid,email:req.email,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,role:'user',status:'active',avatar:'',createdAt:firebase.database.ServerValue.TIMESTAMP};
        updates['userDirectory/'+req.uid]={uid:req.uid,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,status:'active'};
      }else{
        // Update profile/directory only when they already exist. A pending request
        // does not yet have a users/{uid} profile, so creating one here breaks login.
        const [userSnap,dirSnap]=await Promise.all([
          db.ref('users/'+req.uid).once('value'),
          db.ref('userDirectory/'+req.uid).once('value')
        ]);
        if(userSnap.exists()) updates['users/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
        if(dirSnap.exists()) updates['userDirectory/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
      }
      await db.ref().update(updates);
      await addLog('تغيير حالة طلب '+req.fullName+' إلى '+status);
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function sendExcelImport(e){
    e.preventDefault();if(!isAdmin) return;
    const file=e.target.elements.excelFile.files[0];if(!file) return alert(tr('noData'));
    try{
      const buffer=await file.arrayBuffer();
      const workbook=XLSX.read(buffer,{type:'array'});
      const updates={};let imported=0;let skipped=0;
      const norm=v=>String(v||'').trim().toLowerCase().replace(/[\s_\-]+/g,'');
      const aliases={type:['type','recordtype','نوع','النوع'],phone:['phone','mobile','telephone','هاتف','الهاتف','تليفون'],clientCode:['clientcode','customercode','كود العميل','كودالعميل'],amount:['amount','value','القيمة','المبلغ'],status:['status','الحالة']};
      const get=(row,keys)=>{for(const [k,v] of Object.entries(row)){if(keys.map(norm).includes(norm(k)) && v!==undefined && v!==null && String(v).trim()!=='') return String(v).trim();}return '';};
      workbook.SheetNames.forEach(sheetName=>{
        const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',raw:false});
        rows.forEach(row=>{
          const typeRaw=get(row,aliases.type).toLowerCase();
          const sheet=norm(sheetName);
          let type=typeRaw;
          if(!type){if(['clients','client','customers','customer','العملاء','عميل'].includes(sheet)) type='client';else if(['vendors','vendor','suppliers','supplier','الموردون','الموردين','مورد'].includes(sheet)) type='vendor';else if(['projects','project','المشروعات','المشاريع','مشروع'].includes(sheet)) type='project';}
          if(['clients','customer','customers','العملاء','عميل'].includes(type)) type='client';
          if(['vendors','supplier','suppliers','الموردون','الموردين','مورد'].includes(type)) type='vendor';
          if(['projects','المشروعات','المشاريع','مشروع'].includes(type)) type='project';
          const codeKeys=type==='project'?['projectcode','code','كودالمشروع','كود']:type==='vendor'?['vendorcode','suppliercode','code','كودالمورد','كود']:['clientcode','customercode','code','كودالعميل','كود'];
          const nameKeys=type==='project'?['projectname','name','اسم المشروع','اسمالمشروع','الاسم','اسم']:type==='vendor'?['vendorname','suppliername','name','اسم المورد','اسمالمورد','الاسم','اسم']:['clientname','customername','name','اسم العميل','اسمالعميل','الاسم','اسم'];
          const code=get(row,codeKeys),name=get(row,nameKeys);
          if(!['client','vendor','project'].includes(type)||!code||!name||/[.#$\[\]/]/.test(code)){skipped++;return;}
          if(type==='client'||type==='vendor'){
            const path=(type==='client'?'clients/':'vendors/')+code;
            updates[path+'/code']=code;updates[path+'/name']=name;
            const fieldAliases={phone:['phone','telephone','هاتف','الهاتف','تليفون'],mobile:['mobile','محمول'],alternatePhone:['alternatephone','phone2','هاتف اضافي'],email:['email','البريد الالكتروني','البريد الإلكتروني'],alternateEmail:['alternateemail','email2','بريد اضافي'],whatsapp:['whatsapp','واتساب'],website:['website','الموقع الالكتروني'],taxNumber:['taxnumber','taxregistration','taxregistrationnumber','رقم التسجيل الضريبي','الرقم الضريبي'],commercialRegister:['commercialregister','السجل التجاري'],contactPerson:['contactperson','الشخص المسؤول'],contactTitle:['contacttitle','صفة المسؤول'],address:['address','العنوان'],city:['city','المدينة'],country:['country','الدولة'],postalCode:['postalcode','الرمز البريدي'],paymentTerms:['paymentterms','شروط السداد'],creditLimit:['creditlimit','الحد الائتماني'],currency:['currency','العملة'],bankName:['bankname','اسم البنك'],bankAccount:['bankaccount','رقم الحساب'],iban:['iban'],notes:['notes','ملاحظات']};
            Object.entries(fieldAliases).forEach(([field,keys])=>{updates[path+'/'+field]=get(row,keys);});imported++;
          }else{
            const path='projects/'+code;
            const amountText=get(row,aliases.amount).replace(/,/g,'');
            const amount=Number(amountText||0);
            updates[path+'/code']=code;updates[path+'/name']=name;updates[path+'/clientCode']=get(row,aliases.clientCode);updates[path+'/amount']=Number.isFinite(amount)?amount:0;updates[path+'/status']=get(row,aliases.status)||'جاري';updates[path+'/contractNo']=get(row,['contractno','رقم العقد']);updates[path+'/purchaseOrderNo']=get(row,['purchaseorderno','رقم امر الشراء']);updates[path+'/projectManager']=get(row,['projectmanager','مدير المشروع']);updates[path+'/location']=get(row,['location','موقع التنفيذ']);updates[path+'/notes']=get(row,['notes','ملاحظات']);updates[path+'/taxNumber']=get(row,['taxnumber','taxregistration','رقم التسجيل الضريبي']);imported++;
          }
        });
      });
      if(!imported) return alert(tr('importNoRows'));
      await db.ref().update(updates);await addLog('استيراد بيانات من Excel: '+imported+' سجل');setExcelSummary(tr('importSuccess')+imported+(skipped?' · '+skipped+' skipped':''));e.target.reset();
    }catch(err){console.error('Excel import:',err);alert(firebaseErrorMessage(err,tr));}
  }

          <p className="text-sm text-gray-500 mb-4">{tr('registrationHint')}</p>
          <form onSubmit={handleRegister} className="space-y-3">
            <input required type="text" placeholder={tr('fullName')} className="w-full border rounded-lg p-3" value={request.fullName} onChange={e=>setRequest({...request,fullName:e.target.value})}/>
            <input required type="text" placeholder={tr('jobTitle')} className="w-full border rounded-lg p-3" value={request.jobTitle} onChange={e=>setRequest({...request,jobTitle:e.target.value})}/>
            <input required type="text" placeholder={tr('username')} className="w-full border rounded-lg p-3" value={request.username} onChange={e=>setRequest({...request,username:e.target.value})}/>
            <input required type="email" placeholder={tr('email')} className="w-full border rounded-lg p-3" value={request.email} onChange={e=>setRequest({...request,email:e.target.value})}/>
            <input required minLength="6" type="password" placeholder={tr('password')} className="w-full border rounded-lg p-3" value={request.password} onChange={e=>setRequest({...request,password:e.target.value})}/>
            <button disabled={busy} className="w-full bg-green-600 hover:bg-green-700 text-white rounded-lg p-3 font-bold">{busy?tr('loading'):tr('register')}</button>
          </form>
          <button onClick={()=>{setView('login');setAuthError('');}} className="w-full mt-3 bg-gray-100 rounded-lg p-3 text-sm">{rtl?'عودة لتسجيل الدخول':'Back to sign in'}</button>
        </>}
      </div>
    </div>;
  }

  return <div className="min-h-screen flex flex-col bg-gray-100">
    <header className="text-white p-3 px-5 flex justify-between items-center gap-3 shadow-lg" style={{background:themeOptions[theme]?.main || themeOptions.blue.main}}>
      <div className="flex items-center gap-3">{companyInfo.logo?<img src={companyInfo.logo} alt="Logo" className="h-10 w-10 object-contain bg-white rounded p-1"/>:<i className="fas fa-cubes text-white text-2xl"></i>}<div><h1 className="font-bold">{companyInfo.name || tr('app')}</h1><p className="text-xs text-white/75">{tr('app')}</p></div></div>
      <div className="flex items-center gap-3">
        <button onClick={()=>setLang(rtl?'en':'ar')} className="bg-black/20 px-3 py-2 rounded-lg text-sm">{tr('language')}</button><input value={globalSearch} onChange={e=>setGlobalSearch(e.target.value)} placeholder={tr('searchAll')} className="hidden lg:block rounded-lg px-3 py-2 text-slate-900 text-sm w-56" />
        <button onClick={openMessages} className="relative p-2" title={tr('messages')}><i className="fas fa-envelope text-xl"></i>{unreadMessages.length>0&&<span className="absolute -top-1 -right-1 rounded-full bg-red-600 text-xs px-1.5">{unreadMessages.length}</span>}</button>
        {isAdmin&&<button onClick={()=>{setTab('userRequests');setShowRequests(false);}} className="relative p-2" title={tr('pending')}><i className="fas fa-bell text-xl"></i>{pendingRequests.length>0&&<span className="absolute -top-1 -right-1 rounded-full bg-red-600 text-xs px-1.5">{pendingRequests.length}</span>}</button>}
        <div className="relative"><button onClick={()=>{setShowThemeMenu(!showThemeMenu);setShowUserMenu(false);}} className="p-2" title={tr('theme')}><i className="fas fa-palette text-xl"></i></button>
          {showThemeMenu&&<div className="absolute top-10 right-0 z-50 w-48 bg-white text-slate-800 rounded-xl shadow-xl p-3"><p className="font-bold text-sm mb-2">{tr('chooseTheme')}</p>{Object.keys(themeOptions).map(k=><button key={k} onClick={()=>{setTheme(k);setShowThemeMenu(false);}} className="menu-item flex items-center gap-2"><span className="w-4 h-4 rounded-full" style={{background:themeOptions[k].main}}></span>{tr(themeNames[k])}{theme===k?' ✓':''}</button>)}</div>}
        </div>
        <div className="relative"><button onClick={()=>{setShowUserMenu(!showUserMenu);setShowThemeMenu(false);}} className="flex items-center gap-2 p-1 rounded-lg hover:bg-black/10"><span className="hidden sm:block text-end"><b className="block text-sm">{currentUser.fullName}</b><small className="text-white/75">{currentUser.jobTitle}</small></span><i className="fas fa-cog text-xl"></i></button>
          {showUserMenu&&<div className="absolute top-11 end-0 z-50 w-72 bg-white text-slate-800 rounded-xl shadow-xl border p-3"><div className="flex items-center gap-3 border-b pb-3 mb-2">{currentUser.avatar?<img src={currentUser.avatar} alt="Profile" className="w-12 h-12 rounded-full object-cover"/>:<div className="w-12 h-12 rounded-full bg-blue-600 text-white grid place-items-center font-bold">{(currentUser.fullName||'?').charAt(0)}</div>}<div className="min-w-0"><b className="block truncate">{currentUser.fullName}</b><small className="block text-gray-500 truncate">{currentUser.email}</small><small className="block text-gray-500 truncate">@{currentUser.username} · {currentUser.jobTitle}</small></div></div><p className="text-xs font-bold text-gray-400 px-2 py-1">{tr('accountDetails')}</p><button className="menu-item" onClick={()=>{setTab('profile');setProfileSection('personal');setShowUserMenu(false);}}><i className="fas fa-user ml-2"></i>{tr('personalDetails')}</button><button className="menu-item" onClick={()=>{setTab('profile');setProfileSection('security');setShowUserMenu(false);}}><i className="fas fa-key ml-2"></i>{tr('savePassword')}</button><button className="menu-item" onClick={()=>{setTab('profile');setProfileSection('photo');setShowUserMenu(false);}}><i className="fas fa-image ml-2"></i>{tr('changePhoto')}</button><button className="menu-item" onClick={()=>{setTab('messages');setShowUserMenu(false);}}><i className="fas fa-envelope ml-2"></i>{tr('messages')}</button></div>}
        </div>
        <button onClick={logout} title={tr('logout')} className="p-2 rounded-lg hover:bg-black/10 text-white"><i className="fas fa-sign-out-alt text-xl"></i></button>
      </div>
    </header>
    {notificationToast&&<div className="fixed top-20 end-4 z-[70] bg-white border shadow-xl rounded-xl p-4 max-w-sm"><p className="font-bold">{tr('messageNotice')}</p><p className="text-sm text-gray-600 mt-1">{notificationToast.senderName}: {notificationToast.subject}</p><button onClick={openMessages} className="mt-2 text-sm text-blue-700 font-bold">{tr('openMessages')}</button><button onClick={()=>setNotificationToast(null)} className="ms-4 text-sm text-gray-500">×</button></div>}
    <div className="flex flex-1 flex-col md:flex-row">
      <aside className="w-full md:w-60 bg-white border-gray-200 p-3 space-y-1">
        {nav.map(([id,icon])=><button key={id} onClick={()=>setTab(id)} className={`nav-btn ${tab===id?'active':''} w-full text-start p-3 rounded-lg flex items-center gap-3`}><i className={`fas ${icon} w-5`}></i><span>{tr(id==='userRequests'?'requestsReport':id)}</span></button>)}
      </aside>
      <main className="flex-1 p-4 md:p-6 overflow-auto">
        {tab==='dashboard'&&<div className="space-y-5 print-area">
          <div className="flex flex-wrap justify-between items-center gap-3 no-print"><h2 className="font-bold text-xl">{tr('dashboard')} · {tr('cashFlow')}</h2><div className="flex gap-2 no-print"><button onClick={()=>setTab('reports')} className="bg-blue-600 text-white rounded-lg px-4 py-2 text-sm font-bold">{tr('reportCenter')}</button><button onClick={()=>window.print()} className="bg-gray-800 text-white rounded-lg px-4 py-2 text-sm">{tr('printPdf')}</button></div></div>
          <section className="bg-white p-4 rounded-xl border shadow-sm grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 no-print">
            <label className="text-sm font-bold">{tr('cashAllProjects')}<select className="block w-full border rounded-lg p-2 mt-1 font-normal" value={cashProjectFilter} onChange={e=>setCashProjectFilter(e.target.value)}><option value="all">{tr('cashAllProjects')}</option>{projects.map(p=><option key={p.code} value={p.code}>{p.name} ({p.code})</option>)}</select></label>
            <label className="text-sm font-bold">{tr('cashFromDate')}<input type="date" className="block w-full border rounded-lg p-2 mt-1 font-normal" value={cashFrom} onChange={e=>setCashFrom(e.target.value)}/></label>
            <label className="text-sm font-bold">{tr('cashToDate')}<input type="date" className="block w-full border rounded-lg p-2 mt-1 font-normal" value={cashTo} onChange={e=>setCashTo(e.target.value)}/></label>
            <div className="flex items-end"><button onClick={()=>{setCashProjectFilter('all');setCashFrom('');setCashTo('');}} className="w-full bg-gray-100 rounded-lg p-2">{tr('clear')}</button></div>
          </section>
          <p className="text-xs text-gray-500">{tr('cashScopeNote')}</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
            {[[tr('actualCashIn'),cashMapText(actualInMap),'#059669','fa-arrow-down'],[tr('actualCashOut'),cashMapText(actualOutMap),'#dc2626','fa-arrow-up'],[tr('netCashFlow'),cashMapText(netCashMap),'#2563eb','fa-scale-balanced'],[tr('receivables'),cashMapText(receivablesMap),'#0891b2','fa-hand-holding-dollar'],[tr('payables'),cashMapText(payablesMap),'#d97706','fa-file-invoice-dollar'],[tr('expectedNet'),cashMapText(expectedPositionMap),'#7c3aed','fa-chart-line']].map(([label,value,color,icon])=><div key={label} className="bg-white p-5 rounded-xl border shadow-sm flex items-start justify-between gap-3"><div className="min-w-0"><p className="text-sm text-gray-500 font-bold">{label}</p><p className="text-lg font-bold mt-2 break-words">{value}</p>{(label===tr('expectedNet')||label===tr('netCashFlow'))&&<p className="text-xs text-gray-500 mt-1">{Object.entries(label===tr('expectedNet')?expectedPositionMap:netCashMap).map(([cur,val])=>`${cur}: ${val>=0?tr('surplus'):tr('deficit')}`).join(' · ')}</p>}</div><i className={`fas ${icon} text-2xl`} style={{color}}></i></div>)}
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            {[[tr('clients'),clients.length,'fa-user-tie'],[tr('vendors'),vendors.length,'fa-truck'],[tr('projects'),selectedProjectsForCash.length,'fa-diagram-project'],[tr('users'),isAdmin?activeUsers.filter(u=>u._hasAuthUid || u.uid===currentUser.uid).length:'—','fa-users']].map(([label,value,icon])=><div key={label} className="bg-white p-4 rounded-xl border shadow-sm flex justify-between items-center"><div><p className="text-sm text-gray-500">{label}</p><p className="text-2xl font-bold mt-1">{value}</p></div><i className={`fas ${icon} text-2xl text-blue-500`}></i></div>)}
          </div>
          <section className="bg-white p-5 rounded-xl border shadow-sm"><div className="flex flex-wrap justify-between gap-3 items-center mb-3"><h3 className="font-bold">{tr('projectStatusSummary')}</h3><span className="text-xs text-gray-500">{tr('totalContractValue')}: {cashMapText(projectContractMap)} · {tr('estimatedProjectCost')}: {cashMapText(projectCostMap)}</span></div><div className="grid grid-cols-1 sm:grid-cols-3 gap-3"><div className="bg-blue-50 rounded-lg p-4"><small className="text-gray-600">{tr('activeProjects')}</small><b className="block text-2xl mt-1">{activeProjectCount}</b></div><div className="bg-green-50 rounded-lg p-4"><small className="text-gray-600">{tr('completedProjects')}</small><b className="block text-2xl mt-1">{completedProjectCount}</b></div><div className="bg-red-50 rounded-lg p-4"><small className="text-gray-600">{tr('delayedProjects')}</small><b className="block text-2xl mt-1">{delayedProjectCount}</b></div></div></section>
          <section className="bg-white p-5 rounded-xl border shadow-sm overflow-x-auto"><h3 className="font-bold mb-3">{tr('cashFlow')} · {tr('cashCurrency')}</h3><table className="w-full text-sm min-w-[760px]"><thead className="bg-gray-50"><tr><th className="p-3 text-start">{tr('cashCurrency')}</th><th className="p-3 text-start">{tr('cashActualIn')}</th><th className="p-3 text-start">{tr('cashActualOut')}</th><th className="p-3 text-start">{tr('cashNet')}</th><th className="p-3 text-start">{tr('currentReceivables')}</th><th className="p-3 text-start">{tr('currentPayables')}</th><th className="p-3 text-start">{tr('expectedPosition')}</th></tr></thead><tbody>{currencyKeys.map(cur=>{const net=netCashMap[cur]||0;const expected=expectedPositionMap[cur]||0;return <tr key={cur} className="border-t"><td className="p-3 font-bold">{cur}</td><td className="p-3 text-green-700">{money(actualInMap[cur]||0)}</td><td className="p-3 text-red-700">{money(actualOutMap[cur]||0)}</td><td className="p-3 font-bold">{money(net)}</td><td className="p-3">{money(receivablesMap[cur]||0)}</td><td className="p-3">{money(payablesMap[cur]||0)}</td><td className={`p-3 font-bold ${expected>=0?'text-green-700':'text-red-700'}`}>{money(expected)} · {expected>=0?tr('surplus'):tr('deficit')}</td></tr>})}{currencyKeys.length===0&&<tr><td colSpan="7" className="p-4 text-gray-500">{tr('noData')}</td></tr>}</tbody></table></section>
          <section className="bg-white p-5 rounded-xl border shadow-sm overflow-x-auto"><div className="flex flex-wrap justify-between items-center gap-3 mb-3"><h3 className="font-bold">{tr('projectPortfolio')}</h3><button onClick={()=>setTab('projects')} className="text-blue-700 text-sm font-bold">{tr('projects')}</button></div><table className="w-full text-sm min-w-[760px]"><thead className="bg-gray-50"><tr><th className="p-3 text-start">{tr('projectName')}</th><th className="p-3 text-start">{tr('status')}</th><th className="p-3 text-start">{tr('customers')}</th><th className="p-3 text-start">{tr('suppliers')}</th><th className="p-3 text-start">{tr('amount')}</th><th className="p-3 text-start">{tr('costBudget')}</th><th className="p-3 text-start">{tr('projectMargin')}</th><th className="p-3 text-start"></th></tr></thead><tbody>{selectedProjectsForCash.slice().sort((a,b)=>String(a.expectedEndDate||'').localeCompare(String(b.expectedEndDate||''))).slice(0,12).map(p=>{const clientsText=(p.clientCodes|| (p.clientCode?[p.clientCode]:[])).map(code=>clients.find(c=>c.code===code)?.name||code).join('، ');const vendorsText=(p.vendorCodes||[]).map(code=>vendors.find(v=>v.code===code)?.name||code).join('، ');const margin=Number(p.amount||0)-Number(p.costBudget||0);return <tr key={p.code} className="border-t"><td className="p-3"><b>{p.name}</b><small className="block text-gray-500">{p.code}</small></td><td className="p-3">{p.status||tr('projectStatus')}</td><td className="p-3">{clientsText||'—'}</td><td className="p-3">{vendorsText||'—'}</td><td className="p-3">{money(p.amount||0)} {p.currency||'EGP'}</td><td className="p-3">{money(p.costBudget||0)} {p.currency||'EGP'}</td><td className={`p-3 font-bold ${margin>=0?'text-green-700':'text-red-700'}`}>{money(margin)} {p.currency||'EGP'}</td><td className="p-3"><button onClick={()=>{setSelectedProjectCode(p.code);setTab('projectDetail');}} className="text-blue-700 font-bold">{tr('viewFile')}</button></td></tr>})}{selectedProjectsForCash.length===0&&<tr><td colSpan="8" className="p-4 text-gray-500">{tr('noProjects')}</td></tr>}</tbody></table></section>
          <section className="bg-white p-5 rounded-xl border shadow-sm"><h3 className="font-bold border-b pb-3 mb-3">{tr('recentCashMoves')}</h3>{recentCashEvents.length===0?<p className="text-sm text-gray-500">{tr('noCashMoves')}</p>:recentCashEvents.map(x=><div key={x.projectCode+'_'+x.id} className="py-3 border-b flex flex-wrap justify-between gap-2 text-sm"><div><b>{x.type==='customer_collection'?tr('customerCollection'):tr('supplierPayment')}</b> · {x.projectName} ({x.projectCode})<p className="text-gray-500 text-xs mt-1">{nameOfParty(x.partyType,x.partyCode)} · {x.referenceNo||'—'} {x.note?' · '+x.note:''}</p></div><div className="text-end"><b className={x.type==='customer_collection'?'text-green-700':'text-red-700'}>{money(x.amount)} {x.currency||'EGP'}</b><small className="block text-gray-400">{eventDateLabel(x.date)}</small></div></div>)}</section>
          <section className="bg-white p-5 rounded-xl border shadow-sm"><h3 className="font-bold border-b pb-3 mb-3">{tr('activity')}</h3>{logs.length===0?<p className="text-sm text-gray-500">{tr('noLogs')}</p>:logs.slice().reverse().slice(0,20).map(x=><div key={x.id} className="py-2 border-b text-sm flex flex-wrap justify-between gap-2"><b className="text-blue-700">{x.user}: {x.action}</b><span className="text-gray-400">{x.time}</span></div>)}</section>
        </div>}

        {tab==='statement'&&<section className="bg-white rounded-xl border shadow-sm p-5 space-y-5"><h2 className="font-bold text-lg">{tr('statement')}</h2><div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
          <label className="text-sm font-bold">{tr('accountType')}<select className="block w-full border rounded-lg p-3 mt-1" value={account.type} onChange={e=>setAccount({type:e.target.value,code:''})}><option value="client">{tr('client')}</option><option value="vendor">{tr('vendor')}</option></select></label>
          <label className="text-sm font-bold">{tr('selectAccount')}<select className="block w-full border rounded-lg p-3 mt-1" value={account.code} onChange={e=>setAccount({...account,code:e.target.value})}><option value="">{tr('choose')}</option>{selectedItems.map(x=><option key={x.code} value={x.code}>{x.name} ({x.code})</option>)}</select></label>
        </div>
        {chosen&&<div className="grid grid-cols-1 md:grid-cols-3 gap-4">{[[tr('due'),totalDue,'blue'],[tr('paid'),totalPaid,'green'],[tr('remaining'),totalDue-totalPaid,'amber']].map(([label,value,color])=><div key={label} className={`bg-${color}-50 border-r-4 border-${color}-600 p-4 rounded`}><p className="text-sm text-gray-500 font-bold">{label}</p><p className="text-2xl font-bold mt-2">{money(value)} EGP</p></div>)}</div>}
        </section>}

        {tab==='master'&&<div className="space-y-5">
          <div className="flex flex-wrap justify-between items-center gap-3"><h2 className="font-bold text-xl">{tr('master')}</h2><input className="border rounded-lg p-2 min-w-64" placeholder={tr('searchAll')} value={masterFilter} onChange={e=>setMasterFilter(e.target.value)}/></div>
          <section className="bg-white p-5 rounded-xl border shadow-sm"><div className="flex justify-between items-center mb-4"><h3 className="font-bold">{editingMasterCode?(rtl?'تعديل بيانات':'Edit record'):tr('add')}</h3>{editingMasterCode&&<button type="button" className="text-red-600" onClick={()=>{setMaster(blankMaster());setEditingMasterCode('');}}>{tr('clear')}</button>}</div>
            <form onSubmit={addMaster} className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
              <select className="border rounded-lg p-3" value={master.type} onChange={e=>{setMaster({...master,type:e.target.value});setEditingMasterCode('');}}><option value="client">{tr('client')}</option><option value="vendor">{tr('vendor')}</option></select>
              <input required className="border rounded-lg p-3" placeholder={tr('code')} value={master.code} onChange={e=>setMaster({...master,code:e.target.value})}/>
              <input required className="border rounded-lg p-3" placeholder={tr('name')} value={master.name} onChange={e=>setMaster({...master,name:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('taxRegistration')} value={master.taxNumber} onChange={e=>setMaster({...master,taxNumber:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('commercialReg')} value={master.commercialRegister} onChange={e=>setMaster({...master,commercialRegister:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('contactPerson')} value={master.contactPerson} onChange={e=>setMaster({...master,contactPerson:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('contactTitle')} value={master.contactTitle} onChange={e=>setMaster({...master,contactTitle:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('phone')} value={master.phone} onChange={e=>setMaster({...master,phone:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('mobile')} value={master.mobile} onChange={e=>setMaster({...master,mobile:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('alternatePhone')} value={master.alternatePhone} onChange={e=>setMaster({...master,alternatePhone:e.target.value})}/>
              <input type="email" className="border rounded-lg p-3" placeholder={tr('email')} value={master.email} onChange={e=>setMaster({...master,email:e.target.value})}/>
              <input type="email" className="border rounded-lg p-3" placeholder={tr('email2')} value={master.alternateEmail} onChange={e=>setMaster({...master,alternateEmail:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('whatsapp')} value={master.whatsapp} onChange={e=>setMaster({...master,whatsapp:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('websiteLabel')} value={master.website} onChange={e=>setMaster({...master,website:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('city')} value={master.city} onChange={e=>setMaster({...master,city:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('country')} value={master.country} onChange={e=>setMaster({...master,country:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('postalCode')} value={master.postalCode} onChange={e=>setMaster({...master,postalCode:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('paymentTerms')} value={master.paymentTerms} onChange={e=>setMaster({...master,paymentTerms:e.target.value})}/>
              <input type="number" min="0" className="border rounded-lg p-3" placeholder={tr('creditLimit')} value={master.creditLimit} onChange={e=>setMaster({...master,creditLimit:e.target.value})}/>
              <select className="border rounded-lg p-3" value={master.currency} onChange={e=>setMaster({...master,currency:e.target.value})}><option>EGP</option><option>USD</option><option>EUR</option><option>SAR</option><option>AED</option></select>
              <input className="border rounded-lg p-3" placeholder={tr('bankName')} value={master.bankName} onChange={e=>setMaster({...master,bankName:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('bankAccount')} value={master.bankAccount} onChange={e=>setMaster({...master,bankAccount:e.target.value})}/>
              <input className="border rounded-lg p-3" placeholder={tr('iban')} value={master.iban} onChange={e=>setMaster({...master,iban:e.target.value})}/>
              <textarea className="border rounded-lg p-3 md:col-span-2" rows="2" placeholder={tr('address')} value={master.address} onChange={e=>setMaster({...master,address:e.target.value})}></textarea>
              <textarea className="border rounded-lg p-3 md:col-span-2" rows="2" placeholder={tr('notes')} value={master.notes} onChange={e=>setMaster({...master,notes:e.target.value})}></textarea>
              <button className="md:col-span-3 bg-blue-600 text-white rounded-lg p-3 font-bold">{editingMasterCode?tr('save'):tr('add')}</button>
            </form>

            {reportType==='vendor'&&vendors.find(x=>x.code===reportEntity)&&(()=>{const v=vendors.find(x=>x.code===reportEntity);return <div className="grid grid-cols-2 md:grid-cols-3 gap-2 text-sm">{[[tr('name'),v.name],[tr('code'),v.code],[tr('taxRegistration'),v.taxNumber],[tr('contactPerson'),v.contactPerson],[tr('phone'),v.phone],[tr('mobile'),v.mobile],[tr('email'),v.email],[tr('address'),v.address],[tr('paymentTerms'),v.paymentTerms]].map(([k,val])=><div key={k}><small className="text-gray-500 block">{k}</small><b>{val||'—'}</b></div>)}</div>})()}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3"><div className="bg-gray-50 p-3 rounded-lg"><small>{tr('recordCount')}</small><b className="block text-xl">{reportRows.length}</b></div><div className="bg-red-50 p-3 rounded-lg"><small>{tr('totalPayments')}</small><b className="block text-xl">{cashMapText(reportRows.filter(e=>e.type==='supplier_payment' && cashEventSettled(e)))}</b></div><div className="bg-green-50 p-3 rounded-lg"><small>{tr('totalCollections')}</small><b className="block text-xl">{cashMapText(reportRows.filter(e=>e.type==='customer_collection' && cashEventSettled(e)))}</b></div></div>
            <div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-gray-50"><tr><th>{tr('eventDate')}</th><th>{tr('projectName')}</th><th>{tr('eventType')}</th><th>{tr('eventParty')}</th><th>{tr('referenceNo')}</th><th>{tr('quantity')}</th><th>{tr('eventAmount')}</th><th>{tr('eventStatus')}</th><th>{tr('eventNote')}</th></tr></thead><tbody>{reportRows.map(e=><tr key={e.projectCode+'_'+e.id}><td>{eventDateLabel(e.date)}</td><td>{e.projectName} ({e.projectCode})</td><td>{eventLabel(e.type)}</td><td>{e.partyCode?nameOfParty(e.partyType,e.partyCode):'—'}</td><td>{e.referenceNo||'—'}</td><td>{e.quantity||'—'} {e.unit||''}</td><td>{e.amount?money(e.amount)+' '+(e.currency||'EGP'):'—'}</td><td>{e.status||'—'}</td><td className="whitespace-pre-wrap">{e.note||'—'}</td></tr>)}</tbody></table>{reportRows.length===0&&<p className="text-gray-500 py-4">{tr('noData')}</p>}</div>
            <footer className="border-t pt-3 text-xs text-gray-500">{companyInfo.phone||''} {companyInfo.email||''} {companyInfo.address||''}</footer>
          </section>
        </div>}

        {tab==='userRequests'&&isAdmin&&<div className="space-y-5"><div className="flex flex-wrap items-center justify-between gap-3"><h2 className="font-bold text-xl">{tr('requestsReport')}</h2><select className="border rounded-lg p-2" value={requestFilter} onChange={e=>setRequestFilter(e.target.value)}><option value="all">{tr('allRequests')}</option><option value="pending">{tr('pendingLabel')}</option><option value="approved">{tr('approvedLabel')}</option><option value="rejected">{tr('rejectedLabel')}</option></select></div><section className="bg-white rounded-xl border shadow-sm overflow-x-auto"><table className="w-full text-sm"><thead className="bg-gray-50"><tr><th className="p-3 text-start">{tr('requestedUser')}</th><th className="p-3 text-start">{tr('requestDate')}</th><th className="p-3 text-start">{tr('requestStatus')}</th><th className="p-3 text-start">{tr('updateStatus')}</th></tr></thead><tbody>{filteredRequests.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(req=><tr key={req.uid} className="border-t align-top"><td className="p-3"><b>{req.fullName}</b><div className="text-gray-500">{req.email}</div><div className="text-gray-500">{req.username} · {req.jobTitle}</div>{!req._hasAuthUid&&<div className="text-amber-700 text-xs mt-1">{tr('legacyRequest')}</div>}</td><td className="p-3 whitespace-nowrap">{req.createdAt?new Date(req.createdAt).toLocaleString(rtl?'ar-EG':'en-US'):'—'}</td><td className="p-3"><span className="rounded-full bg-gray-100 px-2 py-1">{requestStatusLabel(req.status)}</span></td><td className="p-3 min-w-44"><select className="border rounded-lg p-2 w-full" value={requestStatusValue(req.status)} onChange={e=>updateRequestStatus(req,e.target.value)}><option value="pending">{tr('pendingLabel')}</option><option value="approved">{tr('approvedLabel')}</option><option value="rejected">{tr('rejectedLabel')}</option></select></td></tr>)}</tbody></table>{filteredRequests.length===0&&<p className="p-5 text-gray-500">{tr('noData')}</p>}</section></div>}

        {tab==='companySettings'&&isAdmin&&<div className="max-w-3xl space-y-5"><h2 className="font-bold text-xl">{tr('companySettings')}</h2><section className="bg-white p-5 rounded-xl border shadow-sm"><form onSubmit={saveCompany} className="grid grid-cols-1 md:grid-cols-2 gap-4"><label className="block text-sm font-bold md:col-span-2">{tr('companyName')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.name} onChange={e=>setCompanyForm({...companyForm,name:e.target.value})}/></label><label className="block text-sm font-bold">{tr('companyPhone')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.phone} onChange={e=>setCompanyForm({...companyForm,phone:e.target.value})}/></label><label className="block text-sm font-bold">{tr('companyEmail')}<input type="email" className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.email} onChange={e=>setCompanyForm({...companyForm,email:e.target.value})}/></label><label className="block text-sm font-bold">{tr('taxNumber')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.taxNumber} onChange={e=>setCompanyForm({...companyForm,taxNumber:e.target.value})}/></label><label className="block text-sm font-bold">{tr('commercialRegister')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.commercialRegister} onChange={e=>setCompanyForm({...companyForm,commercialRegister:e.target.value})}/></label><label className="block text-sm font-bold">{tr('website')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.website} onChange={e=>setCompanyForm({...companyForm,website:e.target.value})}/></label><label className="block text-sm font-bold md:col-span-2">{tr('companyAddress')}<textarea rows="2" className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.address} onChange={e=>setCompanyForm({...companyForm,address:e.target.value})}></textarea></label><div className="md:col-span-2"><p className="text-sm font-bold mb-2">{tr('companyLogo')}</p>{companyForm.logo&&<img src={companyForm.logo} alt="Company logo" className="h-24 max-w-56 object-contain border rounded-lg p-2 mb-3"/>}<label className="inline-block bg-gray-100 border rounded-lg px-4 py-2 cursor-pointer">{tr('uploadLogo')}<input type="file" accept="image/*" className="hidden" onChange={uploadCompanyLogo}/></label><button type="button" onClick={()=>setCompanyForm({...companyForm,logo:''})} className="text-red-600 text-sm ms-3">{rtl?'إزالة الشعار':'Remove logo'}</button></div><div className="md:col-span-2"><button className="bg-blue-600 text-white rounded-lg px-6 py-3 font-bold">{tr('save')}</button></div></form></section></div>}

                {tab==='profile'&&<section className="bg-white p-5 rounded-xl border shadow-sm max-w-2xl space-y-5"><h2 className="font-bold text-lg">{tr('profile')}</h2>
          <div className="flex flex-wrap gap-2 border-b pb-3"><button onClick={()=>setProfileSection('personal')} className={`px-3 py-2 rounded-lg ${profileSection==='personal'?'bg-blue-50 text-blue-700 font-bold':'bg-gray-100'}`}>{tr('personalDetails')}</button><button onClick={()=>setProfileSection('photo')} className={`px-3 py-2 rounded-lg ${profileSection==='photo'?'bg-blue-50 text-blue-700 font-bold':'bg-gray-100'}`}>{tr('changePhoto')}</button><button onClick={()=>setProfileSection('security')} className={`px-3 py-2 rounded-lg ${profileSection==='security'?'bg-blue-50 text-blue-700 font-bold':'bg-gray-100'}`}>{tr('savePassword')}</button></div>
          {profileSection==='personal'&&<form onSubmit={saveProfile} className="space-y-3"><label className="block text-sm font-bold">{tr('fullName')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.fullName} onChange={e=>setProfileForm({...profileForm,fullName:e.target.value})}/></label><label className="block text-sm font-bold">{tr('username')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.username} onChange={e=>setProfileForm({...profileForm,username:e.target.value})}/></label><label className="block text-sm font-bold">{tr('jobTitle')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.jobTitle} onChange={e=>setProfileForm({...profileForm,jobTitle:e.target.value})}/></label><label className="block text-sm font-bold">{tr('email')}<input required type="email" className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.email} onChange={e=>setProfileForm({...profileForm,email:e.target.value})}/></label>{profileForm.email.toLowerCase()!==String(currentUser.email||'').toLowerCase()&&<label className="block text-sm font-bold">{tr('currentPassword')}<input required type="password" className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileEmailPassword} onChange={e=>setProfileEmailPassword(e.target.value)}/></label>}<button className="bg-blue-600 text-white rounded-lg px-5 py-3 font-bold">{tr('saveProfile')}</button></form>}
          {profileSection==='photo'&&<div className="flex items-center gap-4">{currentUser.avatar?<img src={currentUser.avatar} alt="Profile" className="w-20 h-20 rounded-full object-cover"/>:<div className="w-20 h-20 rounded-full bg-slate-800 text-white grid place-items-center text-2xl">{(currentUser.fullName||'?').charAt(0)}</div>}<label className="inline-block bg-blue-600 text-white rounded-lg px-3 py-2 text-sm cursor-pointer">{tr('changePhoto')}<input type="file" accept="image/*" className="hidden" onChange={uploadAvatar}/></label></div>}
          {profileSection==='security'&&<form onSubmit={changePassword} className="space-y-3"><h3 className="font-bold">{tr('savePassword')}</h3><input type="password" required className="w-full border rounded-lg p-3" placeholder={tr('currentPassword')} value={currentPassword} onChange={e=>setCurrentPassword(e.target.value)}/><input type="password" minLength="6" required className="w-full border rounded-lg p-3" placeholder={tr('newPassword')} value={newPassword} onChange={e=>setNewPassword(e.target.value)}/><button className="bg-green-600 text-white rounded-lg px-5 py-3 font-bold">{tr('savePassword')}</button><button type="button" onClick={sendPasswordReset} className="block text-blue-600 text-sm">{tr('sendReset')}</button></form>}
        </section>}
      </main>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
