  useEffect(()=>{

      }finally{
        if(mounted){setAuthReady(true);setBusy(false);}
      }
    });
    return ()=>{mounted=false;unsubscribe();};
  },[]);

  // Subscribe only after Firebase Authentication and the active profile are confirmed.
  useEffect(()=>{
    if(!currentUser) return;
    const refs=[];
    const watch=(path,handler)=>{
      const ref=db.ref(path);
      ref.on('value',handler,err=>console.error('Database listener '+path,err));
      refs.push({ref,handler});
    };
    watch('userDirectory',s=>setUserDirectory(toArray(s.val())));
    watch('clients',s=>setClients(toArray(s.val())));
    watch('vendors',s=>setVendors(toArray(s.val())));
    watch('quotes',s=>setQuotes(toArray(s.val())));

    watch('outflows',s=>setOutflows(toArray(s.val())));
    watch('logs',s=>setLogs(toArray(s.val())));

      const next=toArray(s.val());
      if(messageIdsRef.current===null){messageIdsRef.current=new Set(next.map(m=>m.id));}
      else{
        next.forEach(m=>{
          if(!messageIdsRef.current.has(m.id) && m.senderUid!==currentUser.uid && m.read!==true){
          }
        });
        messageIdsRef.current=new Set(next.map(m=>m.id));
      }
      setMessages(next);
    });
    if(currentUser.role==='admin'){
      watch('users',s=>{
        const rawUsers=s.val()||{};const users=toArray(rawUsers);setActiveUsers(users);

          if(!u) return;

          // Never expose legacy username-keyed accounts in the recipient directory.
          if(linkedToAuth && Object.prototype.hasOwnProperty.call(u,'password')) updates['users/'+uid+'/password']=null;

        const cleanup={};

  function firebaseErrorMessage(err,tfn){
    const code=err && err.code ? err.code : '';
    if(code==='auth/invalid-email') return tfn('invalidEmail');
    if(['auth/user-not-found','auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(code)) return tfn('invalidLogin');
    if(code==='auth/email-already-in-use') return tfn('emailInUse');
    if(code==='auth/weak-password') return tfn('weakPassword');
    if(code==='auth/network-request-failed' || !navigator.onLine) return tfn('network');
    if(code==='PERMISSION_DENIED' || String(err && err.message).toLowerCase().includes('permission')) return tfn('permission');
    return tfn('generic')+(err && err.message ? err.message : 'Unknown error');
  }
  function toArray(obj){return obj ? Object.entries(obj).map(([key,val])=>({...val,id:val && val.id ? val.id : key,uid:val && val.uid ? val.uid : key,_hasAuthUid:Boolean(val && val.uid)})) : [];}
  const isAdmin=currentUser && currentUser.role==='admin';

    ...inflows.filter(x=>collected(x.status)).map(x=>({...x,id:'legacy-inflow-'+x.id,type:'customer_collection',partyType:'client',partyCode:x.clientCode||'',projectCode:x.projectCode||'',projectName:projects.find(p=>p.code===x.projectCode)?.name||'',referenceNo:x.referenceNo||x.voucherNo||x.invoiceNo||'',date:x.date||x.transactionDate||x.createdAt||'',amount:Number(x.amount||0),currency:x.currency||'EGP',status:'full',note:x.note||x.notes||''})),
    ...outflows.filter(x=>paid(x.status)).map(x=>({...x,id:'legacy-outflow-'+x.id,type:'supplier_payment',partyType:'vendor',partyCode:x.vendorCode||'',projectCode:x.projectCode||'',projectName:projects.find(p=>p.code===x.projectCode)?.name||'',referenceNo:x.referenceNo||x.voucherNo||x.invoiceNo||'',date:x.date||x.transactionDate||x.createdAt||'',amount:Number(x.amount||0),currency:x.currency||'EGP',status:'full',note:x.note||x.notes||''}))
  ];
  const reportProject=projects.find(p=>p.code===reportEntity)||projects.find(p=>p.code===selectedProjectCode);
  function rowDateKey(row){
    const raw=row && (row.date || row.transactionDate || row.invoiceDate || row.createdAt || row.timestamp);
    if(raw===undefined || raw===null || raw==='') return '';
    let date;
    if(typeof raw==='number') date=new Date(raw<1000000000000?raw*1000:raw);
    else{
      const value=String(raw);
      if(/^\d{4}-\d{2}-\d{2}/.test(value)) return value.slice(0,10);
      if(/^\d{10,13}$/.test(value)){const n=Number(value);date=new Date(n<1000000000000?n*1000:n);}
      else date=new Date(value);
    }
    if(Number.isNaN(date.getTime())) return '';
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;

  else if(reportType==='client') reportRows=[...allTimeline.filter(e=>(e.partyType==='client'&&e.partyCode===reportEntity)||projects.some(p=>p.code===e.projectCode&&((p.clientCodes||[]).includes(reportEntity)||p.clientCode===reportEntity))),...legacyCashTimeline.filter(e=>e.partyType==='client'&&e.partyCode===reportEntity)];

  const cashEventsAll=allTimeline.filter(e=>['supplier_payment','customer_collection'].includes(e.type) && cashEventSettled(e) && inCashProjectScope(e));
  const cashEventsPeriod=cashEventsAll.filter(inCashDateRange);
  const legacyReceiptsAll=inflows.filter(x=>collected(x.status) && inCashProjectScope(x));

  const legacyPaymentsAll=outflows.filter(x=>paid(x.status) && inCashProjectScope(x));
  const legacyPaymentsPeriod=legacyPaymentsAll.filter(inCashDateRange);
  const currencyMap=rows=>rows.reduce((map,row)=>{
    const code=String(row.currency||'EGP').toUpperCase();
    map[code]=(map[code]||0)+Number(row.amount||0);
    return map;
  },{});
  const mapCombine=(a,b,sign=1)=>{
    const out={...a};Object.entries(b).forEach(([k,v])=>{out[k]=(out[k]||0)+sign*Number(v||0);});return out;
  };
  const actualInMap=currencyMap([...cashEventsPeriod.filter(e=>e.type==='customer_collection'),...legacyReceiptsPeriod]);
  const actualOutMap=currencyMap([...cashEventsPeriod.filter(e=>e.type==='supplier_payment'),...legacyPaymentsPeriod]);
  const netCashMap=mapCombine(actualInMap,actualOutMap,-1);
  const selectedProjectsForCash=projects.filter(p=>cashProjectFilter==='all'||p.code===cashProjectFilter);
  const quoteRowsForCash=quotes.filter(q=>accepted(q.status) && (cashProjectFilter==='all'||String(q.projectCode||'')===cashProjectFilter));
  let receivableGrossMap=currencyMap(quoteRowsForCash);
  if(quoteRowsForCash.length===0){
    receivableGrossMap=currencyMap(selectedProjectsForCash.filter(p=>Number(p.amount||0)>0).map(p=>({amount:p.amount,currency:p.currency||'EGP'})));
  }
  const receiptsAllMap=currencyMap([...cashEventsAll.filter(e=>e.type==='customer_collection'),...legacyReceiptsAll]);
  const receivablesMap=mapCombine(receivableGrossMap,receiptsAllMap,-1);
  const supplierObligationMap=currencyMap(outflows.filter(x=>inCashProjectScope(x)));
  const supplierPaidLegacyMap=currencyMap(legacyPaymentsAll);
  // Payables are based on registered supplier obligations only. Project cost budgets
  // remain forecasts and are displayed separately, not treated as legally due balances.
  const payablesMap=mapCombine(supplierObligationMap,supplierPaidLegacyMap,-1);
  const expectedPositionMap=mapCombine(receivablesMap,payablesMap,-1);
  const projectContractMap=currencyMap(selectedProjectsForCash);
  const projectCostMap=currencyMap(selectedProjectsForCash.map(p=>({amount:p.costBudget||0,currency:p.currency||'EGP'})));
  const currencyKeys=[...new Set([...Object.keys(actualInMap),...Object.keys(actualOutMap),...Object.keys(netCashMap),...Object.keys(receivablesMap),...Object.keys(payablesMap),...Object.keys(expectedPositionMap)])].sort();
  const cashMapText=map=>{
    const rows=Object.entries(map).filter(([,v])=>Math.abs(Number(v||0))>0.000001).sort(([a],[b])=>a.localeCompare(b));
    return rows.length?rows.map(([currency,value])=>`${money(value)} ${currency}`).join('  |  '):`0.00 EGP`;
  };
  const isProjectCompleted=p=>/complete|completed|مكتمل|مغلق|منتهي|منتهى|done/i.test(String(p.status||''));
  const nowLocal=new Date();
  const todayKey=`${nowLocal.getFullYear()}-${String(nowLocal.getMonth()+1).padStart(2,'0')}-${String(nowLocal.getDate()).padStart(2,'0')}`;
  const completedProjectCount=selectedProjectsForCash.filter(isProjectCompleted).length;
  const delayedProjectCount=selectedProjectsForCash.filter(p=>!isProjectCompleted(p) && p.expectedEndDate && String(p.expectedEndDate)<todayKey).length;
  const activeProjectCount=selectedProjectsForCash.length-completedProjectCount;
  const recentCashEvents=cashEventsPeriod.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')) || Number(b.createdAt||0)-Number(a.createdAt||0)).slice(0,8);
  const currentReportTitle=reportType==='project'?tr('projectReport'):reportType==='client'?tr('clientReport'):reportType==='vendor'?tr('vendorReport'):tr('cashReport');
  const currentReportText=[currentReportTitle, reportEntity, ...reportRows.map(e=>`${e.date||''} | ${e.projectCode} ${e.projectName} | ${eventLabel(e.type)} | ${nameOfParty(e.partyType,e.partyCode)} | ${e.referenceNo||''} | ${e.amount||0} ${e.currency||'EGP'} | ${e.status||''} | ${e.note||''}`)].join('\n');
  const filteredClients=clients.filter(x=>includesText([x.code,x.name,x.englishName,x.taxNumber,x.phone,x.mobile,x.email,x.contactPerson].join(' '),masterFilter||globalSearch));
  const filteredVendors=vendors.filter(x=>includesText([x.code,x.name,x.englishName,x.taxNumber,x.phone,x.mobile,x.email,x.contactPerson].join(' '),masterFilter||globalSearch));
  const filteredProjects=projects.filter(x=>includesText([x.code,x.name,x.contractNo,x.purchaseOrderNo,x.status,x.projectManager,x.location].join(' '),projectFilter||globalSearch));

  async function handleRegister(e){
    e.preventDefault();setAuthError('');setAuthSuccess('');setBusy(true);
    const email=request.email.trim().toLowerCase();
    const username=request.username.trim();
    if(!email || !username || !request.fullName.trim() || !request.jobTitle.trim() || request.password.length<6){
      setAuthError(rtl?'أكمل البيانات وتأكد أن كلمة المرور 6 أحرف على الأقل.':'Complete all fields and use a password of at least 6 characters.');setBusy(false);return;
    }
    if(['.','#','$','[',']','/'].some(ch=>username.includes(ch))){setAuthError(rtl?'اسم المستخدم يحتوي على رموز غير مسموح بها.':'Username contains invalid characters.');setBusy(false);return;}
    registrationInProgress.current=true;
    let credential=null;let requestSaved=false;let signOutWarning=false;
    try{
      credential=await auth.createUserWithEmailAndPassword(email,request.password);
      const uid=credential.user.uid;
      registrationUid.current=uid;
      const requestData={uid,email,username,fullName:request.fullName.trim(),jobTitle:request.jobTitle.trim(),whatsapp:String(request.whatsapp||'').trim(),status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP};
      await db.ref('userRequests/'+uid).set(requestData);
      requestSaved=true;
      try{if(auth.currentUser && auth.currentUser.uid===uid) await auth.signOut();}
      catch(signOutErr){signOutWarning=true;console.warn('Request saved; sign-out failed:',signOutErr);}
      setRequest({email:'',password:'',username:'',fullName:'',jobTitle:'',whatsapp:''});
      setView('login');setAuthError('');
      setAuthSuccess(tr('requestSent')+(signOutWarning?' '+tr('requestSignOutWarning'):''));
    }catch(err){
      console.error('Account request:',err);
      if(requestSaved){
        setView('login');setAuthError('');setAuthSuccess(tr('requestSent'));
      }else{
        if(credential && credential.user){
          try{await credential.user.delete();}catch(deleteErr){console.warn('Temporary auth cleanup failed:',deleteErr);}
          try{await auth.signOut();}catch(signOutErr){console.warn(signOutErr);}
        }
        setAuthError(firebaseErrorMessage(err,tr));
      }
    }finally{registrationInProgress.current=false;setBusy(false);}
  }

  async function updateRequestStatus(req,status){
    if(!isAdmin || !req.uid) return;
    try{
      if(!req._hasAuthUid){
        if(status==='approved') return alert(tr('legacyReapply'));
        await db.ref('userRequests/'+req.id+'/status').set(status==='pending'?'مؤجل':'غير موافق');
        await addLog('تعديل حالة طلب قديم '+req.fullName+' إلى '+status);
        return;
      }
      const updates={};
      updates['userRequests/'+req.uid+'/status']=status;
      if(status==='approved'){
        updates['users/'+req.uid]={uid:req.uid,email:req.email,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,whatsapp:req.whatsapp||'',role:'user',status:'active',avatar:'',createdAt:firebase.database.ServerValue.TIMESTAMP};
        updates['userDirectory/'+req.uid]={uid:req.uid,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,whatsapp:req.whatsapp||'',status:'active'};
      }else{
        // Update profile/directory only when they already exist. A pending request
        // does not yet have a users/{uid} profile, so creating one here breaks login.
        const [userSnap,dirSnap]=await Promise.all([
          db.ref('users/'+req.uid).once('value'),
          db.ref('userDirectory/'+req.uid).once('value')
        ]);
        if(userSnap.exists()) updates['users/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
        if(dirSnap.exists()) updates['userDirectory/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
      }
      await db.ref().update(updates);
      await addLog('تغيير حالة طلب '+req.fullName+' إلى '+status);
      setRequestStatusDrafts(old=>{const next={...old};delete next[req.uid];return next;});
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  function readImageFile(file,maxBytes=450000){
    return new Promise((resolve,reject)=>{
      if(!file || !file.type.startsWith('image/')) return reject(new Error(rtl?'اختر ملف صورة صالحاً.':'Choose a valid image file.'));
      if(file.size>maxBytes) return reject(new Error(rtl?'حجم الصورة أكبر من الحد المسموح.':'Image exceeds the allowed size.'));
      const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('FILE_READ_ERROR'));reader.readAsDataURL(file);
    });
  }

  async function sendExcelImport(e){
    e.preventDefault();if(!isAdmin) return;
    const file=e.target.elements.excelFile.files[0];if(!file) return alert(tr('noData'));
    try{
      const buffer=await file.arrayBuffer();
      const workbook=XLSX.read(buffer,{type:'array'});
      const updates={};let imported=0;let skipped=0;
      const norm=v=>String(v||'').trim().toLowerCase().replace(/[\s_\-]+/g,'');
      const aliases={type:['type','recordtype','نوع','النوع'],phone:['phone','mobile','telephone','هاتف','الهاتف','تليفون'],clientCode:['clientcode','customercode','كود العميل','كودالعميل'],amount:['amount','value','القيمة','المبلغ'],status:['status','الحالة']};
      const get=(row,keys)=>{for(const [k,v] of Object.entries(row)){if(keys.map(norm).includes(norm(k)) && v!==undefined && v!==null && String(v).trim()!=='') return String(v).trim();}return '';};
      const normalizeExcelDate=value=>{
        const raw=String(value||'').trim();
        if(!raw) return '';
        const formatDate=(y,m,d)=>String(y)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)){
          const parts=raw.split('-').map(Number);
          return formatDate(parts[0],parts[1],parts[2]);
        }
        if(/^\d+(\.\d+)?$/.test(raw) && XLSX.SSF && XLSX.SSF.parse_date_code){
          const serial=XLSX.SSF.parse_date_code(Number(raw));
          if(serial && serial.y && serial.m && serial.d) return formatDate(serial.y,serial.m,serial.d);
        }
        const dmy=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
        if(dmy){
          const day=Number(dmy[1]),month=Number(dmy[2]),year=Number(dmy[3]);
          if(day>=1&&day<=31&&month>=1&&month<=12) return formatDate(year,month,day);
        }
        const parsed=new Date(raw);
        if(!Number.isNaN(parsed.getTime())) return formatDate(parsed.getFullYear(),parsed.getMonth()+1,parsed.getDate());
        return raw;
      };
      workbook.SheetNames.forEach(sheetName=>{
        const sheetKey=norm(sheetName);
        if(['instructions','readme','guide','تعليمات','ارشادات','إرشادات'].includes(sheetKey)) return;
        const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',raw:true});
        rows.forEach(row=>{
          const typeRaw=get(row,aliases.type).toLowerCase();
          const sheet=norm(sheetName);
          let type=typeRaw;
          if(!type){if(['clients','client','customers','customer','العملاء','عميل'].includes(sheet)) type='client';else if(['vendors','vendor','suppliers','supplier','الموردون','الموردين','مورد'].includes(sheet)) type='vendor';else if(['projects','project','المشروعات','المشاريع','مشروع'].includes(sheet)) type='project';}
          if(['clients','customer','customers','العملاء','عميل'].includes(type)) type='client';
          if(['vendors','supplier','suppliers','الموردون','الموردين','مورد'].includes(type)) type='vendor';
          if(['projects','المشروعات','المشاريع','مشروع'].includes(type)) type='project';
          const codeKeys=type==='project'?['projectcode','code','كودالمشروع','كود']:type==='vendor'?['vendorcode','suppliercode','code','كودالمورد','كود']:['clientcode','customercode','code','كودالعميل','كود'];
          const nameKeys=type==='project'?['projectname','name','اسم المشروع','اسمالمشروع','الاسم','اسم']:type==='vendor'?['vendorname','suppliername','name','اسم المورد','اسمالمورد','الاسم','اسم']:['clientname','customername','name','اسم العميل','اسمالعميل','الاسم','اسم'];
          const code=get(row,codeKeys),name=get(row,nameKeys);
          if(!['client','vendor','project'].includes(type)||!code||!name||/[.#$\[\]/]/.test(code)){skipped++;return;}
          if(type==='client'||type==='vendor'){
            const path=(type==='client'?'clients/':'vendors/')+code;

  function removeBackupSecrets(value){
    if(Array.isArray(value)) return value.map(removeBackupSecrets);
    if(!value || typeof value!=='object') return value;
    const safe={};
    Object.entries(value).forEach(([key,item])=>{
      if(/^(password|passwordhash|accesstoken|refreshtoken|idtoken|secret)$/i.test(key)) return;
      safe[key]=removeBackupSecrets(item);
    });
    return safe;
  }

  async function sendMessage(e){
    e.preventDefault();
    const names=message.recipients.split(',').map(x=>x.trim()).filter(Boolean);
    if(!names.length || !message.subject.trim() || !message.body.trim()) return alert(tr('noData'));
    const missing=[];const writes=[];
    names.forEach(name=>{
      const found=userDirectory.find(u=>u.status==='active' && String(u.username||'').toLowerCase()===name.toLowerCase());
      if(!found || !found.uid) missing.push(name);
      else{
        const receiverId=db.ref('messages/'+found.uid).push().key;
        const senderId=db.ref('messages/'+currentUser.uid).push().key;
        const base={recipientUid:found.uid,senderUid:currentUser.uid,senderName:currentUser.fullName,subject:message.subject.trim(),body:message.body.trim(),date:new Date().toLocaleString(rtl?'ar-EG':'en-US'),createdAt:firebase.database.ServerValue.TIMESTAMP};
        writes.push(db.ref('messages/'+found.uid+'/'+receiverId).set({...base,id:receiverId,mailboxUid:found.uid,read:false}));
        writes.push(db.ref('messages/'+currentUser.uid+'/'+senderId).set({...base,id:senderId,mailboxUid:currentUser.uid,read:true,copyType:'sent'}));
      }
    });
    if(!writes.length) return alert(tr('recipientsNotFound')+missing.join(', '));
    try{
      await Promise.all(writes);
      if(missing.length) alert(tr('recipientsNotFound')+missing.join(', '));
      else alert(tr('saved'));
      setMessage({recipients:'',subject:'',body:''});await addLog('إرسال رسالة داخلية');
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  function openWhatsAppDraft(){
    let phone=String(whatsappManualNumber||'').trim();
    let targetLabel='';
    if(whatsappTarget){
      const [kind,code]=whatsappTarget.split(':');
      let target=null;
      if(kind==='user') target=userDirectory.find(x=>x.uid===code);
      if(kind==='client') target=clients.find(x=>x.code===code);
      if(kind==='vendor') target=vendors.find(x=>x.code===code);
      if(target){
        phone=target.whatsapp||target.mobile||target.phone||'';
        targetLabel=target.fullName||target.name||target.username||'';
      }
    }
    let digits=phone.replace(/\D/g,'');
    if(digits.startsWith('00')) digits=digits.slice(2);
    if(!digits || digits.length<8 || digits.length>15){
      return alert(rtl?'اختر جهة اتصال لديها رقم WhatsApp صحيح، أو أدخل الرقم بكود الدولة.':'Choose a contact with a valid WhatsApp number or enter the number with country code.');
    }
    const textBody=[message.subject.trim(),message.body.trim()].filter(Boolean).join('\n\n');
    if(!textBody) return alert(tr('noData'));
    const url='https://wa.me/'+digits+'?text='+encodeURIComponent(textBody);
    window.open(url,'_blank','noopener,noreferrer');
    if(targetLabel) console.info('WhatsApp draft prepared for '+targetLabel);

        <div className="text-center mb-6">{companyInfo.logo?<img src={companyInfo.logo} alt="Company logo" className="h-20 max-w-48 object-contain mx-auto mb-3"/>:<div className="w-16 h-16 rounded-full bg-blue-600 text-white grid place-items-center mx-auto mb-3 text-2xl"><i className="fas fa-building"></i></div>}
          <h1 className="text-xl font-bold text-slate-800">{companyInfo.name || tr('app')}</h1><p className="text-sm text-gray-500 mt-2">{tr('app')}</p></div>
        {authError && <div className="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg mb-3 text-sm">{authError}</div>}
        {authSuccess && <div className="bg-green-50 border border-green-200 text-green-700 p-3 rounded-lg mb-3 text-sm">{authSuccess}</div>}
        {!authReady && <div className="text-center text-sm text-gray-500 mb-3"><i className="fas fa-spinner fa-spin mr-2"></i>{tr('loading')}</div>}
        {view==='login'?<>
          <p className="text-sm text-gray-500 mb-4">{tr('signInHint')}</p>
          <form onSubmit={handleLogin} className="space-y-3">
            <label className="block text-sm font-bold">{tr('email')}<input type="email" autoComplete="username" required className="mt-1 w-full border rounded-lg p-3 font-normal" value={login.email} onChange={e=>setLogin({...login,email:e.target.value})}/></label>
            <label className="block text-sm font-bold">{tr('password')}<input type="password" autoComplete="current-password" required className="mt-1 w-full border rounded-lg p-3 font-normal" value={login.password} onChange={e=>setLogin({...login,password:e.target.value})}/></label>
            <button disabled={busy || !authReady} className="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-3 font-bold">{busy?tr('loading'):tr('loginBtn')}</button>
          </form>
          <button onClick={sendPasswordReset} className="text-sm text-blue-600 hover:underline mt-3">{tr('forgot')}</button>
          <div className="border-t mt-5 pt-4 text-center"><button onClick={()=>{setView('register');setAuthError('');setAuthSuccess('');}} className="text-blue-600 font-bold text-sm">{tr('createRequest')}</button></div>
        </>:<>
          <p className="text-sm text-gray-500 mb-4">{tr('registrationHint')}</p>
          <form onSubmit={handleRegister} className="space-y-3">
            <input required type="text" placeholder={tr('fullName')} className="w-full border rounded-lg p-3" value={request.fullName} onChange={e=>setRequest({...request,fullName:e.target.value})}/>
            <input required type="text" placeholder={tr('jobTitle')} className="w-full border rounded-lg p-3" value={request.jobTitle} onChange={e=>setRequest({...request,jobTitle:e.target.value})}/>
            <input required type="text" placeholder={tr('username')} className="w-full border rounded-lg p-3" value={request.username} onChange={e=>setRequest({...request,username:e.target.value})}/>
            <input required type="email" placeholder={tr('email')} className="w-full border rounded-lg p-3" value={request.email} onChange={e=>setRequest({...request,email:e.target.value})}/>
            <input type="tel" placeholder={rtl?'رقم WhatsApp مع مفتاح الدولة':'WhatsApp number with country code'} className="w-full border rounded-lg p-3" value={request.whatsapp} onChange={e=>setRequest({...request,whatsapp:e.target.value})}/>
            <input required minLength="6" type="password" placeholder={tr('password')} className="w-full border rounded-lg p-3" value={request.password} onChange={e=>setRequest({...request,password:e.target.value})}/>
            <button disabled={busy} className="w-full bg-green-600 hover:bg-green-700 text-white rounded-lg p-3 font-bold">{busy?tr('loading'):tr('register')}</button>
          </form>
          <button onClick={()=>{setView('login');setAuthError('');}} className="w-full mt-3 bg-gray-100 rounded-lg p-3 text-sm">{rtl?'عودة لتسجيل الدخول':'Back to sign in'}</button>
        </>}
      </div>
    </div>;
  }

  return <div className="min-h-screen flex flex-col bg-gray-100">
    <header className="text-white p-3 px-5 flex justify-between items-center gap-3 shadow-lg" style={{background:themeOptions[theme]?.main || themeOptions.blue.main}}>
      <div className="flex items-center gap-3">{companyInfo.logo?<img src={companyInfo.logo} alt="Logo" className="h-10 w-10 object-contain bg-white rounded p-1"/>:<i className="fas fa-cubes text-white text-2xl"></i>}<div><h1 className="font-bold">{companyInfo.name || tr('app')}</h1><p className="text-xs text-white/75">{tr('app')}</p></div></div>
      <div className="flex items-center gap-3">
        <button onClick={()=>setLang(rtl?'en':'ar')} className="bg-black/20 px-3 py-2 rounded-lg text-sm">{tr('language')}</button><input value={globalSearch} onChange={e=>setGlobalSearch(e.target.value)} placeholder={tr('searchAll')} className="hidden lg:block rounded-lg px-3 py-2 text-slate-900 text-sm w-56" />
        <div className="relative">
          <button type="button" aria-expanded={notificationOpen} onClick={()=>setNotificationOpen(old=>!old)} className="relative p-2 rounded-lg hover:bg-black/10" title={rtl?'التنبيهات':'Notifications'}><i className="fas fa-bell text-xl"></i>{notificationItems.length>0&&<span className="absolute -top-1 -right-1 rounded-full bg-red-600 text-xs min-w-5 px-1.5 text-center">{notificationItems.length}</span>}</button>
          {notificationOpen&&<div className="absolute end-0 top-12 z-[80] w-[min(92vw,370px)] max-h-[70vh] overflow-y-auto bg-white text-slate-800 rounded-xl shadow-2xl border">
            <div className="p-3 border-b flex items-center justify-between"><b>{rtl?'مركز التنبيهات':'Notification center'}</b><span className="text-xs text-gray-500">{notificationItems.length} {rtl?'غير مقروء':'unread'}</span></div>
            {notificationItems.length===0?<p className="p-5 text-sm text-gray-500 text-center">{rtl?'لا توجد تنبيهات جديدة.':'No new notifications.'}</p>:notificationItems.map(item=><button key={item.id} type="button" onClick={()=>openNotification(item)} className="w-full text-start p-3 border-b hover:bg-slate-50 flex items-start gap-3"><span className={'w-9 h-9 shrink-0 rounded-full grid place-items-center '+(item.type==='message'?'bg-blue-50 text-blue-700':'bg-amber-50 text-amber-700')}><i className={'fas '+(item.type==='message'?'fa-envelope':'fa-user-plus')}></i></span><span className="min-w-0 flex-1"><b className="block text-sm">{item.title}</b><span className="block text-xs text-gray-500 mt-1 truncate">{item.description}</span><span className="block text-[11px] text-gray-400 mt-1">{item.type==='message'?(rtl?'اضغط لفتح الرسالة واعتبارها مقروءة':'Open and mark as read'):(rtl?'اضغط لفتح طلب المستخدم واعتباره تمت مراجعته':'Open and mark request as seen')}</span></span><i className="fas fa-chevron-left text-xs text-gray-400 mt-2"></i></button>)}
          </div>}
        </div>
        <div className="relative"><button onClick={()=>{setShowThemeMenu(!showThemeMenu);setShowUserMenu(false);}} className="p-2" title={tr('theme')}><i className="fas fa-palette text-xl"></i></button>
          {showThemeMenu&&<div className="absolute top-10 right-0 z-50 w-48 bg-white text-slate-800 rounded-xl shadow-xl p-3"><p className="font-bold text-sm mb-2">{tr('chooseTheme')}</p>{Object.keys(themeOptions).map(k=><button key={k} onClick={()=>{setTheme(k);setShowThemeMenu(false);}} className="menu-item flex items-center gap-2"><span className="w-4 h-4 rounded-full" style={{background:themeOptions[k].main}}></span>{tr(themeNames[k])}{theme===k?' ✓':''}</button>)}</div>}
        </div>
        <div className="relative"><button onClick={()=>{setShowUserMenu(!showUserMenu);setShowThemeMenu(false);}} className="flex items-center gap-2 p-1 rounded-lg hover:bg-black/10"><span className="hidden sm:block text-end"><b className="block text-sm">{currentUser.fullName}</b><small className="text-white/75">{currentUser.jobTitle}</small></span><i className="fas fa-cog text-xl"></i></button>
          {showUserMenu&&<div className="absolute top-11 end-0 z-50 w-72 bg-white text-slate-800 rounded-xl shadow-xl border p-3"><div className="flex items-center gap-3 border-b pb-3 mb-2">{currentUser.avatar?<img src={currentUser.avatar} alt="Profile" className="w-12 h-12 rounded-full object-cover"/>:<div className="w-12 h-12 rounded-full bg-blue-600 text-white grid place-items-center font-bold">{(currentUser.fullName||'?').charAt(0)}</div>}<div className="min-w-0"><b className="block truncate">{currentUser.fullName}</b><small className="block text-gray-500 truncate">{currentUser.email}</small><small className="block text-gray-500 truncate">@{currentUser.username} · {currentUser.jobTitle}</small></div></div><p className="text-xs font-bold text-gray-400 px-2 py-1">{tr('accountDetails')}</p><button className="menu-item" onClick={()=>{setTab('profile');setProfileSection('personal');setShowUserMenu(false);}}><i className="fas fa-user ml-2"></i>{tr('personalDetails')}</button><button className="menu-item" onClick={()=>{setTab('profile');setProfileSection('security');setShowUserMenu(false);}}><i className="fas fa-key ml-2"></i>{tr('savePassword')}</button><button className="menu-item" onClick={()=>{setTab('profile');setProfileSection('photo');setShowUserMenu(false);}}><i className="fas fa-image ml-2"></i>{tr('changePhoto')}</button><button className="menu-item" onClick={()=>{setTab('messages');setShowUserMenu(false);}}><i className="fas fa-envelope ml-2"></i>{tr('messages')}</button></div>}
        </div>
        <button onClick={logout} title={tr('logout')} className="p-2 rounded-lg hover:bg-black/10 text-white"><i className="fas fa-sign-out-alt text-xl"></i></button>
      </div>
    </header>
    <div className="flex flex-1 flex-col md:flex-row">
      <aside className="app-sidebar w-full md:w-60 bg-white border-gray-200 p-2 md:p-3 space-y-1">
        <div className="app-nav-grid">
          {navGroups.map(group=><div className="app-nav-group" key={group.id}>
            {group.tab?<button onClick={()=>navigateToTab(group.tab)} className={'nav-btn '+(tab===group.tab?'active':'')+' w-full text-start p-3 rounded-lg flex items-center gap-3'}><i className={'fas '+group.icon+' w-5'}></i><span className="truncate">{group.label}</span></button>:
              <><button type="button" aria-expanded={expandedNavGroup===group.id} onClick={()=>setExpandedNavGroup(expandedNavGroup===group.id?'':group.id)} className="app-nav-parent"><span className="flex items-center gap-2 min-w-0"><i className={'fas '+group.icon+' w-5'}></i><span className="truncate">{group.label}</span></span><i className={'fas '+(expandedNavGroup===group.id?'fa-chevron-up':'fa-chevron-down')+' text-xs text-gray-400'}></i></button>
              {expandedNavGroup===group.id&&<div className="app-nav-children">{group.children.map(item=><button key={item.id} onClick={()=>navigateToTab(item.id)} className={'app-nav-child '+(tab===item.id?'active':'')}><i className={'fas '+item.icon+' w-4'}></i><span>{item.label}</span></button>)}</div>}</>}
          </div>)}
        </div>
      </aside>
      <main className="flex-1 overflow-auto app-workspace">
        {tab==='dashboard'&&<div className="space-y-5 print-area">
          <div className="flex flex-wrap justify-between items-center gap-3 no-print"><h2 className="font-bold text-xl">{tr('dashboard')} · {tr('cashFlow')}</h2><div className="flex gap-2 no-print"><button onClick={()=>setTab('reports')} className="bg-blue-600 text-white rounded-lg px-4 py-2 text-sm font-bold">{tr('reportCenter')}</button><button onClick={()=>window.print()} className="bg-gray-800 text-white rounded-lg px-4 py-2 text-sm">{tr('printPdf')}</button></div></div>
          <details open className="app-collapsible"><summary><span>{rtl?'فلاتر التدفق النقدي':'Cash flow filters'}</span></summary><div className="app-collapsible-body"><section className="bg-white p-4 rounded-xl border shadow-sm grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 no-print">
            <label className="text-sm font-bold">{tr('cashAllProjects')}<select className="block w-full border rounded-lg p-2 mt-1 font-normal" value={cashProjectFilter} onChange={e=>setCashProjectFilter(e.target.value)}><option value="all">{tr('cashAllProjects')}</option>{projects.map(p=><option key={p.code} value={p.code}>{p.name} ({p.code})</option>)}</select></label>
            <label className="text-sm font-bold">{tr('cashFromDate')}<input type="date" className="block w-full border rounded-lg p-2 mt-1 font-normal" value={cashFrom} onChange={e=>setCashFrom(e.target.value)}/></label>
            <label className="text-sm font-bold">{tr('cashToDate')}<input type="date" className="block w-full border rounded-lg p-2 mt-1 font-normal" value={cashTo} onChange={e=>setCashTo(e.target.value)}/></label>
            <div className="flex items-end"><button onClick={()=>{setCashProjectFilter('all');setCashFrom('');setCashTo('');}} className="w-full bg-gray-100 rounded-lg p-2">{tr('clear')}</button></div>
          </section></div></details>
          <p className="text-xs text-gray-500">{tr('cashScopeNote')}</p>
          <details open className="app-collapsible"><summary><span>{rtl?'ملخص التدفق النقدي':'Cash flow overview'}</span></summary><div className="app-collapsible-body"><div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
            {[[tr('actualCashIn'),cashMapText(actualInMap),'#059669','fa-arrow-down'],[tr('actualCashOut'),cashMapText(actualOutMap),'#dc2626','fa-arrow-up'],[tr('netCashFlow'),cashMapText(netCashMap),'#2563eb','fa-scale-balanced'],[tr('receivables'),cashMapText(receivablesMap),'#0891b2','fa-hand-holding-dollar'],[tr('payables'),cashMapText(payablesMap),'#d97706','fa-file-invoice-dollar'],[tr('expectedNet'),cashMapText(expectedPositionMap),'#7c3aed','fa-chart-line']].map(([label,value,color,icon])=><div key={label} className="bg-white p-5 rounded-xl border shadow-sm flex items-start justify-between gap-3"><div className="min-w-0"><p className="text-sm text-gray-500 font-bold">{label}</p><p className="text-lg font-bold mt-2 break-words">{value}</p>{(label===tr('expectedNet')||label===tr('netCashFlow'))&&<p className="text-xs text-gray-500 mt-1">{Object.entries(label===tr('expectedNet')?expectedPositionMap:netCashMap).map(([cur,val])=>`${cur}: ${val>=0?tr('surplus'):tr('deficit')}`).join(' · ')}</p>}</div><i className={`fas ${icon} text-2xl`} style={{color}}></i></div>)}
          </div>
          </div></div></details>
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            {[[tr('clients'),clients.length,'fa-user-tie'],[tr('vendors'),vendors.length,'fa-truck'],[tr('projects'),selectedProjectsForCash.length,'fa-diagram-project'],[tr('users'),isAdmin?activeUsers.filter(u=>u._hasAuthUid || u.uid===currentUser.uid).length:'—','fa-users']].map(([label,value,icon])=><div key={label} className="bg-white p-4 rounded-xl border shadow-sm flex justify-between items-center"><div><p className="text-sm text-gray-500">{label}</p><p className="text-2xl font-bold mt-1">{value}</p></div><i className={`fas ${icon} text-2xl text-blue-500`}></i></div>)}
          </div>
          <details open className="app-collapsible"><summary><span>{tr('projectStatusSummary')}</span></summary><div className="app-collapsible-body"><section className="bg-white p-5 rounded-xl border shadow-sm"><div className="flex flex-wrap justify-between gap-3 items-center mb-3"><h3 className="font-bold">{tr('projectStatusSummary')}</h3><span className="text-xs text-gray-500">{tr('totalContractValue')}: {cashMapText(projectContractMap)} · {tr('estimatedProjectCost')}: {cashMapText(projectCostMap)}</span></div><div className="grid grid-cols-1 sm:grid-cols-3 gap-3"><div className="bg-blue-50 rounded-lg p-4"><small className="text-gray-600">{tr('activeProjects')}</small><b className="block text-2xl mt-1">{activeProjectCount}</b></div><div className="bg-green-50 rounded-lg p-4"><small className="text-gray-600">{tr('completedProjects')}</small><b className="block text-2xl mt-1">{completedProjectCount}</b></div><div className="bg-red-50 rounded-lg p-4"><small className="text-gray-600">{tr('delayedProjects')}</small><b className="block text-2xl mt-1">{delayedProjectCount}</b></div></div></section></div></details>
          <details open className="app-collapsible"><summary><span>{tr('cashFlow')} · {tr('cashCurrency')}</span></summary><div className="app-collapsible-body"><section className="bg-white p-5 rounded-xl border shadow-sm overflow-x-auto"><h3 className="font-bold mb-3">{tr('cashFlow')} · {tr('cashCurrency')}</h3><div className="app-table-scroll"><table className="w-full text-sm min-w-[760px]"><thead className="bg-gray-50"><tr><th className="p-3 text-start">{tr('cashCurrency')}</th><th className="p-3 text-start">{tr('cashActualIn')}</th><th className="p-3 text-start">{tr('cashActualOut')}</th><th className="p-3 text-start">{tr('cashNet')}</th><th className="p-3 text-start">{tr('currentReceivables')}</th><th className="p-3 text-start">{tr('currentPayables')}</th><th className="p-3 text-start">{tr('expectedPosition')}</th></tr></thead><tbody>{currencyKeys.map(cur=>{const net=netCashMap[cur]||0;const expected=expectedPositionMap[cur]||0;return <tr key={cur} className="border-t"><td className="p-3 font-bold">{cur}</td><td className="p-3 text-green-700">{money(actualInMap[cur]||0)}</td><td className="p-3 text-red-700">{money(actualOutMap[cur]||0)}</td><td className="p-3 font-bold">{money(net)}</td><td className="p-3">{money(receivablesMap[cur]||0)}</td><td className="p-3">{money(payablesMap[cur]||0)}</td><td className={`p-3 font-bold ${expected>=0?'text-green-700':'text-red-700'}`}>{money(expected)} · {expected>=0?tr('surplus'):tr('deficit')}</td></tr>})}{currencyKeys.length===0&&<tr><td colSpan="7" className="p-4 text-gray-500">{tr('noData')}</td></tr>}</tbody></table></div></section></div></details>
          <details open className="app-collapsible"><summary><span>{tr('projectPortfolio')}</span></summary><div className="app-collapsible-body"><section className="bg-white p-5 rounded-xl border shadow-sm overflow-x-auto"><div className="flex flex-wrap justify-between items-center gap-3 mb-3"><h3 className="font-bold">{tr('projectPortfolio')}</h3><button onClick={()=>setTab('projects')} className="text-blue-700 text-sm font-bold">{tr('projects')}</button></div><div className="app-table-scroll"><table className="w-full text-sm min-w-[760px]"><thead className="bg-gray-50"><tr><th className="p-3 text-start">{tr('projectName')}</th><th className="p-3 text-start">{tr('status')}</th><th className="p-3 text-start">{tr('customers')}</th><th className="p-3 text-start">{tr('suppliers')}</th><th className="p-3 text-start">{tr('amount')}</th><th className="p-3 text-start">{tr('costBudget')}</th><th className="p-3 text-start">{tr('projectMargin')}</th><th className="p-3 text-start"></th></tr></thead><tbody>{selectedProjectsForCash.slice().sort((a,b)=>String(a.expectedEndDate||'').localeCompare(String(b.expectedEndDate||''))).slice(0,12).map(p=>{const clientsText=(p.clientCodes|| (p.clientCode?[p.clientCode]:[])).map(code=>clients.find(c=>c.code===code)?.name||code).join('، ');const vendorsText=(p.vendorCodes||[]).map(code=>vendors.find(v=>v.code===code)?.name||code).join('، ');const margin=Number(p.amount||0)-Number(p.costBudget||0);return <tr key={p.code} className="border-t"><td className="p-3"><b>{p.name}</b><small className="block text-gray-500">{p.code}</small></td><td className="p-3">{p.status||tr('projectStatus')}</td><td className="p-3">{clientsText||'—'}</td><td className="p-3">{vendorsText||'—'}</td><td className="p-3">{money(p.amount||0)} {p.currency||'EGP'}</td><td className="p-3">{money(p.costBudget||0)} {p.currency||'EGP'}</td><td className={`p-3 font-bold ${margin>=0?'text-green-700':'text-red-700'}`}>{money(margin)} {p.currency||'EGP'}</td><td className="p-3"><button onClick={()=>{setSelectedProjectCode(p.code);setTab('projectDetail');}} className="text-blue-700 font-bold">{tr('viewFile')}</button></td></tr>})}{selectedProjectsForCash.length===0&&<tr><td colSpan="8" className="p-4 text-gray-500">{tr('noProjects')}</td></tr>}</tbody></table></div></section></div></details>
          <details open className="app-collapsible"><summary><span>{tr('recentCashMoves')}</span></summary><div className="app-collapsible-body"><section className="bg-white p-5 rounded-xl border shadow-sm"><h3 className="font-bold border-b pb-3 mb-3">{tr('recentCashMoves')}</h3><div className="app-list-scroll">{recentCashEvents.length===0?<p className="text-sm text-gray-500">{tr('noCashMoves')}</p>:recentCashEvents.map(x=><div key={x.projectCode+'_'+x.id} className="py-3 border-b flex flex-wrap justify-between gap-2 text-sm"><div><b>{x.type==='customer_collection'?tr('customerCollection'):tr('supplierPayment')}</b> · {x.projectName} ({x.projectCode})<p className="text-gray-500 text-xs mt-1">{nameOfParty(x.partyType,x.partyCode)} · {x.referenceNo||'—'} {x.note?' · '+x.note:''}</p></div><div className="text-end"><b className={x.type==='customer_collection'?'text-green-700':'text-red-700'}>{money(x.amount)} {x.currency||'EGP'}</b><small className="block text-gray-400">{eventDateLabel(x.date)}</small></div></div>)}</div></section></div></details>
          <details open className="app-collapsible"><summary><span>{tr('activity')}</span></summary><div className="app-collapsible-body"><section className="bg-white p-5 rounded-xl border shadow-sm"><h3 className="font-bold border-b pb-3 mb-3">{tr('activity')}</h3><div className="app-list-scroll">{logs.length===0?<p className="text-sm text-gray-500">{tr('noLogs')}</p>:logs.slice().reverse().slice(0,20).map(x=><div key={x.id} className="py-2 border-b text-sm flex flex-wrap justify-between gap-2"><b className="text-blue-700">{x.user}: {x.action}</b><span className="text-gray-400">{x.time}</span></div>)}</div></section></div></details>
        </div>}

        {tab==='statement'&&<details open className="app-collapsible"><summary><span>{tr('statement')}</span></summary><div className="app-collapsible-body"><div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
          <label className="text-sm font-bold">{tr('accountType')}<select className="block w-full border rounded-lg p-3 mt-1" value={account.type} onChange={e=>setAccount({type:e.target.value,code:''})}><option value="client">{tr('client')}</option><option value="vendor">{tr('vendor')}</option></select></label>
          <label className="text-sm font-bold">{tr('selectAccount')}<select className="block w-full border rounded-lg p-3 mt-1" value={account.code} onChange={e=>setAccount({...account,code:e.target.value})}><option value="">{tr('choose')}</option>{selectedItems.map(x=><option key={x.code} value={x.code}>{x.name} ({x.code})</option>)}</select></label>
        </div>
        {chosen&&<div className="grid grid-cols-1 md:grid-cols-3 gap-4">{[[tr('due'),totalDue,'blue'],[tr('paid'),totalPaid,'green'],[tr('remaining'),totalDue-totalPaid,'amber']].map(([label,value,color])=><div key={label} className={`bg-${color}-50 border-r-4 border-${color}-600 p-4 rounded`}><p className="text-sm text-gray-500 font-bold">{label}</p><p className="text-2xl font-bold mt-2">{money(value)} EGP</p></div>)}</div>}
        </div></details>}

ding">{tr('pendingLabel')}</option><option value="approved">{tr('approvedLabel')}</option><option value="rejected">{tr('rejectedLabel')}</option></select><button type="button" disabled={!requestStatusDrafts[req.uid]||requestStatusDrafts[req.uid]===requestStatusValue(req.status)} onClick={()=>updateRequestStatus(req,requestStatusDrafts[req.uid])} className="rounded-lg px-3 py-2 text-sm font-bold text-white bg-blue-600 disabled:bg-gray-300">{rtl?'تطبيق':'Apply'}</button></div></td></tr>)}</tbody></table></div>{filteredRequests.length===0&&<p className="p-5 text-gray-500">{tr('noData')}</p>}</div></div></details></div>}

        {tab==='companySettings'&&isAdmin&&<div className="max-w-3xl space-y-5"><h2 className="font-bold text-xl">{tr('companySettings')}</h2><details open className="app-collapsible"><summary><span>{tr('companySettings')}</span></summary><div className="app-collapsible-body"><form onSubmit={saveCompany} className="grid grid-cols-1 md:grid-cols-2 gap-4"><label className="block text-sm font-bold md:col-span-2">{tr('companyName')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.name} onChange={e=>setCompanyForm({...companyForm,name:e.target.value})}/></label><label className="block text-sm font-bold">{tr('companyPhone')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.phone} onChange={e=>setCompanyForm({...companyForm,phone:e.target.value})}/></label><label className="block text-sm font-bold">{tr('companyEmail')}<input type="email" className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.email} onChange={e=>setCompanyForm({...companyForm,email:e.target.value})}/></label><label className="block text-sm font-bold">{tr('taxNumber')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.taxNumber} onChange={e=>setCompanyForm({...companyForm,taxNumber:e.target.value})}/></label><label className="block text-sm font-bold">{tr('commercialRegister')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.commercialRegister} onChange={e=>setCompanyForm({...companyForm,commercialRegister:e.target.value})}/></label><label className="block text-sm font-bold">{tr('website')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.website} onChange={e=>setCompanyForm({...companyForm,website:e.target.value})}/></label><label className="block text-sm font-bold md:col-span-2">{tr('companyAddress')}<textarea rows="2" className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.address} onChange={e=>setCompanyForm({...companyForm,address:e.target.value})}></textarea></label><div className="md:col-span-2"><p className="text-sm font-bold mb-2">{tr('companyLogo')}</p>{companyForm.logo&&<img src={companyForm.logo} alt="Company logo" className="h-24 max-w-56 object-contain border rounded-lg p-2 mb-3"/>}<label className="inline-block bg-gray-100 border rounded-lg px-4 py-2 cursor-pointer">{tr('uploadLogo')}<input type="file" accept="image/*" className="hidden" onChange={uploadCompanyLogo}/></label><button type="button" onClick={()=>setCompanyForm({...companyForm,logo:''})} className="text-red-600 text-sm ms-3">{rtl?'إزالة الشعار':'Remove logo'}</button></div><div className="md:col-span-2"><button className="bg-blue-600 text-white rounded-lg px-6 py-3 font-bold">{tr('save')}</button></div></form></div></details></div>}

                {tab==='profile'&&<details open className="app-collapsible"><summary><span>{tr('profile')}</span></summary><div className="app-collapsible-body"><section className="bg-white p-5 rounded-xl border shadow-sm max-w-2xl space-y-5"><h2 className="font-bold text-lg">{tr('profile')}</h2>
          <div className="flex flex-wrap gap-2 border-b pb-3"><button onClick={()=>setProfileSection('personal')} className={`px-3 py-2 rounded-lg ${profileSection==='personal'?'bg-blue-50 text-blue-700 font-bold':'bg-gray-100'}`}>{tr('personalDetails')}</button><button onClick={()=>setProfileSection('photo')} className={`px-3 py-2 rounded-lg ${profileSection==='photo'?'bg-blue-50 text-blue-700 font-bold':'bg-gray-100'}`}>{tr('changePhoto')}</button><button onClick={()=>setProfileSection('security')} className={`px-3 py-2 rounded-lg ${profileSection==='security'?'bg-blue-50 text-blue-700 font-bold':'bg-gray-100'}`}>{tr('savePassword')}</button></div>
          {profileSection==='personal'&&<form onSubmit={saveProfile} className="space-y-3"><label className="block text-sm font-bold">{tr('fullName')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.fullName} onChange={e=>setProfileForm({...profileForm,fullName:e.target.value})}/></label><label className="block text-sm font-bold">{tr('username')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.username} onChange={e=>setProfileForm({...profileForm,username:e.target.value})}/></label><label className="block text-sm font-bold">{tr('jobTitle')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.jobTitle} onChange={e=>setProfileForm({...profileForm,jobTitle:e.target.value})}/></label><label className="block text-sm font-bold">{tr('email')}<input required type="email" className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.email} onChange={e=>setProfileForm({...profileForm,email:e.target.value})}/></label><label className="block text-sm font-bold">{rtl?'رقم WhatsApp / الهاتف':'WhatsApp / mobile number'}<input type="tel" placeholder="+20 10 0000 0000" className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.whatsapp} onChange={e=>setProfileForm({...profileForm,whatsapp:e.target.value})}/></label>{profileForm.email.toLowerCase()!==String(currentUser.email||'').toLowerCase()&&<label className="block text-sm font-bold">{tr('currentPassword')}<input required type="password" className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileEmailPassword} onChange={e=>setProfileEmailPassword(e.target.value)}/></label>}<button className="bg-blue-600 text-white rounded-lg px-5 py-3 font-bold">{tr('saveProfile')}</button></form>}
          {profileSection==='photo'&&<div className="flex items-center gap-4">{currentUser.avatar?<img src={currentUser.avatar} alt="Profile" className="w-20 h-20 rounded-full object-cover"/>:<div className="w-20 h-20 rounded-full bg-slate-800 text-white grid place-items-center text-2xl">{(currentUser.fullName||'?').charAt(0)}</div>}<label className="inline-block bg-blue-600 text-white rounded-lg px-3 py-2 text-sm cursor-pointer">{tr('changePhoto')}<input type="file" accept="image/*" className="hidden" onChange={uploadAvatar}/></label></div>}
          {profileSection==='security'&&<form onSubmit={changePassword} className="space-y-3"><h3 className="font-bold">{tr('savePassword')}</h3><input type="password" required className="w-full border rounded-lg p-3" placeholder={tr('currentPassword')} value={currentPassword} onChange={e=>setCurrentPassword(e.target.value)}/><input type="password" minLength="6" required className="w-full border rounded-lg p-3" placeholder={tr('newPassword')} value={newPassword} onChange={e=>setNewPassword(e.target.value)}/><button className="bg-green-600 text-white rounded-lg px-5 py-3 font-bold">{tr('savePassword')}</button><button type="button" onClick={sendPasswordReset} className="block text-blue-600 text-sm">{tr('sendReset')}</button></form>}
        </section></div></details>}
      </main>
    </div>
  </div>;
}

class AppErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={hasError:false,error:null}; }
  static getDerivedStateFromError(error){ return {hasError:true,error}; }
  componentDidCatch(error,info){ console.error('Application render error:',error,info); }
  render(){
    if(this.state.hasError){
      const msg=this.state.error && this.state.error.message ? this.state.error.message : 'Unknown error';
      return <div className="min-h-screen bg-slate-100 flex items-center justify-center p-5"><div className="bg-white max-w-2xl w-full rounded-xl border shadow p-6"><h1 className="font-bold text-red-700 text-xl mb-3">تعذر عرض الشاشة الرئيسية</h1><p className="text-gray-700 mb-3">حدث خطأ أثناء تشغيل الواجهة. أرسل نص الخطأ التالي للدعم الفني:</p><pre className="whitespace-pre-wrap break-words bg-gray-100 rounded p-3 text-sm">{msg}</pre><button className="mt-4 bg-blue-600 text-white rounded px-4 py-2" onClick={()=>window.location.reload()}>إعادة تحميل البرنامج</button></div></div>;
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppErrorBoundary><App/></AppErrorBoundary>);
</script>
</body>
</html>
