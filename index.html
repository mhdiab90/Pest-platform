  async function compressProfileImage(file){
    if(!file || !file.type || !file.type.startsWith('image/')) throw new Error(rtl?'اختر ملف صورة صالحاً.':'Choose a valid image file.');
    if(file.size>12*1024*1024) throw new Error(rtl?'حجم الصورة الأصلية كبير جداً (الحد 12 ميجابايت).':'The original image is too large (12 MB maximum).');
    const objectUrl=URL.createObjectURL(file);
    const image=new Image();
    await new Promise((resolve,reject)=>{
      image.onload=()=>{URL.revokeObjectURL(objectUrl);resolve();};
      image.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error(rtl?'تعذر قراءة الصورة.':'The image could not be read.'));};
      image.src=objectUrl;
    });
    if(!image.naturalWidth || !image.naturalHeight) throw new Error(rtl?'ملف الصورة غير صالح.':'The image file is invalid.');
    let edge=480;
    for(let attempt=0;attempt<7;attempt++){
      const scale=Math.min(1,edge/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      const context=canvas.getContext('2d');
      if(!context) throw new Error(rtl?'تعذر تجهيز الصورة.':'Could not process the image.');
      context.fillStyle='#ffffff';
      context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(image,0,0,canvas.width,canvas.height);
      const quality=Math.max(0.48,0.84-(attempt*0.07));
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
      if(blob && blob.size<=140*1024){
        return await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(reader.result);
          reader.onerror=()=>reject(new Error(rtl?'تعذر تجهيز الصورة للحفظ.':'Could not prepare the image for saving.'));
          reader.readAsDataURL(blob);
        });
      }
      edge=Math.max(160,Math.round(edge*0.82));
    }
    throw new Error(rtl?'تعذر ضغط الصورة إلى الحجم المناسب. اختر صورة أصغر.':'Could not compress the image enough. Please choose a smaller image.');
  }

  async function handleRegister(e){
    e.preventDefault();setAuthError('');setAuthSuccess('');setBusy(true);
    const email=request.email.trim().toLowerCase();
    const username=request.username.trim();
    if(!email || !username || !request.fullName.trim() || !request.jobTitle.trim() || request.password.length<6){
      setAuthError(rtl?'أكمل البيانات وتأكد أن كلمة المرور 6 أحرف على الأقل.':'Complete all fields and use a password of at least 6 characters.');setBusy(false);return;
    }
    if(['.','#','$','[',']','/'].some(ch=>username.includes(ch))){setAuthError(rtl?'اسم المستخدم يحتوي على رموز غير مسموح بها.':'Username contains invalid characters.');setBusy(false);return;}
    registrationInProgress.current=true;
    let credential=null;let requestSaved=false;let signOutWarning=false;
    try{
      credential=await auth.createUserWithEmailAndPassword(email,request.password);
      const uid=credential.user.uid;
      registrationUid.current=uid;
      const requestData={uid,email,username,fullName:request.fullName.trim(),jobTitle:request.jobTitle.trim(),whatsapp:String(request.whatsapp||'').trim(),avatar:requestAvatar||'',status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP};
      await db.ref('userRequests/'+uid).set(requestData);
      requestSaved=true;
      try{if(auth.currentUser && auth.currentUser.uid===uid) await auth.signOut();}
      catch(signOutErr){signOutWarning=true;console.warn('Request saved; sign-out failed:',signOutErr);}
      setRequest({email:'',password:'',username:'',fullName:'',jobTitle:'',whatsapp:''});setRequestAvatar('');
      setView('login');setAuthError('');
      setAuthSuccess(tr('requestSent')+(signOutWarning?' '+tr('requestSignOutWarning'):''));
    }catch(err){
      console.error('Account request:',err);
      if(requestSaved){
        setView('login');setAuthError('');setAuthSuccess(tr('requestSent'));
      }else{
        if(credential && credential.user){
          try{await credential.user.delete();}catch(deleteErr){console.warn('Temporary auth cleanup failed:',deleteErr);}
          try{await auth.signOut();}catch(signOutErr){console.warn(signOutErr);}
        }
        setAuthError(firebaseErrorMessage(err,tr));
      }
    }finally{registrationInProgress.current=false;setBusy(false);}
  }

  async function updateRequestStatus(req,status){
    if(!isAdmin || !req.uid) return;
    try{
      if(!req._hasAuthUid){
        if(status==='approved') return alert(tr('legacyReapply'));
        await db.ref('userRequests/'+req.id+'/status').set(status==='pending'?'مؤجل':'غير موافق');
        await addLog('تعديل حالة طلب قديم '+req.fullName+' إلى '+status);
        return;
      }
      const updates={};
      updates['userRequests/'+req.uid+'/status']=status;
      if(status==='approved'){
        updates['users/'+req.uid]={uid:req.uid,email:req.email,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,whatsapp:req.whatsapp||'',role:'user',status:'active',permissions:{},avatar:req.avatar||'',createdAt:firebase.database.ServerValue.TIMESTAMP};
        updates['userDirectory/'+req.uid]={uid:req.uid,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,whatsapp:req.whatsapp||'',avatar:req.avatar||'',status:'active'};
      }else{
        // Update profile/directory only when they already exist. A pending request
        // does not yet have a users/{uid} profile, so creating one here breaks login.
        const [userSnap,dirSnap]=await Promise.all([
          db.ref('users/'+req.uid).once('value'),
          db.ref('userDirectory/'+req.uid).once('value')
        ]);
        if(userSnap.exists()) updates['users/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
        if(dirSnap.exists()) updates['userDirectory/'+req.uid+'/status']=status==='rejected'?'disabled':'pending';
      }
      await db.ref().update(updates);
      await addLog('تغيير حالة طلب '+req.fullName+' إلى '+status);
      setRequestStatusDrafts(old=>{const next={...old};delete next[req.uid];return next;});
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  async function sendExcelImport(e){
    e.preventDefault();if(!isAdmin) return;
    const file=e.target.elements.excelFile.files[0];if(!file) return alert(tr('noData'));
    try{
      const buffer=await file.arrayBuffer();
      const workbook=XLSX.read(buffer,{type:'array'});
      const updates={};let imported=0;let skipped=0;
      const norm=v=>String(v||'').trim().toLowerCase().replace(/[\s_\-]+/g,'');
      const aliases={type:['type','recordtype','نوع','النوع'],phone:['phone','mobile','telephone','هاتف','الهاتف','تليفون'],clientCode:['clientcode','customercode','كود العميل','كودالعميل'],amount:['amount','value','القيمة','المبلغ'],status:['status','الحالة']};
      const get=(row,keys)=>{for(const [k,v] of Object.entries(row)){if(keys.map(norm).includes(norm(k)) && v!==undefined && v!==null && String(v).trim()!=='') return String(v).trim();}return '';};
      const normalizeExcelDate=value=>{
        const raw=String(value||'').trim();
        if(!raw) return '';
        const formatDate=(y,m,d)=>String(y)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)){
          const parts=raw.split('-').map(Number);
          return formatDate(parts[0],parts[1],parts[2]);
        }
        if(/^\d+(\.\d+)?$/.test(raw) && XLSX.SSF && XLSX.SSF.parse_date_code){
          const serial=XLSX.SSF.parse_date_code(Number(raw));
          if(serial && serial.y && serial.m && serial.d) return formatDate(serial.y,serial.m,serial.d);
        }
        const dmy=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
        if(dmy){
          const day=Number(dmy[1]),month=Number(dmy[2]),year=Number(dmy[3]);
          if(day>=1&&day<=31&&month>=1&&month<=12) return formatDate(year,month,day);
        }
        const parsed=new Date(raw);
        if(!Number.isNaN(parsed.getTime())) return formatDate(parsed.getFullYear(),parsed.getMonth()+1,parsed.getDate());
        return raw;
      };
      workbook.SheetNames.forEach(sheetName=>{
        const sheetKey=norm(sheetName);
        if(['instructions','readme','guide','تعليمات','ارشادات','إرشادات'].includes(sheetKey)) return;
        const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',raw:true});
        rows.forEach(row=>{
          const typeRaw=get(row,aliases.type).toLowerCase();
          const sheet=norm(sheetName);
          let type=typeRaw;
          if(!type){if(['clients','client','customers','customer','العملاء','عميل'].includes(sheet)) type='client';else if(['vendors','vendor','suppliers','supplier','الموردون','الموردين','مورد'].includes(sheet)) type='vendor';else if(['projects','project','المشروعات','المشاريع','مشروع'].includes(sheet)) type='project';}
          if(['clients','customer','customers','العملاء','عميل'].includes(type)) type='client';
          if(['vendors','supplier','suppliers','الموردون','الموردين','مورد'].includes(type)) type='vendor';
          if(['projects','المشروعات','المشاريع','مشروع'].includes(type)) type='project';
          const codeKeys=type==='project'?['projectcode','code','كودالمشروع','كود']:type==='vendor'?['vendorcode','suppliercode','code','كودالمورد','كود']:['clientcode','customercode','code','كودالعميل','كود'];
          const nameKeys=type==='project'?['projectname','name','اسم المشروع','اسمالمشروع','الاسم','اسم']:type==='vendor'?['vendorname','suppliername','name','اسم المورد','اسمالمورد','الاسم','اسم']:['clientname','customername','name','اسم العميل','اسمالعميل','الاسم','اسم'];
          const code=get(row,codeKeys),name=get(row,nameKeys);
          if(!['client','vendor','project'].includes(type)||!code||!name||/[.#$\[\]/]/.test(code)){skipped++;return;}
          if(type==='client'||type==='vendor'){
            const path=(type==='client'?'clients/':'vendors/')+code;
            updates[path+'/code']=code;updates[path+'/name']=name;
            const fieldAliases={englishName:['englishname','english name','الاسم بالانجليزية','الاسم بالإنجليزية'],phone:['phone','telephone','هاتف','الهاتف','تليفون'],mobile:['mobile','محمول'],alternatePhone:['alternatephone','phone2','هاتف اضافي'],email:['email','البريد الالكتروني','البريد الإلكتروني'],alternateEmail:['alternateemail','email2','بريد اضافي'],whatsapp:['whatsapp','واتساب'],website:['website','الموقع الالكتروني'],taxNumber:['taxnumber','taxregistration','taxregistrationnumber','رقم التسجيل الضريبي','الرقم الضريبي'],commercialRegister:['commercialregister','السجل التجاري'],contactPerson:['contactperson','الشخص المسؤول'],contactTitle:['contacttitle','صفة المسؤول'],address:['address','العنوان'],city:['city','المدينة'],country:['country','الدولة'],postalCode:['postalcode','الرمز البريدي'],paymentTerms:['paymentterms','شروط السداد'],creditLimit:['creditlimit','الحد الائتماني'],currency:['currency','العملة'],bankName:['bankname','اسم البنك'],bankAccount:['bankaccount','رقم الحساب'],iban:['iban'],notes:['notes','ملاحظات']};
            Object.entries(fieldAliases).forEach(([field,keys])=>{const value=get(row,keys);if(value!=='') updates[path+'/'+field]=value;});imported++;
          }else{
            const path='projects/'+code;
            const amountText=get(row,aliases.amount).replace(/,/g,'');
            const amount=Number(amountText||0);
            const setIfProvided=(field,value)=>{if(value!=='' && value!==undefined && value!==null) updates[path+'/'+field]=value;};
            updates[path+'/code']=code;updates[path+'/name']=name;
            const clientCodes=get(row,['clientcodes','customercodes','clientcode','customercode','كود العميل','اكواد العملاء']).split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
            const vendorCodes=get(row,['vendorcodes','suppliercodes','vendorcode','suppliercode','كود المورد','اكواد الموردين']).split(/[;,|]/).map(x=>x.trim()).filter(Boolean);
            if(clientCodes.length){updates[path+'/clientCodes']=clientCodes;updates[path+'/clientCode']=clientCodes[0];}
            if(vendorCodes.length) updates[path+'/vendorCodes']=vendorCodes;
            setIfProvided('amount',amountText!=='' && Number.isFinite(amount)?amount:'');
            setIfProvided('costBudget',get(row,['costbudget','estimatedcost','التكلفة التقديرية','التكلفة']));
            setIfProvided('status',get(row,aliases.status));setIfProvided('currency',get(row,['currency','العملة']));
            setIfProvided('contractNo',get(row,['contractno','رقم العقد']));setIfProvided('purchaseOrderNo',get(row,['purchaseorderno','رقم امر الشراء','رقم أمر الشراء']));
            setIfProvided('projectManager',get(row,['projectmanager','مدير المشروع']));setIfProvided('projectType',get(row,['projecttype','نوع المشروع','نوع التوريد']));
            setIfProvided('startDate',normalizeExcelDate(get(row,['startdate','تاريخ البدء'])));setIfProvided('expectedEndDate',normalizeExcelDate(get(row,['expectedenddate','تاريخ الانتهاء المتوقع'])));setIfProvided('actualEndDate',normalizeExcelDate(get(row,['actualenddate','تاريخ الانتهاء الفعلي'])));
            setIfProvided('location',get(row,['location','موقع التنفيذ']));setIfProvided('deliveryAddress',get(row,['deliveryaddress','عنوان التسليم']));
            setIfProvided('paymentTerms',get(row,['paymentterms','شروط السداد']));setIfProvided('scope',get(row,['scope','نطاق الأعمال']));setIfProvided('notes',get(row,['notes','ملاحظات']));
            imported++;
          }
        });
      });
      if(!imported) return alert(tr('importNoRows'));
      await db.ref().update(updates);await addLog('استيراد بيانات من Excel: '+imported+' سجل');setExcelSummary(tr('importSuccess')+imported+(skipped?' · '+skipped+' skipped':''));e.target.reset();
    }catch(err){console.error('Excel import:',err);alert(firebaseErrorMessage(err,tr));}
  }

  function triggerDownload(blob,filename){

    link.href=url;link.download=filename;link.style.display='none';

  function removeBackupSecrets(value){
    if(Array.isArray(value)) return value.map(removeBackupSecrets);
    if(!value || typeof value!=='object') return value;
    const safe={};
    Object.entries(value).forEach(([key,item])=>{
      if(/^(password|passwordhash|accesstoken|refreshtoken|idtoken|secret)$/i.test(key)) return;
      safe[key]=removeBackupSecrets(item);
    });
    return safe;
  }

  async function sendMessage(e){
    e.preventDefault();if(!requirePermission('messages','add'))return;
    const names=message.recipients.split(',').map(x=>x.trim()).filter(Boolean);
    if(!names.length || !message.subject.trim() || !message.body.trim()) return alert(tr('noData'));
    const missing=[];const writes=[];
    names.forEach(name=>{
      const found=userDirectory.find(u=>u.status==='active' && String(u.username||'').toLowerCase()===name.toLowerCase());
      if(!found || !found.uid) missing.push(name);
      else{
        const receiverId=db.ref('messages/'+found.uid).push().key;
        const senderId=db.ref('messages/'+currentUser.uid).push().key;
        const base={recipientUid:found.uid,senderUid:currentUser.uid,senderName:currentUser.fullName,senderAvatar:currentUser.avatar||'',subject:message.subject.trim(),body:message.body.trim(),date:new Date().toLocaleString(rtl?'ar-EG':'en-US'),createdAt:firebase.database.ServerValue.TIMESTAMP};
        writes.push(db.ref('messages/'+found.uid+'/'+receiverId).set({...base,id:receiverId,mailboxUid:found.uid,read:false}));
        writes.push(db.ref('messages/'+currentUser.uid+'/'+senderId).set({...base,id:senderId,mailboxUid:currentUser.uid,read:true,copyType:'sent'}));
      }
    });
    if(!writes.length) return alert(tr('recipientsNotFound')+missing.join(', '));
    try{
      await Promise.all(writes);
      if(missing.length) alert(tr('recipientsNotFound')+missing.join(', '));
      else alert(tr('saved'));
      setMessage({recipients:'',subject:'',body:''});await addLog('إرسال رسالة داخلية');
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

  function assistantSearchScore(record,query){
    const q=String(query||'').toLowerCase();
    const words=q.split(/\s+/).filter(w=>w.length>1 && !['عن','من','الى','إلى','في','على','ما','هو','هي','هل','كم','مع','the','and','for','with','what','how','show','tell'].includes(w));
    if(!words.length) return 0;
    const hay=Object.values(record||{}).filter(v=>v===null||['string','number','boolean'].includes(typeof v)).join(' ').toLowerCase();
    return words.reduce((score,w)=>score+(hay.includes(w)?1:0),0);
  }
  function assistantPickRows(rows,query,keys,limit=8){
    const list=Array.isArray(rows)?rows:[];
    const scored=list.map(row=>({row,score:assistantSearchScore(row,query)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    const queryWords=String(query||'').toLowerCase().split(/\s+/).filter(w=>w.length>1 && !['عن','من','الى','إلى','في','على','ما','هو','هي','هل','كم','مع','the','and','for','with','what','how','show','tell'].includes(w));
    const picked=scored.length?scored.slice(0,limit).map(x=>x.row):(queryWords.length===0?list.slice().sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).slice(0,Math.min(4,limit)):[]);
    return picked.map(row=>Object.fromEntries(keys.filter(k=>row&&row[k]!==undefined&&row[k]!==null&&row[k]!=='').map(k=>[k,row[k]])));
  }

    const projectRows=assistantPickRows(projects,question,['code','name','status','projectType','contractNo','purchaseOrderNo','clientCode','clientCodes','vendorCode','vendorCodes','projectManager','startDate','expectedEndDate','actualEndDate','location','deliveryAddress','amount','costBudget','currency','paymentTerms','scope','notes'],10);
    const projectCodes=new Set(projectRows.map(p=>p.code));

  async function sendAssistantQuestion(questionOverride){
    const question=String(questionOverride||assistantInput||'').trim();
    if(!question||assistantBusy) return;
    const history=[...assistantMessages,{role:'user',content:question}];
    setAssistantMessages(history);setAssistantInput('');setAssistantBusy(true);
    try{
      if(typeof window.pestAIAsk!=='function') throw new Error('AI Logic is not ready. Enable Firebase AI Logic and App Check for this Firebase project.');
      const context=buildAssistantContext(question);
      const historyText=history.slice(-8).map(m=>(m.role==='user'?'User':'Assistant')+': '+m.content).join('\n');
      const prompt=[
        'You are the read-only AI assistant embedded in a project, customer/supplier and cash-flow management application.',
        'Answer in the same language as the user; when the user writes Arabic, use clear Egyptian Arabic.',
        'Use only the application context below for facts about records, amounts, balances, dates and statuses. Never invent missing records, numbers, contacts or events.',
        'Explain clearly the difference between contract value, estimated cost budget, registered receivables/payables, and actual settled collections/payments. Do not treat a forecast budget as a payable.',
        'When data is missing or the matching records are incomplete, say what is missing and suggest the relevant screen or record to check.',
        'You are read-only: never claim to have edited, deleted, approved, sent or created anything. You may explain how the user can do it in the app.',
        'Format money with its currency and state when a value is an aggregate. Mention when the available context may not include every matching record.',
        '\nAPPLICATION CONTEXT (only relevant loaded records):\n'+context,
        '\nRECENT CONVERSATION:\n'+historyText,
        '\nLATEST QUESTION:\n'+question
      ].join('\n');
      const answer=await window.pestAIAsk(prompt);
      if(!answer) throw new Error('The AI model returned an empty answer.');
      setAssistantMessages(old=>[...old,{role:'assistant',content:answer}]);
    }catch(err){
      console.error('In-app AI assistant:',err);
      const raw=String(err&&err.message||err||'').slice(0,260);
      const hint=/app.?check|403|permission|unauthenticated/i.test(raw)
        ? (rtl?'يلزم تفعيل Firebase AI Logic وApp Check للتطبيق من لوحة Firebase، ثم تسجيل نطاق الموقع ضمن App Check.':'Enable Firebase AI Logic and App Check in Firebase Console, then register this website domain in App Check.')

      setAssistantMessages(old=>[...old,{role:'assistant',content:hint+'\n'+raw}]);
    }finally{setAssistantBusy(false);}

button onClick={()=>{setSelectedProjectCode(p.code);setTab('projectDetail');}} className="text-blue-700 font-bold">{tr('viewFile')}</button></td></tr>})}{selectedProjectsForCash.length===0&&<tr><td colSpan="8" className="p-4 text-gray-500">{tr('noProjects')}</td></tr>}</tbody></table></div></section></div></details>

            <label className="text-sm font-bold">{rtl?'الأولوية':'Priority'}<select className="block border rounded-lg p-3 w-full mt-1 font-normal" value={projectEvent.priority} onChange={e=>setProjectEvent({...projectEvent,priority:e.target.value})}><option value="low">{rtl?'منخفضة':'Low'}</option><option value="normal">{rtl?'عادية':'Normal'}</option><option value="high">{rtl?'عالية':'High'}</option><option value="urgent">{rtl?'عاجلة':'Urgent'}</option></select></label>

          <details open className="app-collapsible"><summary><span>{tr('timeline')}</span></summary><div className="app-collapsible-body"><section className="bg-white rounded-xl border p-5"><div className="flex flex-wrap justify-between gap-3 mb-3"><h3 className="font-bold">{tr('timeline')}</h3><input className="border rounded-lg p-2" placeholder={tr('reportSearch')} value={eventFilter} onChange={e=>setEventFilter(e.target.value)}/></div><div className="app-list-scroll space-y-3">{events.length===0?<p className="text-gray-500">{tr('noEvents')}</p>:events.slice().reverse().map(ev=><article key={ev.id} className="border-s-4 border-blue-500 bg-gray-50 rounded-lg p-4"><div className="flex flex-wrap justify-between gap-2"><b>{ev.actionName||eventLabel(ev.type)}</b><span className="text-xs text-gray-500">{eventDateLabel(ev.date)}{ev.dueDate?' · '+(rtl?'استحقاق: ':'Due: ')+eventDateLabel(ev.dueDate):''}</span></div><p className="text-sm mt-2">{ev.partyCode?nameOfParty(ev.partyType,ev.partyCode):''} {ev.referenceNo?'· '+ev.referenceNo:''} {ev.responsible?'· '+ev.responsible:''}</p><p className="text-sm mt-1">{ev.quantity?`${ev.quantity} ${ev.unit||''}`:''} {ev.amount?`· ${money(ev.amount)} ${ev.currency||'EGP'}`:''} {ev.paymentMethod?'· '+ev.paymentMethod:''} · {ev.status||''}</p>{ev.note&&<p className="mt-2 text-sm text-gray-700 whitespace-pre-wrap">{ev.note}</p>}<div className="flex flex-wrap items-center justify-between gap-2 mt-2"><div className="text-xs text-gray-500">{ev.createdByName?userIdentity(ev.createdBy,ev.createdByName,true,ev.createdByAvatar||''):null}</div><div className="flex gap-3 text-sm no-print"><button type="button" onClick={()=>editProjectEventRecord(ev)} className="text-blue-700 font-bold">{tr('edit')}</button><button type="button" onClick={()=>deleteProjectEventRecord(ev)} className="text-red-600">{rtl?'حذف':'Delete'}</button></div></div></article>)}</div></section></div></details>
        </div>})()}


        {tab==='messages'&&<div className="space-y-5"><div className="flex flex-wrap items-center justify-between gap-3"><h2 className="font-bold text-xl">{rtl?'المراسلات الداخلية':'Internal messages'}</h2><input className="border rounded-lg p-2" placeholder={tr('reportSearch')} value={messageFilter} onChange={e=>setMessageFilter(e.target.value)}/></div>
          <details open className="app-collapsible"><summary><span>{rtl?'رسالة داخلية جديدة':'New internal message'}</span></summary><div className="app-collapsible-body"><form onSubmit={sendMessage} className="space-y-3"><input required list="active-recipient-list" className="w-full border rounded-lg p-3" placeholder={tr('recipients')} value={message.recipients} onChange={e=>setMessage({...message,recipients:e.target.value})}/><datalist id="active-recipient-list">{userDirectory.filter(u=>u.status==='active' && u.uid!==currentUser.uid).map(u=><option key={u.uid} value={u.username}>{u.fullName} — {u.jobTitle}</option>)}</datalist><input required className="w-full border rounded-lg p-3" placeholder={tr('subject')} value={message.subject} onChange={e=>setMessage({...message,subject:e.target.value})}/><textarea required rows="4" className="w-full border rounded-lg p-3" placeholder={tr('body')} value={message.body} onChange={e=>setMessage({...message,body:e.target.value})}></textarea><button className="bg-blue-600 text-white rounded-lg px-6 py-3 font-bold">{rtl?'إرسال داخل البرنامج':'Send internally'}</button></form></div></details>
          <details className="app-collapsible"><summary><span>{rtl?'إرسال عبر WhatsApp':'Send through WhatsApp'}</span></summary><div className="app-collapsible-body"><p className="text-xs text-gray-500 mb-3">{rtl?'اختر موظفاً أو عميلاً أو مورداً لديه رقم WhatsApp محفوظ، أو أدخل الرقم بكود الدولة. ستفتح المحادثة والنص جاهزاً، ثم تضغط إرسال من WhatsApp.':'Choose an employee, client or vendor with a saved WhatsApp number, or enter a number with country code. WhatsApp opens with a prefilled draft; you press Send there.'}</p><div className="grid grid-cols-1 md:grid-cols-2 gap-3"><select className="border rounded-lg p-3" value={whatsappTarget} onChange={e=>setWhatsappTarget(e.target.value)}><option value="">{rtl?'اختر من جهات الاتصال':'Choose a contact'}</option><optgroup label={rtl?'الموظفون':'Employees'}>{userDirectory.filter(u=>u.status==='active'&&u.uid!==currentUser.uid).map(u=><option key={'u'+u.uid} value={'user:'+u.uid}>{u.fullName||u.username} — {u.whatsapp||'No WhatsApp'}</option>)}</optgroup><optgroup label={rtl?'العملاء':'Clients'}>{clients.map(c=><option key={'c'+c.code} value={'client:'+c.code}>{c.name} — {c.whatsapp||c.mobile||c.phone||'No WhatsApp'}</option>)}</optgroup><optgroup label={rtl?'الموردون':'Vendors'}>{vendors.map(v=><option key={'v'+v.code} value={'vendor:'+v.code}>{v.name} — {v.whatsapp||v.mobile||v.phone||'No WhatsApp'}</option>)}</optgroup></select><input type="tel" className="border rounded-lg p-3" placeholder={rtl?'أو أدخل الرقم الدولي مثال +2010...':'Or enter international number, e.g. +2010...'} value={whatsappManualNumber} onChange={e=>{setWhatsappManualNumber(e.target.value);setWhatsappTarget('');}}/></div><button type="button" onClick={openWhatsAppDraft} className="mt-3 bg-green-600 text-white rounded-lg px-5 py-3 font-bold"><i className="fab fa-whatsapp me-2"></i>{rtl?'فتح WhatsApp بالرسالة':'Open WhatsApp draft'}</button></div></details>
          <details open className="app-collapsible"><summary><span>{rtl?'سجل المحادثات':'Conversation history'}</span></summary><div className="app-collapsible-body"><div className="app-list-scroll">{myMessages.length===0?<p className="text-sm text-gray-500">{tr('noMessages')}</p>:myMessages.slice().sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0)).map(m=>{const outgoing=m.senderUid===currentUser.uid;return <article key={m.id} className={'max-w-3xl rounded-2xl p-4 mb-3 border '+(outgoing?'ms-auto bg-green-50 border-green-200':'me-auto bg-white border-gray-200')}><div className="flex flex-wrap justify-between gap-2"><b className={outgoing?'text-green-800':'text-blue-700'}>{outgoing?<span className="inline-flex items-center gap-2">{rtl?'أنت إلى':'You to'} {userIdentity(m.recipientUid,userDirectory.find(u=>u.uid===m.recipientUid)?.fullName||m.recipientUid,true)}</span>:userIdentity(m.senderUid,m.senderName,true,m.senderAvatar||'')}</b><span className="text-xs text-gray-400">{m.date}</span></div><b className="block mt-2 text-sm">{m.subject}</b><p className="mt-2 text-sm whitespace-pre-wrap">{m.body}</p><div className="flex flex-wrap gap-2 mt-3"><button type="button" onClick={()=>forwardMessage(m)} className="text-xs px-3 py-1 rounded-lg bg-gray-100">{rtl?'إعادة توجيه':'Forward'}</button><button type="button" onClick={()=>convertMessageToTask(m)} className="text-xs px-3 py-1 rounded-lg bg-blue-50 text-blue-700">{rtl?'تحويل إلى مهمة':'Convert to task'}</button><span className="text-xs text-gray-400 self-center">{m.read===true?(rtl?'مقروءة':'Read'):(rtl?'غير مقروءة':'Unread')}</span></div></article>;})}</div></div></details></div>}

        {tab==='tasks'&&<div className="space-y-5"><div className="flex items-center justify-between gap-3"><h2 className="font-bold text-xl">{rtl?'المهام من الرسائل':'Tasks from messages'}</h2><span className="text-sm text-gray-500">{tasks.filter(t=>t.status!=='completed').length} {rtl?'مفتوحة':'open'}</span></div><details open className="app-collapsible"><summary><span>{rtl?'قائمة المهام':'Task list'}</span></summary><div className="app-collapsible-body"><div className="app-list-scroll">{tasks.length===0?<p className="text-sm text-gray-500">{rtl?'لا توجد مهام بعد. حوّل أي رسالة إلى مهمة من شاشة المراسلات.':'No tasks yet. Convert a message into a task from Messages.'}</p>:tasks.slice().sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).map(task=><article key={task.id} className="border rounded-xl p-4 flex flex-col md:flex-row md:items-start gap-3"><div className="flex-1"><div className="font-bold">{task.title}</div><p className="text-sm whitespace-pre-wrap text-gray-600 mt-2">{task.description}</p><div className="mt-2">{task.sourceSenderName?userIdentity(task.sourceSenderUid,task.sourceSenderName,true):null}</div></div><button onClick={()=>updateTaskStatus(task,task.status==='completed'?'open':'completed')} className={'rounded-lg px-4 py-2 text-sm font-bold '+(task.status==='completed'?'bg-gray-100 text-gray-600':'bg-green-600 text-white')}>{task.status==='completed'?(rtl?'إعادة فتح':'Reopen'):(rtl?'إنهاء المهمة':'Complete')}</button></article>)}</div></div></details></div>}

        {tab==='reports'&&<div className="space-y-5">

          <details open className="app-collapsible no-print"><summary><span>{rtl?'فلاتر التقرير':'Report filters'}</span></summary><div className="app-collapsible-body"><section className="bg-white p-4 rounded-xl border grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3 no-print"><select className="border rounded-lg p-3" value={reportType} onChange={e=>{setReportType(e.target.value);setReportEntity('');}}><option value="project">{tr('projectReport')}</option><option value="client">{tr('clientReport')}</option><option value="vendor">{tr('vendorReport')}</option><option value="cash">{tr('cashReport')}</option></select>{reportType==='project'?<select className="border rounded-lg p-3" value={reportEntity} onChange={e=>setReportEntity(e.target.value)}><option value="">{tr('allProjects')}</option>{projects.map(p=><option key={p.code} value={p.code}>{p.name} ({p.code})</option>)}</select>:reportType==='client'?<select className="border rounded-lg p-3" value={reportEntity} onChange={e=>setReportEntity(e.target.value)}><option value="">{tr('choose')}</option>{clients.map(c=><option key={c.code} value={c.code}>{c.name} ({c.code})</option>)}</select>:reportType==='vendor'?<select className="border rounded-lg p-3" value={reportEntity} onChange={e=>setReportEntity(e.target.value)}><option value="">{tr('choose')}</option>{vendors.map(v=><option key={v.code} value={v.code}>{v.name} ({v.code})</option>)}</select>:<span className="text-sm text-gray-500 self-center">{tr('supplierPayments')} / {tr('customerCollections')}</span>}<input className="border rounded-lg p-3" placeholder={tr('reportSearch')} value={reportSearch} onChange={e=>setReportSearch(e.target.value)}/><select className="border rounded-lg p-3" value={reportStatus} onChange={e=>setReportStatus(e.target.value)}><option value="all">{tr('allStatuses')}</option><option value="open">{tr('open')}</option><option value="partial">{tr('partial')}</option><option value="full">{tr('full')}</option><option value="completed">{tr('completed')}</option><option value="notPaid">{tr('notPaid')}</option></select><label className="text-sm">{tr('fromDate')}<input type="date" className="block border rounded-lg p-2 w-full" value={reportFrom} onChange={e=>setReportFrom(e.target.value)}/></label><label className="text-sm">{tr('toDate')}<input type="date" className="block border rounded-lg p-2 w-full" value={reportTo} onChange={e=>setReportTo(e.target.value)}/></label><button onClick={()=>{setReportSearch('');setReportFrom('');setReportTo('');setReportStatus('all');}} className="bg-gray-100 rounded-lg p-3">{tr('clear')}</button></section>
</div></details>
          <details open className="app-collapsible"><summary><span>{tr('reportCenter')}</span></summary><div className="app-collapsible-body"><section className="print-area bg-white rounded-xl border shadow-sm p-5 space-y-4"><div className="flex justify-between items-start gap-4 border-b pb-3"> <div>{companyInfo.logo&&<img src={companyInfo.logo} alt="Company" className="h-12 max-w-40 object-contain mb-2"/>}<h1 className="text-xl font-bold">{companyInfo.name||tr('app')}</h1><p className="text-sm text-gray-500">{companyInfo.taxNumber?tr('taxNumber')+': '+companyInfo.taxNumber:''}</p></div><div className="text-end"><h2 className="font-bold text-lg">{currentReportTitle}</h2><small className="text-gray-500">{new Date().toLocaleDateString(rtl?'ar-EG':'en-US')}</small></div></div>
            {reportType==='project'&&reportProject&&<div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">{[[tr('projectCode'),reportProject.code],[tr('projectName'),reportProject.name],[tr('status'),reportProject.status],[tr('amount'),money(reportProject.amount)+' '+(reportProject.currency||'EGP')],[tr('customers'),(reportProject.clientCodes||[]).map(c=>clients.find(x=>x.code===c)?.name||c).join('، ')],[tr('suppliers'),(reportProject.vendorCodes||[]).map(c=>vendors.find(x=>x.code===c)?.name||c).join('، ')],[tr('manager'),reportProject.projectManager],[tr('location'),reportProject.location]].map(([k,v])=><div key={k} className="border-b pb-2"><small className="block text-gray-500">{k}</small><b>{v||'—'}</b></div>)}</div>}
            {reportType==='client'&&clients.find(x=>x.code===reportEntity)&&(()=>{const c=clients.find(x=>x.code===reportEntity);return <div className="grid grid-cols-2 md:grid-cols-3 gap-2 text-sm">{[[tr('name'),c.name],[tr('code'),c.code],[tr('taxRegistration'),c.taxNumber],[tr('contactPerson'),c.contactPerson],[tr('phone'),c.phone],[tr('mobile'),c.mobile],[tr('email'),c.email],[tr('address'),c.address],[tr('paymentTerms'),c.paymentTerms]].map(([k,v])=><div key={k}><small className="text-gray-500 block">{k}</small><b>{v||'—'}</b></div>)}</div>})()}
            {reportType==='vendor'&&vendors.find(x=>x.code===reportEntity)&&(()=>{const v=vendors.find(x=>x.code===reportEntity);return <div className="grid grid-cols-2 md:grid-cols-3 gap-2 text-sm">{[[tr('name'),v.name],[tr('code'),v.code],[tr('taxRegistration'),v.taxNumber],[tr('contactPerson'),v.contactPerson],[tr('phone'),v.phone],[tr('mobile'),v.mobile],[tr('email'),v.email],[tr('address'),v.address],[tr('paymentTerms'),v.paymentTerms]].map(([k,val])=><div key={k}><small className="text-gray-500 block">{k}</small><b>{val||'—'}</b></div>)}</div>})()}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3"><div className="bg-gray-50 p-3 rounded-lg"><small>{tr('recordCount')}</small><b className="block text-xl">{reportRows.length}</b></div><div className="bg-red-50 p-3 rounded-lg"><small>{tr('totalPayments')}</small><b className="block text-xl">{cashMapText(reportRows.filter(e=>e.type==='supplier_payment' && cashEventSettled(e)))}</b></div><div className="bg-green-50 p-3 rounded-lg"><small>{tr('totalCollections')}</small><b className="block text-xl">{cashMapText(reportRows.filter(e=>e.type==='customer_collection' && cashEventSettled(e)))}</b></div></div>

            <footer className="border-t pt-3 text-xs text-gray-500">{companyInfo.phone||''} {companyInfo.email||''} {companyInfo.address||''}</footer>

        {tab==='settings'&&<div className="space-y-5 max-w-5xl">
          <div><h2 className="font-bold text-xl">{tr('settings')} · {tr('backupSection')}</h2><p className="text-sm text-gray-500 mt-2">{tr('backupHelp')}</p></div>
          <details open className="app-collapsible"><summary><span>{tr('backupSection')}</span></summary><div className="app-collapsible-body"><section className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <article className="bg-white border rounded-xl shadow-sm p-5 flex flex-col gap-3"><div className="w-11 h-11 rounded-lg bg-blue-50 text-blue-700 grid place-items-center"><i className="fas fa-file-code text-xl"></i></div><h3 className="font-bold">{tr('programBackup')}</h3><p className="text-sm text-gray-500 flex-1">{rtl?'تنزيل ملف index.html المنشور حالياً على GitHub.':'Download the currently published index.html from GitHub.'}</p><button disabled={!!backupBusy} onClick={downloadProgramBackup} className="bg-blue-600 text-white rounded-lg px-4 py-3 font-bold">{backupBusy==='program'?tr('loading'):tr('programBackup')}</button></article>

            <article className="bg-white border rounded-xl shadow-sm p-5 flex flex-col gap-3"><div className="w-11 h-11 rounded-lg bg-amber-50 text-amber-700 grid place-items-center"><i className="fas fa-file-excel text-xl"></i></div><h3 className="font-bold">{tr('exportWorkbook')}</h3><p className="text-sm text-gray-500 flex-1">{rtl?'تصدير العملاء والموردين والمشروعات وأحداثها وعروض الأسعار والتحصيلات والمدفوعات في أوراق منفصلة.':'Export clients, vendors, projects, project events, quotations, collections and payments into separate sheets.'}</p><button disabled={!isAdmin||!!backupBusy} onClick={exportWorkbook} className="bg-amber-600 text-white rounded-lg px-4 py-3 font-bold">{tr('exportWorkbook')}</button>{!isAdmin&&<small className="text-amber-700">{tr('adminOnly')}</small>}</article>
          </section></div></details>

              <div className="app-ai-bubble assistant">{rtl?'أهلاً! اسألني عن المشروعات والعملاء والموردين والمستحقات والتحصيلات والمدفوعات أو طريقة استخدام البرنامج. سأجيب من البيانات المتاحة لي داخل النظام.':'Hello! Ask me about projects, customers, suppliers, receivables, collections, payments or how to use the app. I will answer using the available application data.'}</div>
              <div className="grid grid-cols-1 gap-2">
                <button type="button" className="app-ai-suggestion" onClick={()=>sendAssistantQuestion(rtl?'لخص لي موقف التدفقات النقدية والمستحقات':'Summarize cash flow and outstanding balances')}>{rtl?'لخص موقف التدفقات النقدية والمستحقات':'Summarize cash flow and outstanding balances'}</button>
                <button type="button" className="app-ai-suggestion" onClick={()=>sendAssistantQuestion(rtl?'ما هي المشروعات المتأخرة وما أسباب التأخير المسجلة؟':'Which projects are overdue and what delay reasons are recorded?')}>{rtl?'ما المشروعات المتأخرة؟':'Which projects are overdue?'}</button>
                <button type="button" className="app-ai-suggestion" onClick={()=>sendAssistantQuestion(rtl?'اشرح لي كيفية تسجيل مستحق عميل وتحصيله':'Explain how to register a customer receivable and collection')}>{rtl?'كيفية تسجيل مستحق عميل وتحصيله':'How to register a receivable and collection'}</button>
              </div>
            </div>:assistantMessages.map((m,i)=><div key={i} className={'app-ai-bubble '+(m.role==='user'?'user':'assistant')}>{m.content}</div>)}
            {assistantBusy&&<div className="app-ai-bubble assistant text-gray-500"><i className="fas fa-circle-notch fa-spin me-2"></i>{rtl?'جاري التفكير والبحث في البيانات المتاحة...':'Thinking and checking available records...'}</div>}
          </div>
          <form className="app-ai-composer" onSubmit={e=>{e.preventDefault();sendAssistantQuestion();}}>
            <div className="flex items-end gap-2"><textarea value={assistantInput} onChange={e=>setAssistantInput(e.target.value)} placeholder={rtl?'اكتب سؤالك عن البرنامج أو بياناته...':'Ask about the app or its data...'} disabled={!assistantReady||assistantBusy}/><button type="submit" disabled={!assistantReady||assistantBusy||!assistantInput.trim()} className="shrink-0 w-11 h-11 rounded-xl text-white bg-blue-600 disabled:bg-gray-300"><i className={'fas '+(assistantBusy?'fa-spinner fa-spin':'fa-paper-plane')}></i></button></div>
            <p className="text-[10px] text-gray-400 mt-2">{rtl?'المساعد للقراءة والاستفسار فقط. راجع الأرقام المهمة مع الشاشة أو التقرير الأصلي.':'Read-only assistant. Verify important figures against the original screen or report.'}</p>
          </form>
        </section>}
        <button type="button" className="app-ai-launcher" onClick={()=>setAssistantOpen(old=>!old)} aria-label={rtl?'فتح المساعد الذكي':'Open AI assistant'}><i className="fas fa-wand-magic-sparkles text-lg"></i><span>{rtl?'اسأل المساعد':'Ask AI'}</span></button>
      </>}
  </div>;
}

class AppErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={hasError:false,error:null}; }
  static getDerivedStateFromError(error){ return {hasError:true,error}; }
  componentDidCatch(error,info){ console.error('Application render error:',error,info); }
  render(){
    if(this.state.hasError){
      const msg=this.state.error && this.state.error.message ? this.state.error.message : 'Unknown error';
      return <div className="min-h-screen bg-slate-100 flex items-center justify-center p-5"><div className="bg-white max-w-2xl w-full rounded-xl border shadow p-6"><h1 className="font-bold text-red-700 text-xl mb-3">تعذر عرض الشاشة الرئيسية</h1><p className="text-gray-700 mb-3">حدث خطأ أثناء تشغيل الواجهة. أرسل نص الخطأ التالي للدعم الفني:</p><pre className="whitespace-pre-wrap break-words bg-gray-100 rounded p-3 text-sm">{msg}</pre><button className="mt-4 bg-blue-600 text-white rounded px-4 py-2" onClick={()=>window.location.reload()}>إعادة تحميل البرنامج</button></div></div>;
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppErrorBoundary><App/></AppErrorBoundary>);

</script>
<script type="module">
(async()=>{
  try{
    const [{initializeApp},{getAI,getGenerativeModel,GoogleAIBackend},{initializeAppCheck,ReCaptchaEnterpriseProvider}]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/13.2.0/firebase-ai.js'),
      import('https://www.gstatic.com/firebasejs/13.2.0/firebase-app-check.js')
    ]);
    const config=window.PEST_FIREBASE_CONFIG;
    if(!config) throw new Error('Firebase configuration is unavailable.');
    const siteKey=String(window.PEST_RECAPTCHA_ENTERPRISE_SITE_KEY||'').trim();
    if(!siteKey) throw new Error('App Check setup required: register reCAPTCHA Enterprise for the web app and set its public site key in PEST_RECAPTCHA_ENTERPRISE_SITE_KEY.');
    const app=initializeApp(config,'pest-ai-logic');
    initializeAppCheck(app,{provider:new ReCaptchaEnterpriseProvider(siteKey),isTokenAutoRefreshEnabled:true});
    const ai=getAI(app,{backend:new GoogleAIBackend()});
    const model=getGenerativeModel(ai,{model:'gemini-3.8-flash',generationConfig:{temperature:0.2,maxOutputTokens:1400}});
    window.pestAIAsk=async prompt=>{
      const result=await model.generateContent(prompt);
      return result.response.text();
    };
    window.pestAIStatus='ready';
  }catch(error){
    console.error('Firebase AI Logic initialization failed:',error);
    window.pestAIStatus='unavailable';
  }
  window.dispatchEvent(new Event('pest-ai-ready'));
})();
</script>
</body>
</html>
