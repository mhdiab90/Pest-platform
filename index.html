function App(){
  const [lang,setLang] = useState(()=>localStorage.getItem('pestLang') || 'ar');
  const tr = key => words[lang][key] || key;
  const rtl = lang === 'ar';
  const [currentUser,setCurrentUser] = useState(null);
  const [authReady,setAuthReady] = useState(false);
  const [busy,setBusy] = useState(false);
  const [view,setView] = useState('login');
  const [authError,setAuthError] = useState('');
  const [authSuccess,setAuthSuccess] = useState('');
  const registrationInProgress = useRef(false);

  const [login,setLogin] = useState({email:'',password:''});
  const [request,setRequest] = useState({email:'',password:'',username:'',fullName:'',jobTitle:''});
  const [companyInfo,setCompanyInfo] = useState({name:rtl?'اسم الشركة':'Company name',logo:''});
  const [userRequests,setUserRequests] = useState([]);
  const [activeUsers,setActiveUsers] = useState([]);
  const [clients,setClients] = useState([]);
  const [vendors,setVendors] = useState([]);
  const [quotes,setQuotes] = useState([]);
  const [projects,setProjects] = useState([]);
  const [inflows,setInflows] = useState([]);
  const [outflows,setOutflows] = useState([]);
  const [logs,setLogs] = useState([]);
  const [messages,setMessages] = useState([]);
  const [tab,setTab] = useState('dashboard');
  const [showRequests,setShowRequests] = useState(false);
  const [account,setAccount] = useState({type:'client',code:''});
  const [master,setMaster] = useState({type:'client',code:'',name:'',phone:''});
  const [project,setProject] = useState({code:'',name:'',clientCode:'',amount:'',status:'جاري'});
  const [message,setMessage] = useState({recipients:'',subject:'',body:''});
  const [newPassword,setNewPassword] = useState('');
  const [currentPassword,setCurrentPassword] = useState('');
  const [userDirectory,setUserDirectory] = useState([]);
  const [showUserMenu,setShowUserMenu] = useState(false);
  const [showThemeMenu,setShowThemeMenu] = useState(false);
  const [profileSection,setProfileSection] = useState('personal');
  const [profileForm,setProfileForm] = useState({fullName:'',username:'',jobTitle:'',email:''});
  const [profileEmailPassword,setProfileEmailPassword] = useState('');
  const [companyForm,setCompanyForm] = useState({name:'',logo:'',phone:'',email:'',address:'',taxNumber:'',commercialRegister:'',website:''});
  const [excelSummary,setExcelSummary] = useState('');
  const [notificationToast,setNotificationToast] = useState(null);
  const messageIdsRef = useRef(null);
  const [requestFilter,setRequestFilter] = useState('all');
  const [theme,setTheme] = useState(()=>localStorage.getItem('pestTheme') || 'blue');

  useEffect(()=>{
    document.documentElement.lang = lang;
    document.documentElement.dir = rtl ? 'rtl' : 'ltr';
    localStorage.setItem('pestLang',lang);
  },[lang]);

  const themeOptions={blue:{main:'#2563eb',hover:'#1d4ed8',soft:'#eff6ff'},green:{main:'#059669',hover:'#047857',soft:'#ecfdf5'},purple:{main:'#7c3aed',hover:'#6d28d9',soft:'#f5f3ff'},teal:{main:'#0d9488',hover:'#0f766e',soft:'#f0fdfa'},red:{main:'#dc2626',hover:'#b91c1c',soft:'#fef2f2'}};
  useEffect(()=>{
    const chosen=themeOptions[theme] || themeOptions.blue;
    document.documentElement.style.setProperty('--brand',chosen.main);
    document.documentElement.style.setProperty('--brand-hover',chosen.hover);
    document.documentElement.style.setProperty('--brand-soft',chosen.soft);
    localStorage.setItem('pestTheme',theme);
  },[theme]);

  // Company name and logo are intentionally public branding data; writes remain admin-only.
  useEffect(()=>{
    const ref=db.ref('companyInfo');
    const handler=s=>{const value=s.val() || {};setCompanyInfo(value);setCompanyForm({name:value.name || '',logo:value.logo || '',phone:value.phone || '',email:value.email || '',address:value.address || '',taxNumber:value.taxNumber || '',commercialRegister:value.commercialRegister || '',website:value.website || ''});};
    ref.on('value',handler,err=>console.error('Company settings listener:',err));
    return ()=>ref.off('value',handler);
  },[]);

  useEffect(()=>{
    if(currentUser) setProfileForm({fullName:currentUser.fullName || '',username:currentUser.username || '',jobTitle:currentUser.jobTitle || '',email:currentUser.email || ''});
  },[currentUser]);

  // Authentication is checked first. No database read is attempted before a user signs in.
  useEffect(()=>{
    let mounted = true;
    const unsubscribe = auth.onAuthStateChanged(async fbUser=>{
      if(!mounted) return;
      if(registrationInProgress.current) return;
      if(!fbUser){
        setCurrentUser(null);
        setAuthReady(true);
        return;
      }
      try{
        const snap = await db.ref('users/'+fbUser.uid).once('value');
        const profile = snap.val();
        if(!profile){
          const reqSnap = await db.ref('userRequests/'+fbUser.uid).once('value').catch(()=>null);
          const req = reqSnap && reqSnap.val();
          setAuthError(req && req.status==='rejected' ? (rtl?'تم رفض طلب الحساب. تواصل مع المدير.':'Your account request was rejected. Contact the administrator.') : (req ? tr('pendingApproval') : tr('profileMissing')));
          await auth.signOut();
          return;
        }
        const state = String(profile.status || '').toLowerCase();
        if(!['active','نشط','مفعل','enabled'].includes(state)){
          setAuthError(tr('notActive'));
          await auth.signOut();
          return;
        }
        if(fbUser.email && profile.email!==fbUser.email){
          db.ref('users/'+fbUser.uid+'/email').set(fbUser.email).catch(err=>console.warn('Email profile sync:',err));
          profile.email=fbUser.email;
        }
        setCurrentUser({...profile,uid:fbUser.uid,email:fbUser.email || profile.email || ''});
        setAuthError('');
      }catch(err){
        console.error('Load user profile:',err);
        setAuthError(firebaseErrorMessage(err,tr));
        await auth.signOut().catch(()=>{});
      }finally{
        if(mounted){setAuthReady(true);setBusy(false);}
      }
    });
    return ()=>{mounted=false;unsubscribe();};
  },[]);

  // Subscribe only after Firebase Authentication and the active profile are confirmed.
  useEffect(()=>{
    if(!currentUser) return;
    const refs=[];
    const watch=(path,handler)=>{
      const ref=db.ref(path);
      ref.on('value',handler,err=>console.error('Database listener '+path,err));
      refs.push({ref,handler});
    };
    watch('userDirectory',s=>setUserDirectory(toArray(s.val())));
    watch('clients',s=>setClients(toArray(s.val())));
    watch('vendors',s=>setVendors(toArray(s.val())));
    watch('quotes',s=>setQuotes(toArray(s.val())));
    watch('projects',s=>setProjects(toArray(s.val())));
    watch('inflows',s=>setInflows(toArray(s.val())));
    watch('outflows',s=>setOutflows(toArray(s.val())));
    watch('logs',s=>setLogs(toArray(s.val())));
    messageIdsRef.current=null;
    watch('messages/'+currentUser.uid,s=>{
      const next=toArray(s.val());
      if(messageIdsRef.current===null){messageIdsRef.current=new Set(next.map(m=>m.id));}
      else{
        next.forEach(m=>{
          if(!messageIdsRef.current.has(m.id) && m.senderUid!==currentUser.uid && m.read!==true){
            setNotificationToast(m);
          }
        });
        messageIdsRef.current=new Set(next.map(m=>m.id));
      }
      setMessages(next);
    });
    if(currentUser.role==='admin'){
      watch('users',s=>{
        const rawUsers=s.val()||{};const users=toArray(rawUsers);setActiveUsers(users);
        const updates={};
        Object.entries(rawUsers).forEach(([uid,u])=>{
          if(!u) return;
          const linkedToAuth=Boolean(u.uid) || uid===currentUser.uid;
          if(uid===currentUser.uid && !u.uid) updates['users/'+uid+'/uid']=uid;
          // Never expose legacy username-keyed accounts in the recipient directory.
          if(linkedToAuth && Object.prototype.hasOwnProperty.call(u,'password')) updates['users/'+uid+'/password']=null;
          if(linkedToAuth && ['active','نشط','مفعل','enabled'].includes(String(u.status||'').toLowerCase())) updates['userDirectory/'+uid]={uid,username:u.username||'',fullName:u.fullName||'',jobTitle:u.jobTitle||'',status:'active'};
        });
        if(Object.keys(updates).length) db.ref().update(updates).catch(err=>console.warn('Directory sync / password cleanup:',err));
      });
      watch('userRequests',s=>{
        const rawRequests=s.val()||{};setUserRequests(toArray(rawRequests));
        const cleanup={};
        Object.entries(rawRequests).forEach(([key,req])=>{if(req && Object.prototype.hasOwnProperty.call(req,'password')) cleanup['userRequests/'+key+'/password']=null;});
        if(Object.keys(cleanup).length) db.ref().update(cleanup).catch(err=>console.warn('Legacy request password cleanup:',err));
      });
    }else{
      setActiveUsers([]);setUserRequests([]);
    }
    return ()=>refs.forEach(x=>x.ref.off('value',x.handler));
  },[currentUser]);

  function firebaseErrorMessage(err,tfn){
    const code=err && err.code ? err.code : '';
    if(code==='auth/invalid-email') return tfn('invalidEmail');
    if(['auth/user-not-found','auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(code)) return tfn('invalidLogin');
    if(code==='auth/email-already-in-use') return tfn('emailInUse');
    if(code==='auth/weak-password') return tfn('weakPassword');
    if(code==='auth/network-request-failed' || !navigator.onLine) return tfn('network');
    if(code==='PERMISSION_DENIED' || String(err && err.message).toLowerCase().includes('permission')) return tfn('permission');
    return tfn('generic')+(err && err.message ? err.message : 'Unknown error');
  }
  function toArray(obj){return obj ? Object.entries(obj).map(([key,val])=>({...val,id:val && val.id ? val.id : key,uid:val && val.uid ? val.uid : key,_hasAuthUid:Boolean(val && val.uid)})) : [];}
  const isAdmin=currentUser && currentUser.role==='admin';
  const money=n=>new Intl.NumberFormat(rtl?'ar-EG':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0));
  const accepted=s=>['مقبول','approved','Approved'].includes(s);
  const collected=s=>['تم التحصيل','collected','Collected'].includes(s);

  async function handleRegister(e){

  async function updateRequestStatus(req,status){
    if(!isAdmin || !req.uid) return;
    try{
      if(!req._hasAuthUid){
        if(status==='approved') return alert(tr('legacyReapply'));
        await db.ref('userRequests/'+req.id+'/status').set(status==='pending'?'مؤجل':'غير موافق');
        await addLog('تعديل حالة طلب قديم '+req.fullName+' إلى '+status);
        return;
      }
      if(status==='approved'){
        await db.ref('users/'+req.uid).set({uid:req.uid,email:req.email,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,role:'user',status:'active',avatar:'',createdAt:firebase.database.ServerValue.TIMESTAMP});
        await db.ref('userDirectory/'+req.uid).set({uid:req.uid,username:req.username,fullName:req.fullName,jobTitle:req.jobTitle,status:'active'});
      }else{
        const existing=await db.ref('users/'+req.uid).once('value');
        if(existing.exists()) await db.ref('users/'+req.uid+'/status').set('disabled');
        const directoryEntry=await db.ref('userDirectory/'+req.uid).once('value');
        if(directoryEntry.exists()) await db.ref('userDirectory/'+req.uid+'/status').set('disabled');
      }
      await db.ref('userRequests/'+req.uid+'/status').set(status);

  }

  function readImageFile(file,maxBytes=450000){
    return new Promise((resolve,reject)=>{
      if(!file || !file.type.startsWith('image/')) return reject(new Error(rtl?'اختر ملف صورة صالحاً.':'Choose a valid image file.'));
      if(file.size>maxBytes) return reject(new Error(rtl?'حجم الصورة أكبر من الحد المسموح.':'Image exceeds the allowed size.'));
      const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('FILE_READ_ERROR'));reader.readAsDataURL(file);
    });
  }

  async function sendExcelImport(e){
    e.preventDefault();if(!isAdmin) return;
    const file=e.target.elements.excelFile.files[0];if(!file) return alert(tr('noData'));
    try{
      const buffer=await file.arrayBuffer();
      const workbook=XLSX.read(buffer,{type:'array'});
      const updates={};let imported=0;let skipped=0;
      const norm=v=>String(v||'').trim().toLowerCase().replace(/[\s_\-]+/g,'');
      const aliases={type:['type','recordtype','نوع','النوع'],phone:['phone','mobile','telephone','هاتف','الهاتف','تليفون'],clientCode:['clientcode','customercode','كود العميل','كودالعميل'],amount:['amount','value','القيمة','المبلغ'],status:['status','الحالة']};
      const get=(row,keys)=>{for(const [k,v] of Object.entries(row)){if(keys.map(norm).includes(norm(k)) && v!==undefined && v!==null && String(v).trim()!=='') return String(v).trim();}return '';};
      workbook.SheetNames.forEach(sheetName=>{
        const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',raw:false});
        rows.forEach(row=>{
          const typeRaw=get(row,aliases.type).toLowerCase();
          const sheet=norm(sheetName);
          let type=typeRaw;
          if(!type){if(['clients','client','customers','customer','العملاء','عميل'].includes(sheet)) type='client';else if(['vendors','vendor','suppliers','supplier','الموردون','الموردين','مورد'].includes(sheet)) type='vendor';else if(['projects','project','المشروعات','المشاريع','مشروع'].includes(sheet)) type='project';}
          if(['clients','customer','customers','العملاء','عميل'].includes(type)) type='client';
          if(['vendors','supplier','suppliers','الموردون','الموردين','مورد'].includes(type)) type='vendor';
          if(['projects','المشروعات','المشاريع','مشروع'].includes(type)) type='project';
          const codeKeys=type==='project'?['projectcode','code','كودالمشروع','كود']:type==='vendor'?['vendorcode','suppliercode','code','كودالمورد','كود']:['clientcode','customercode','code','كودالعميل','كود'];
          const nameKeys=type==='project'?['projectname','name','اسم المشروع','اسمالمشروع','الاسم','اسم']:type==='vendor'?['vendorname','suppliername','name','اسم المورد','اسمالمورد','الاسم','اسم']:['clientname','customername','name','اسم العميل','اسمالعميل','الاسم','اسم'];
          const code=get(row,codeKeys),name=get(row,nameKeys);
          if(!['client','vendor','project'].includes(type)||!code||!name||/[.#$\[\]/]/.test(code)){skipped++;return;}
          if(type==='client'||type==='vendor'){
            const path=(type==='client'?'clients/':'vendors/')+code;
            updates[path+'/code']=code;updates[path+'/name']=name;updates[path+'/phone']=get(row,aliases.phone);imported++;
          }else{
            const path='projects/'+code;
            const amountText=get(row,aliases.amount).replace(/,/g,'');
            const amount=Number(amountText||0);
            updates[path+'/code']=code;updates[path+'/name']=name;updates[path+'/clientCode']=get(row,aliases.clientCode);updates[path+'/amount']=Number.isFinite(amount)?amount:0;updates[path+'/status']=get(row,aliases.status)||'جاري';imported++;
          }
        });
      });
      if(!imported) return alert(tr('importNoRows'));
      await db.ref().update(updates);await addLog('استيراد بيانات من Excel: '+imported+' سجل');setExcelSummary(tr('importSuccess')+imported+(skipped?' · '+skipped+' skipped':''));e.target.reset();
    }catch(err){console.error('Excel import:',err);alert(firebaseErrorMessage(err,tr));}
  }

  async function sendMessage(e){
    e.preventDefault();
    const names=message.recipients.split(',').map(x=>x.trim()).filter(Boolean);
    if(!names.length || !message.subject.trim() || !message.body.trim()) return alert(tr('noData'));
    const missing=[];const tasks=[];
    names.forEach(name=>{
      const found=userDirectory.find(u=>u.status==='active' && String(u.username||'').toLowerCase()===name.toLowerCase());
      if(!found || !found.uid) missing.push(name);
      else{
        const id=db.ref('messages/'+found.uid).push().key;
        tasks.push(db.ref('messages/'+found.uid+'/'+id).set({id,recipientUid:found.uid,senderUid:currentUser.uid,senderName:currentUser.fullName,subject:message.subject.trim(),body:message.body.trim(),date:new Date().toLocaleString(rtl?'ar-EG':'en-US'),read:false}));
      }
    });
    try{
      await Promise.all(tasks);
      if(missing.length) alert(tr('recipientsNotFound')+missing.join(', '));
      else alert(tr('saved'));
      setMessage({recipients:'',subject:'',body:''});await addLog('إرسال رسالة');
    }catch(err){alert(firebaseErrorMessage(err,tr));}
  }

          {showThemeMenu&&<div className="absolute top-10 right-0 z-50 w-48 bg-white text-slate-800 rounded-xl shadow-xl p-3"><p className="font-bold text-sm mb-2">{tr('chooseTheme')}</p>{Object.keys(themeOptions).map(k=><button key={k} onClick={()=>{setTheme(k);setShowThemeMenu(false);}} className="menu-item flex items-center gap-2"><span className="w-4 h-4 rounded-full" style={{background:themeOptions[k].main}}></span>{tr(themeNames[k])}{theme===k?' ✓':''}</button>)}</div>}
        </div>
        <div className="relative"><button onClick={()=>{setShowUserMenu(!showUserMenu);setShowThemeMenu(false);}} className="flex items-center gap-2 p-1 rounded-lg hover:bg-black/10"><span className="hidden sm:block text-end"><b className="block text-sm">{currentUser.fullName}</b><small className="text-white/75">{currentUser.jobTitle}</small></span><i className="fas fa-cog text-xl"></i></button>
          {showUserMenu&&<div className="absolute top-11 end-0 z-50 w-72 bg-white text-slate-800 rounded-xl shadow-xl border p-3"><div className="flex items-center gap-3 border-b pb-3 mb-2">{currentUser.avatar?<img src={currentUser.avatar} alt="Profile" className="w-12 h-12 rounded-full object-cover"/>:<div className="w-12 h-12 rounded-full bg-blue-600 text-white grid place-items-center font-bold">{(currentUser.fullName||'?').charAt(0)}</div>}<div className="min-w-0"><b className="block truncate">{currentUser.fullName}</b><small className="block text-gray-500 truncate">{currentUser.email}</small><small className="block text-gray-500 truncate">@{currentUser.username} · {currentUser.jobTitle}</small></div></div><p className="text-xs font-bold text-gray-400 px-2 py-1">{tr('accountDetails')}</p><button className="menu-item" onClick={()=>{setTab('profile');setProfileSection('personal');setShowUserMenu(false);}}><i className="fas fa-user ml-2"></i>{tr('personalDetails')}</button><button className="menu-item" onClick={()=>{setTab('profile');setProfileSection('security');setShowUserMenu(false);}}><i className="fas fa-key ml-2"></i>{tr('savePassword')}</button><button className="menu-item" onClick={()=>{setTab('profile');setProfileSection('photo');setShowUserMenu(false);}}><i className="fas fa-image ml-2"></i>{tr('changePhoto')}</button><button className="menu-item" onClick={()=>{setTab('messages');setShowUserMenu(false);}}><i className="fas fa-envelope ml-2"></i>{tr('messages')}</button></div>}
        </div>
        <button onClick={logout} title={tr('logout')} className="p-2 rounded-lg hover:bg-black/10 text-white"><i className="fas fa-sign-out-alt text-xl"></i></button>
      </div>
    </header>
    {notificationToast&&<div className="fixed top-20 end-4 z-[70] bg-white border shadow-xl rounded-xl p-4 max-w-sm"><p className="font-bold">{tr('messageNotice')}</p><p className="text-sm text-gray-600 mt-1">{notificationToast.senderName}: {notificationToast.subject}</p><button onClick={openMessages} className="mt-2 text-sm text-blue-700 font-bold">{tr('openMessages')}</button><button onClick={()=>setNotificationToast(null)} className="ms-4 text-sm text-gray-500">×</button></div>}
    <div className="flex flex-1 flex-col md:flex-row">
      <aside className="w-full md:w-60 bg-white border-gray-200 p-3 space-y-1">
        {nav.map(([id,icon])=><button key={id} onClick={()=>setTab(id)} className={`nav-btn ${tab===id?'active':''} w-full text-start p-3 rounded-lg flex items-center gap-3`}><i className={`fas ${icon} w-5`}></i><span>{tr(id==='userRequests'?'requestsReport':id)}</span></button>)}
      </aside>
      <main className="flex-1 p-4 md:p-6 overflow-auto">
        {tab==='dashboard'&&<div className="space-y-5"><h2 className="font-bold text-xl">{tr('dashboard')}</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            {[[tr('clients'),clients.length,'fa-user-tie'],[tr('vendors'),vendors.length,'fa-truck'],[tr('projects'),projects.length,'fa-diagram-project'],[tr('users'),isAdmin?activeUsers.filter(u=>u._hasAuthUid || u.uid===currentUser.uid).length:'—','fa-users']].map(([label,value,icon])=><div key={label} className="bg-white p-5 rounded-xl border shadow-sm flex justify-between items-center"><div><p className="text-sm text-gray-500">{label}</p><p className="text-2xl font-bold mt-1">{value}</p></div><i className={`fas ${icon} text-2xl text-blue-500`}></i></div>)}
          </div>
          <section className="bg-white p-5 rounded-xl border shadow-sm"><h3 className="font-bold border-b pb-3 mb-3">{tr('activity')}</h3>{logs.length===0?<p className="text-sm text-gray-500">{tr('noLogs')}</p>:logs.slice().reverse().map(x=><div key={x.id} className="py-2 border-b text-sm flex flex-wrap justify-between gap-2"><b className="text-blue-700">{x.user}: {x.action}</b><span className="text-gray-400">{x.time}</span></div>)}</section>
        </div>}

        {tab==='statement'&&<section className="bg-white rounded-xl border shadow-sm p-5 space-y-5"><h2 className="font-bold text-lg">{tr('statement')}</h2><div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
          <label className="text-sm font-bold">{tr('accountType')}<select className="block w-full border rounded-lg p-3 mt-1" value={account.type} onChange={e=>setAccount({type:e.target.value,code:''})}><option value="client">{tr('client')}</option><option value="vendor">{tr('vendor')}</option></select></label>
          <label className="text-sm font-bold">{tr('selectAccount')}<select className="block w-full border rounded-lg p-3 mt-1" value={account.code} onChange={e=>setAccount({...account,code:e.target.value})}><option value="">{tr('choose')}</option>{selectedItems.map(x=><option key={x.code} value={x.code}>{x.name} ({x.code})</option>)}</select></label>
        </div>
        {chosen&&<div className="grid grid-cols-1 md:grid-cols-3 gap-4">{[[tr('due'),totalDue,'blue'],[tr('paid'),totalPaid,'green'],[tr('remaining'),totalDue-totalPaid,'amber']].map(([label,value,color])=><div key={label} className={`bg-${color}-50 border-r-4 border-${color}-600 p-4 rounded`}><p className="text-sm text-gray-500 font-bold">{label}</p><p className="text-2xl font-bold mt-2">{money(value)} EGP</p></div>)}</div>}
        </section>}

        {tab==='master'&&<div className="space-y-5"><h2 className="font-bold text-xl">{tr('master')}</h2><section className="bg-white p-5 rounded-xl border shadow-sm"><form onSubmit={addMaster} className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <select className="border rounded-lg p-3" value={master.type} onChange={e=>setMaster({...master,type:e.target.value})}><option value="client">{tr('client')}</option><option value="vendor">{tr('vendor')}</option></select>
          <input required className="border rounded-lg p-3" placeholder={tr('code')} value={master.code} onChange={e=>setMaster({...master,code:e.target.value})}/>
          <input required className="border rounded-lg p-3" placeholder={tr('name')} value={master.name} onChange={e=>setMaster({...master,name:e.target.value})}/>
          <input className="border rounded-lg p-3" placeholder={tr('phone')} value={master.phone} onChange={e=>setMaster({...master,phone:e.target.value})}/>
          <button className="md:col-span-2 bg-blue-600 text-white rounded-lg p-3 font-bold"><i className="fas fa-plus mx-2"></i>{tr('add')}</button>
        </form></section>
        {isAdmin&&<section className="bg-white p-5 rounded-xl border shadow-sm"><h3 className="font-bold mb-2">{tr('excelImport')}</h3><p className="text-sm text-gray-500 mb-3">{tr('importHelp')}</p><form onSubmit={sendExcelImport} className="flex flex-col md:flex-row gap-3"><input name="excelFile" type="file" accept=".xlsx,.xls,.csv" required className="border rounded-lg p-3 flex-1"/><button className="bg-blue-600 text-white rounded-lg px-5 py-3 font-bold">{tr('importNow')}</button></form>{excelSummary&&<p className="text-green-700 text-sm mt-3">{excelSummary}</p>}</section>}
        <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">{[[tr('clients'),clients],[tr('vendors'),vendors]].map(([label,list])=><section key={label} className="bg-white p-5 rounded-xl border"><h3 className="font-bold border-b pb-2 mb-2">{label}</h3><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-gray-50"><th className="p-2">{tr('code')}</th><th className="p-2">{tr('name')}</th><th className="p-2">{tr('phone')}</th></tr></thead><tbody>{list.map(x=><tr key={x.code} className="border-t"><td className="p-2">{x.code}</td><td className="p-2">{x.name}</td><td className="p-2">{x.phone}</td></tr>)}</tbody></table></div>{list.length===0&&<p className="text-sm text-gray-500 mt-3">{tr('noData')}</p>}</section>)}</div></div>}

        {tab==='projects'&&<div className="space-y-5"><h2 className="font-bold text-xl">{tr('projects')}</h2><section className="bg-white p-5 rounded-xl border"><form onSubmit={addProject} className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input required className="border rounded-lg p-3" placeholder={tr('projectCode')} value={project.code} onChange={e=>setProject({...project,code:e.target.value})}/>
          <input required className="border rounded-lg p-3" placeholder={tr('projectName')} value={project.name} onChange={e=>setProject({...project,name:e.target.value})}/>
          <select className="border rounded-lg p-3" value={project.clientCode} onChange={e=>setProject({...project,clientCode:e.target.value})}><option value="">{tr('choose')}</option>{clients.map(c=><option key={c.code} value={c.code}>{c.name}</option>)}</select>
          <input type="number" min="0" className="border rounded-lg p-3" placeholder={tr('amount')} value={project.amount} onChange={e=>setProject({...project,amount:e.target.value})}/>
          <button className="md:col-span-2 bg-blue-600 text-white rounded-lg p-3 font-bold">{tr('add')}</button>
        </form></section><section className="bg-white p-5 rounded-xl border overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-gray-50"><th className="p-2">{tr('projectCode')}</th><th className="p-2">{tr('projectName')}</th><th className="p-2">{tr('projectClient')}</th><th className="p-2">{tr('amount')}</th><th className="p-2">{tr('status')}</th></tr></thead><tbody>{projects.map(p=><tr key={p.id} className="border-t"><td className="p-2">{p.code}</td><td className="p-2">{p.name}</td><td className="p-2">{clients.find(c=>c.code===p.clientCode)?.name||p.clientCode}</td><td className="p-2">{money(p.amount)}</td><td className="p-2">{p.status}</td></tr>)}</tbody></table>{projects.length===0&&<p className="text-sm text-gray-500 mt-3">{tr('noProjects')}</p>}</section></div>}

        {tab==='messages'&&<div className="space-y-5"><h2 className="font-bold text-xl">{tr('messages')}</h2><section className="bg-white p-5 rounded-xl border"><h3 className="font-bold mb-3">{tr('newMessage')}</h3><form onSubmit={sendMessage} className="space-y-3"><input required list="active-recipient-list" className="w-full border rounded-lg p-3" placeholder={tr('recipients')} value={message.recipients} onChange={e=>setMessage({...message,recipients:e.target.value})}/><datalist id="active-recipient-list">{userDirectory.filter(u=>u.status==='active' && u.uid!==currentUser.uid).map(u=><option key={u.uid} value={u.username}>{u.fullName} — {u.jobTitle}</option>)}</datalist><input required className="w-full border rounded-lg p-3" placeholder={tr('subject')} value={message.subject} onChange={e=>setMessage({...message,subject:e.target.value})}/><textarea required rows="4" className="w-full border rounded-lg p-3" placeholder={tr('body')} value={message.body} onChange={e=>setMessage({...message,body:e.target.value})}></textarea><button className="bg-blue-600 text-white rounded-lg px-6 py-3 font-bold">{tr('send')}</button></form></section>
          <section className="bg-white p-5 rounded-xl border"><h3 className="font-bold border-b pb-3 mb-3">{tr('inbox')}</h3>{myMessages.length===0?<p className="text-sm text-gray-500">{tr('noMessages')}</p>:myMessages.slice().reverse().map(m=><article key={m.id} className="border rounded-lg p-4 mb-3"><div className="flex justify-between gap-2"><b className="text-blue-700">{m.subject}</b><span className="text-xs text-gray-400">{m.date}</span></div><p className="text-xs text-gray-500 mt-1">{m.senderName}</p><p className="mt-3 text-sm whitespace-pre-wrap">{m.body}</p></article>)}</section></div>}

        {tab==='userRequests'&&isAdmin&&<div className="space-y-5"><div className="flex flex-wrap items-center justify-between gap-3"><h2 className="font-bold text-xl">{tr('requestsReport')}</h2><select className="border rounded-lg p-2" value={requestFilter} onChange={e=>setRequestFilter(e.target.value)}><option value="all">{tr('allRequests')}</option><option value="pending">{tr('pendingLabel')}</option><option value="approved">{tr('approvedLabel')}</option><option value="rejected">{tr('rejectedLabel')}</option></select></div><section className="bg-white rounded-xl border shadow-sm overflow-x-auto"><table className="w-full text-sm"><thead className="bg-gray-50"><tr><th className="p-3 text-start">{tr('requestedUser')}</th><th className="p-3 text-start">{tr('requestDate')}</th><th className="p-3 text-start">{tr('requestStatus')}</th><th className="p-3 text-start">{tr('updateStatus')}</th></tr></thead><tbody>{filteredRequests.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(req=><tr key={req.uid} className="border-t align-top"><td className="p-3"><b>{req.fullName}</b><div className="text-gray-500">{req.email}</div><div className="text-gray-500">{req.username} · {req.jobTitle}</div>{!req._hasAuthUid&&<div className="text-amber-700 text-xs mt-1">{tr('legacyRequest')}</div>}</td><td className="p-3 whitespace-nowrap">{req.createdAt?new Date(req.createdAt).toLocaleString(rtl?'ar-EG':'en-US'):'—'}</td><td className="p-3"><span className="rounded-full bg-gray-100 px-2 py-1">{requestStatusLabel(req.status)}</span></td><td className="p-3 min-w-44"><select className="border rounded-lg p-2 w-full" value={requestStatusValue(req.status)} onChange={e=>updateRequestStatus(req,e.target.value)}><option value="pending">{tr('pendingLabel')}</option><option value="approved">{tr('approvedLabel')}</option><option value="rejected">{tr('rejectedLabel')}</option></select></td></tr>)}</tbody></table>{filteredRequests.length===0&&<p className="p-5 text-gray-500">{tr('noData')}</p>}</section></div>}

        {tab==='companySettings'&&isAdmin&&<div className="max-w-3xl space-y-5"><h2 className="font-bold text-xl">{tr('companySettings')}</h2><section className="bg-white p-5 rounded-xl border shadow-sm"><form onSubmit={saveCompany} className="grid grid-cols-1 md:grid-cols-2 gap-4"><label className="block text-sm font-bold md:col-span-2">{tr('companyName')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.name} onChange={e=>setCompanyForm({...companyForm,name:e.target.value})}/></label><label className="block text-sm font-bold">{tr('companyPhone')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.phone} onChange={e=>setCompanyForm({...companyForm,phone:e.target.value})}/></label><label className="block text-sm font-bold">{tr('companyEmail')}<input type="email" className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.email} onChange={e=>setCompanyForm({...companyForm,email:e.target.value})}/></label><label className="block text-sm font-bold">{tr('taxNumber')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.taxNumber} onChange={e=>setCompanyForm({...companyForm,taxNumber:e.target.value})}/></label><label className="block text-sm font-bold">{tr('commercialRegister')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.commercialRegister} onChange={e=>setCompanyForm({...companyForm,commercialRegister:e.target.value})}/></label><label className="block text-sm font-bold">{tr('website')}<input className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.website} onChange={e=>setCompanyForm({...companyForm,website:e.target.value})}/></label><label className="block text-sm font-bold md:col-span-2">{tr('companyAddress')}<textarea rows="2" className="mt-1 w-full border rounded-lg p-3 font-normal" value={companyForm.address} onChange={e=>setCompanyForm({...companyForm,address:e.target.value})}></textarea></label><div className="md:col-span-2"><p className="text-sm font-bold mb-2">{tr('companyLogo')}</p>{companyForm.logo&&<img src={companyForm.logo} alt="Company logo" className="h-24 max-w-56 object-contain border rounded-lg p-2 mb-3"/>}<label className="inline-block bg-gray-100 border rounded-lg px-4 py-2 cursor-pointer">{tr('uploadLogo')}<input type="file" accept="image/*" className="hidden" onChange={uploadCompanyLogo}/></label><button type="button" onClick={()=>setCompanyForm({...companyForm,logo:''})} className="text-red-600 text-sm ms-3">{rtl?'إزالة الشعار':'Remove logo'}</button></div><div className="md:col-span-2"><button className="bg-blue-600 text-white rounded-lg px-6 py-3 font-bold">{tr('save')}</button></div></form></section></div>}

                {tab==='profile'&&<section className="bg-white p-5 rounded-xl border shadow-sm max-w-2xl space-y-5"><h2 className="font-bold text-lg">{tr('profile')}</h2>
          <div className="flex flex-wrap gap-2 border-b pb-3"><button onClick={()=>setProfileSection('personal')} className={`px-3 py-2 rounded-lg ${profileSection==='personal'?'bg-blue-50 text-blue-700 font-bold':'bg-gray-100'}`}>{tr('personalDetails')}</button><button onClick={()=>setProfileSection('photo')} className={`px-3 py-2 rounded-lg ${profileSection==='photo'?'bg-blue-50 text-blue-700 font-bold':'bg-gray-100'}`}>{tr('changePhoto')}</button><button onClick={()=>setProfileSection('security')} className={`px-3 py-2 rounded-lg ${profileSection==='security'?'bg-blue-50 text-blue-700 font-bold':'bg-gray-100'}`}>{tr('savePassword')}</button></div>
          {profileSection==='personal'&&<form onSubmit={saveProfile} className="space-y-3"><label className="block text-sm font-bold">{tr('fullName')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.fullName} onChange={e=>setProfileForm({...profileForm,fullName:e.target.value})}/></label><label className="block text-sm font-bold">{tr('username')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.username} onChange={e=>setProfileForm({...profileForm,username:e.target.value})}/></label><label className="block text-sm font-bold">{tr('jobTitle')}<input required className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.jobTitle} onChange={e=>setProfileForm({...profileForm,jobTitle:e.target.value})}/></label><label className="block text-sm font-bold">{tr('email')}<input required type="email" className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileForm.email} onChange={e=>setProfileForm({...profileForm,email:e.target.value})}/></label>{profileForm.email.toLowerCase()!==String(currentUser.email||'').toLowerCase()&&<label className="block text-sm font-bold">{tr('currentPassword')}<input required type="password" className="mt-1 w-full border rounded-lg p-3 font-normal" value={profileEmailPassword} onChange={e=>setProfileEmailPassword(e.target.value)}/></label>}<button className="bg-blue-600 text-white rounded-lg px-5 py-3 font-bold">{tr('saveProfile')}</button></form>}
          {profileSection==='photo'&&<div className="flex items-center gap-4">{currentUser.avatar?<img src={currentUser.avatar} alt="Profile" className="w-20 h-20 rounded-full object-cover"/>:<div className="w-20 h-20 rounded-full bg-slate-800 text-white grid place-items-center text-2xl">{(currentUser.fullName||'?').charAt(0)}</div>}<label className="inline-block bg-blue-600 text-white rounded-lg px-3 py-2 text-sm cursor-pointer">{tr('changePhoto')}<input type="file" accept="image/*" className="hidden" onChange={uploadAvatar}/></label></div>}
          {profileSection==='security'&&<form onSubmit={changePassword} className="space-y-3"><h3 className="font-bold">{tr('savePassword')}</h3><input type="password" required className="w-full border rounded-lg p-3" placeholder={tr('currentPassword')} value={currentPassword} onChange={e=>setCurrentPassword(e.target.value)}/><input type="password" minLength="6" required className="w-full border rounded-lg p-3" placeholder={tr('newPassword')} value={newPassword} onChange={e=>setNewPassword(e.target.value)}/><button className="bg-green-600 text-white rounded-lg px-5 py-3 font-bold">{tr('savePassword')}</button><button type="button" onClick={sendPasswordReset} className="block text-blue-600 text-sm">{tr('sendReset')}</button></form>}
        </section>}
      </main>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
