/* =====================================================
   3. GENERAL HELPERS
===================================================== */

const timeoutPromise = (promise, milliseconds = 15000) => {
    return Promise.race([
        promise,
        new Promise((_, reject) => {
            setTimeout(() => {
                reject(new Error("REQUEST_TIMEOUT"));
            }, milliseconds);
        })
    ]);
};

const convertSnapshot = (snapshot) => {
    const data = snapshot.val() || {};

    return Object.entries(data).map(([key, value]) => ({
        ...value,
        id: value.id || key
    }));
};

const isAccepted = (status) => {
    return ["مقبول", "approved", "Approved"].includes(status);
};

const isCollected = (status) => {
    return ["تم التحصيل", "collected", "Collected", "paid"].includes(status);
};

const isPaid = (status) => {
    return ["تم السداد", "paid", "Paid"].includes(status);
};

    /* =================================================
       5. DATABASE INITIALIZATION
    ================================================= */

    useEffect(() => {

        let mounted = true;

        async function initializeDatabase() {

            try {

                const adminRef = db.ref("users/admin");

                const adminSnapshot = await timeoutPromise(
                    adminRef.once("value")
                );

                if (!adminSnapshot.exists()) {

                    await timeoutPromise(
                        adminRef.set({
                            username: "admin",
                            password: "Pest@1234",
                            fullName: "مدير النظام",
                            jobTitle: "System Admin",
                            role: "admin",
                            status: "نشط",
                            avatar: ""
                        })
                    );

                }

                if (mounted) {
                    setDbReady(true);
                    setInitError("");
                }

            } catch (error) {

                console.error("Database Initialization:", error);

                if (mounted) {
                    setInitError(
                        error.message === "REQUEST_TIMEOUT"
                            ? t("connectionError")
                            : t("initializationError") + ": " + (error.message || "")
                    );
                    setDbReady(false);
                }
            }
        }

        initializeDatabase();

        return () => {
            mounted = false;
        };

    }, []);



    /* =================================================
       6. LOAD DATABASE DATA AFTER LOGIN
    ================================================= */

    useEffect(() => {

        if (!currentUser) return;

        const subscriptions = [];

        const subscribe = (path, setter, mapper = convertSnapshot) => {

            const ref = db.ref(path);

            const success = (snapshot) => {
                setter(mapper(snapshot));
            };

            const failure = (error) => {
                console.error("Firebase listener error:", path, error);
            };

            ref.on("value", success, failure);

            subscriptions.push({
                ref,
                success,
                failure
            });
        };


        subscribe(
            "companyInfo",
            (value) => setCompanyInfo(
                value || { name: "Company Name", logo: "" }
            ),
            snapshot => snapshot.val()
        );

        subscribe("userRequests", setUserRequests);
        subscribe("users", setActiveUsers);
        subscribe("messages", setMessages);
        subscribe("clients", setClients);
        subscribe("vendors", setVendors);
        subscribe("quotes", setQuotes);
        subscribe("projects", setProjects);
        subscribe("inflows", setInflows);
        subscribe("outflows", setOutflows);
        subscribe("logs", setLogs);


        return () => {

            subscriptions.forEach(item => {
                item.ref.off("value", item.success);
            });

        };

    }, [currentUser]);



    /* =================================================
       7. ACTIVITY LOG
    ================================================= */

    const addLog = async (action, user = currentUser) => {

        try {

            const id = Date.now();

            await db.ref("logs/" + id).set({
                id,
                user: user?.fullName || "System",
                time: new Date().toLocaleTimeString(
                    lang === "ar" ? "ar-EG" : "en-US"

                action
            });

        } catch (error) {
            console.error("Log error:", error);
        }
    };



    /* =================================================
       8. LOGIN - FIXED
    ================================================= */

    const handleLogin = async (e) => {

        e.preventDefault();

        setAuthError("");
        setAuthSuccess("");

        const username = String(loginForm.username || "").trim();
        const password = String(loginForm.password || "");

        if (!username || !password) {
            setAuthError(t("enterAllData"));
            return;
        }

        if (!dbReady) {
            setAuthError(initError || t("initializationError"));
            return;
        }

        setAuthLoading(true);

        try {

            /*
              IMPORTANT:
              Read the database directly.
              Do not depend on activeUsers state,
              because Firebase listeners may not have loaded yet.
            */

            const snapshot = await timeoutPromise(
                db.ref("users").once("value")
            );

            const users = snapshot.val() || {};

            const found = Object.entries(users).find(([key, item]) => {

                const storedUsername = String(
                    item.username || key
                ).trim();

                return storedUsername.toLowerCase()
                    === username.toLowerCase();

            });

            if (!found) {
                setAuthError(t("userNotFound"));
                return;
            }

            const [userKey, user] = found;

            if (String(user.password || "") !== password) {
                setAuthError(t("wrongPassword"));
                return;
            }

            const status = String(user.status || "").toLowerCase();

            if (
                status === "معطل" ||
                status === "disabled" ||
                status === "inactive" ||
                status === "غير نشط"
            ) {
                setAuthError(t("disabledAccount"));
                return;
            }

            const loggedUser = {
                ...user,
                username: user.username || userKey,
                _key: userKey
            };

            // Change application state only after successful verification.

            setCurrentUser(loggedUser);
            setActiveTab("dashboard");
            setViewMode("app");

            setLoginForm({
                username: "",
                password: ""
            });

            await addLog(
                "تسجيل دخول",
                loggedUser
            );

        } catch (error) {

            console.error("LOGIN ERROR:", error);

            if (error.message === "REQUEST_TIMEOUT") {
                setAuthError(t("connectionError"));
            } else if (
                error.code === "PERMISSION_DENIED" ||
                String(error.message).toLowerCase().includes("permission")
            ) {
                setAuthError(t("permissionError"));
            } else if (!navigator.onLine) {
                setAuthError("No internet connection");
            } else {
                setAuthError(
                    t("connectionError") + ": " +
                    (error.message || "Unknown error")
                );
            }

        } finally {
            setAuthLoading(false);
        }

    };



    /* =================================================
       9. NEW USER REQUEST
    ================================================= */

    const handleRequestUser = async (e) => {

        e.preventDefault();

        setAuthError("");
        setAuthSuccess("");

        const fullName = reqForm.fullName.trim();
        const jobTitle = reqForm.jobTitle.trim();
        const username = reqForm.username.trim();
        const password = reqForm.password;

        if (!fullName || !jobTitle || !username || !password) {
            setAuthError(t("enterAllData"));
            return;
        }

        if (/[.#$[\]/]/.test(username)) {
            setAuthError(
                "Username contains invalid Firebase characters"
            );
            return;
        }

        setAuthLoading(true);

        try {

            const snapshot = await timeoutPromise(
                db.ref("users").once("value")
            );

            const users = snapshot.val() || {};

            const existing = Object.entries(users).some(([key, value]) => {
                return String(value.username || key).toLowerCase()
                    === username.toLowerCase();
            });

            if (existing) {
                setAuthError("Username already exists");
                return;
            }

            const requestId = "REQ-" + Date.now();

            const requestData = {
                id: requestId,
                fullName,
                jobTitle,
                username,
                password,
                status: "مؤجل",
                date: new Date().toLocaleDateString()
            };

            await db.ref("userRequests/" + requestId).set(requestData);

            setAuthSuccess(t("requestSent") + " - " + t("waitingApproval"));

            setReqForm({
                fullName: "",
                jobTitle: "",
                username: "",
                password: ""
            });

            setTimeout(() => {
                setViewMode("login");
                setAuthSuccess("");
            }, 3000);

        } catch (error) {

            console.error(error);
            setAuthError(error.message || t("connectionError"));

        } finally {
            setAuthLoading(false);
        }
    };

       10. APPROVE / REJECT USER

            alert(t("enterAllData"));
            return;
        }

        if (/[.#$[\]/]/.test(code)) {
            alert("Invalid project code");
            return;
        }

        try {

            await db.ref("projects/" + code).set({
                ...projectForm,
                code,
                name,
                amount: Number(projectForm.amount || 0),
                date: new Date().toISOString()
            });

            await addLog("إضافة مشروع: " + name);

            setProjectForm({
                code: "",
                name: "",
                clientCode: "",
                amount: "",
                status: "جاري"
            });

            alert(t("saved"));

        } catch (error) {
            console.error(error);
            alert(error.message);
        }

    };



    /* =================================================
       14. MESSAGES
    ================================================= */

    const handleSendMessage = async (e) => {

        e.preventDefault();

        try {

            const recipients = msgForm.recipients
                .split(",")
                .map(x => x.trim())
                .filter(Boolean);

            if (!recipients.length || !msgForm.subject || !msgForm.body) {
                alert(t("enterAllData"));
                return;
            }

            const id = Date.now();

            await db.ref("messages/" + id).set({
                id,
                sender: currentUser.username,
                senderName: currentUser.fullName,
                recipients,
                subject: msgForm.subject,
                body: msgForm.body,
                date: new Date().toLocaleString()
            });

            setMsgForm({
                recipients: "",
                subject: "",
                body: ""
            });

            await addLog("إرسال رسالة");

            alert(t("saved"));

        } catch (error) {
            console.error(error);
            alert(error.message);
        }

    };



    /* =================================================
       15. PROFILE PICTURE
    ================================================= */

    const handleAvatarUpload = (e) => {

        const file = e.target.files?.[0];

        if (!file || !currentUser) return;

        if (file.size > 1024 * 1024) {
            alert("Image must be smaller than 1 MB");
            e.target.value = "";
            return;
        }

        const reader = new FileReader();

        reader.onloadend = async () => {

            try {

                await db.ref(
                    "users/" + (currentUser._key || currentUser.username) + "/avatar"
                ).set(reader.result);

                setCurrentUser(old => ({
                    ...old,
                    avatar: reader.result
                }));

                await addLog("تحديث الصورة الشخصية");

            } catch (error) {
                console.error(error);
                alert(error.message);
            }

        };

        reader.readAsDataURL(file);

    };

                                            className="w-full border p-3 rounded-lg"
                                            value={newMaster.code}
                                            onChange={e =>
                                                setNewMaster({
                                                    ...newMaster,
                                                    code: e.target.value
                                                })
                                            }
                                        />

                                    </div>


                                    <div>

                                        <label className="block text-sm font-bold mb-1">
                                            {t("name")}
                                        </label>

                                        <input
                                            required
                                            className="w-full border p-3 rounded-lg"
                                            value={newMaster.name}
                                            onChange={e =>
                                                setNewMaster({
                                                    ...newMaster,
                                                    name: e.target.value
                                                })
                                            }
                                        />

                                    </div>


                                    <div>

                                        <label className="block text-sm font-bold mb-1">
                                            {t("phone")}
                                        </label>

                                        <input
                                            className="w-full border p-3 rounded-lg"
                                            value={newMaster.phone}
                                            onChange={e =>
                                                setNewMaster({
                                                    ...newMaster,
                                                    phone: e.target.value
                                                })
                                            }
                                        />

                                    </div>


                                    <div className="md:col-span-2">

                                        <button
                                            type="submit"
                                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold"
                                        >
                                            <i className="fas fa-plus ml-2"></i>
                                            {t("add")}
                                        </button>

                                    </div>

                                </form>

                            </div>


                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">

                                <div className="bg-white p-5 rounded-xl border">

                                    <h3 className="font-bold mb-3 border-b pb-2">
                                        {t("clients")}
                                    </h3>

                                    <div className="overflow-x-auto">

                                        <table className="w-full text-sm">

                                            <thead>
                                                <tr className="bg-gray-50">
                                                    <th className="p-2">{t("code")}</th>
                                                    <th className="p-2">{t("name")}</th>
                                                    <th className="p-2">{t("phone")}</th>
                                                </tr>
                                            </thead>

                                            <tbody>

                                                {clients.map(item => (

                                                    <tr key={item.code} className="border-t">
                                                        <td className="p-2">{item.code}</td>
                                                        <td className="p-2">{item.name}</td>
                                                        <td className="p-2">{item.phone}</td>
                                                    </tr>

                                                ))}

                                            </tbody>

                                        </table>

                                        {clients.length === 0 && (
                                            <p className="text-gray-500 text-sm py-4">
                                                {t("noData")}
                                            </p>
                                        )}

                                    </div>

                                </div>


                                <div className="bg-white p-5 rounded-xl border">

                                    <h3 className="font-bold mb-3 border-b pb-2">
                                        {t("vendors")}
                                    </h3>

                                    <div className="overflow-x-auto">

                                        <table className="w-full text-sm">

                                            <thead>
                                                <tr className="bg-gray-50">
                                                    <th className="p-2">{t("code")}</th>
                                                    <th className="p-2">{t("name")}</th>
                                                    <th className="p-2">{t("phone")}</th>
                                                </tr>
                                            </thead>

                                            <tbody>

                                                {vendors.map(item => (

                                                    <tr key={item.code} className="border-t">
                                                        <td className="p-2">{item.code}</td>
                                                        <td className="p-2">{item.name}</td>
                                                        <td className="p-2">{item.phone}</td>
                                                    </tr>

                                                ))}

                                            </tbody>

                                        </table>

                                        {vendors.length === 0 && (
                                            <p className="text-gray-500 text-sm py-4">
                                                {t("noData")}
                                            </p>
                                        )}

                                    </div>

                                </div>

                            </div>

                        </div>

                    )}



                    {/* PROJECTS */}

                    {activeTab === "projects" && (

                        <div className="space-y-5">

                            <h2 className="text-xl font-bold">
                                {t("projects")}
                            </h2>


                            <div className="bg-white p-5 rounded-xl border shadow-sm">

                                <h3 className="font-bold border-b pb-3 mb-4">
                                    {t("add")} {t("projects")}
                                </h3>

                                <form
                                    onSubmit={handleAddProject}
                                    className="grid grid-cols-1 md:grid-cols-2 gap-4"
                                >

                                    <input
                                        required
                                        placeholder={t("projectCode")}
                                        className="border p-3 rounded-lg"
                                        value={projectForm.code}
                                        onChange={e =>
                                            setProjectForm({
                                                ...projectForm,
                                                code: e.target.value
                                            })
                                        }
                                    />

                                    <input
                                        required
                                        placeholder={t("projectName")}
                                        className="border p-3 rounded-lg"
                                        value={projectForm.name}
                                        onChange={e =>
                                            setProjectForm({
                                                ...projectForm,
                                                name: e.target.value
                                            })
                                        }
                                    />

                                    <select
                                        className="border p-3 rounded-lg"
                                        value={projectForm.clientCode}
                                        onChange={e =>
                                            setProjectForm({
                                                ...projectForm,
                                                clientCode: e.target.value
                                            })
                                        }
                                    >

                                        <option value="">
                                            {t("selectClient")}
                                        </option>

                                        {clients.map(client => (
                                            <option key={client.code} value={client.code}>
                                                {client.name}
                                            </option>
                                        ))}

                                    </select>


                                    <input
                                        type="number"
                                        min="0"
                                        placeholder={t("projectAmount")}
                                        className="border p-3 rounded-lg"
                                        value={projectForm.amount}
                                        onChange={e =>
                                            setProjectForm({
                                                ...projectForm,
                                                amount: e.target.value
                                            })
                                        }
                                    />


                                    <div className="md:col-span-2">

                                        <button
                                            type="submit"
                                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold"
                                        >
                                            <i className="fas fa-plus ml-2"></i>
                                            {t("add")}
                                        </button>

                                    </div>

                                </form>

                            </div>


                            <div className="bg-white p-5 rounded-xl border shadow-sm overflow-x-auto">

                                <h3 className="font-bold border-b pb-3 mb-4">
                                    {t("projects")}
                                </h3>

                                <table className="w-full text-sm">

                                    <thead>
                                        <tr className="bg-gray-50">
                                            <th className="p-3">{t("projectCode")}</th>
                                            <th className="p-3">{t("projectName")}</th>
                                            <th className="p-3">{t("projectClient")}</th>
                                            <th className="p-3">{t("amount")}</th>
                                            <th className="p-3">{t("status")}</th>
                                        </tr>
                                    </thead>

                                    <tbody>

                                        {projects.map(project => (

                                            <tr key={project.id} className="border-t">

                                                <td className="p-3">{project.code}</td>

                                                <td className="p-3">{project.name}</td>

                                                <td className="p-3">
                                                    {clients.find(c => c.code === project.clientCode)?.name || project.clientCode}
                                                </td>

                                                <td className="p-3">
                                                    {formatMoney(project.amount)}
                                                </td>

                                                <td className="p-3">
                                                    {project.status}
                                                </td>

                                            </tr>

                                        ))}

                                    </tbody>

                                </table>

                                {projects.length === 0 && (
                                    <p className="text-gray-500 text-sm py-4">
                                        {t("noProjects")}
                                    </p>
                                )}

                            </div>

                        </div>

                    )}



                    {/* MESSAGES */}

                    {activeTab === "messages" && (

                        <div className="space-y-5">

                            <h2 className="text-xl font-bold">
                                {t("messages")}
                            </h2>


                            {currentUser.role === "admin" && (

                                <div className="bg-white p-5 rounded-xl border shadow-sm">

                                    <h3 className="font-bold border-b pb-3 mb-4">
                                        {t("newMessage")}
                                    </h3>

                                    <form
                                        onSubmit={handleSendMessage}
                                        className="space-y-3"
                                    >

                                        <input
                                            required
                                            placeholder={t("recipients")}
                                            className="w-full border p-3 rounded-lg"
                                            value={msgForm.recipients}
                                            onChange={e =>
                                                setMsgForm({
                                                    ...msgForm,
                                                    recipients: e.target.value
                                                })
                                            }
                                        />

                                        <input
                                            required
                                            placeholder={t("subject")}
                                            className="w-full border p-3 rounded-lg"
                                            value={msgForm.subject}
                                            onChange={e =>
                                                setMsgForm({
                                                    ...msgForm,
                                                    subject: e.target.value
                                                })
                                            }
                                        />

                                        <textarea
                                            required
                                            rows="4"
                                            placeholder={t("messageBody")}
                                            className="w-full border p-3 rounded-lg"
                                            value={msgForm.body}
                                            onChange={e =>
                                                setMsgForm({
                                                    ...msgForm,
                                                    body: e.target.value
                                                })
                                            }
                                        ></textarea>

                                        <button
                                            type="submit"
                                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold"
                                        >
                                            <i className="fas fa-paper-plane ml-2"></i>
                                            {t("send")}
                                        </button>

                                    </form>

                                </div>

                            )}


                            <div className="bg-white p-5 rounded-xl border shadow-sm">

                                <h3 className="font-bold border-b pb-3 mb-4">
                                    {t("inbox")}
                                </h3>

                                <div className="space-y-3">

                                    {myMessages.length === 0 && (

                                        <p className="text-gray-500">
                                            {t("noMessages")}
                                        </p>

                                    )}

                                    {[...myMessages].reverse().map(msg => (

                                        <div
                                            key={msg.id}
                                            className="border rounded-lg p-4"
                                        >

                                            <div className="flex justify-between flex-wrap gap-2">

                                                <h4 className="font-bold text-blue-700">
                                                    {msg.subject}
                                                </h4>

                                                <span className="text-xs text-gray-500">
                                                    {msg.date}
                                                </span>

                                            </div>

                                            <p className="text-xs text-gray-500 mt-2">
                                                {msg.senderName || msg.sender}
                                            </p>

                                            <p className="mt-3 text-sm whitespace-pre-wrap">
                                                {msg.body}
                                            </p>

                                        </div>

                                    ))}

                                </div>

                            </div>

                        </div>

                    )}



                    {/* PROFILE */}

                    {activeTab === "profile" && (

                        <div className="bg-white p-5 md:p-6 rounded-xl border shadow-sm max-w-xl space-y-6">

                            <h3 className="font-bold text-lg border-b pb-3">
                                {t("profile")}
                            </h3>


                            <div className="flex items-center gap-4">

                                {currentUser.avatar ? (

                                    <img
                                        src={currentUser.avatar}
                                        alt="Avatar"
                                        className="w-20 h-20 rounded-full object-cover border-2 border-blue-600"
                                    />

                                ) : (

                                    <div className="w-20 h-20 rounded-full bg-slate-800 text-white flex items-center justify-center text-2xl font-bold">
                                        {currentUser.fullName?.charAt(0)}
                                    </div>

                                )}

                                <div>

                                    <p className="font-bold">
                                        {currentUser.fullName}
                                    </p>

                                    <p className="text-sm text-gray-500">
                                        {currentUser.jobTitle}
                                    </p>

                                    <label className="inline-block mt-3 bg-blue-600 text-white text-sm px-4 py-2 rounded-lg font-bold cursor-pointer">

                                        {t("changePhoto")}

                                        <input
                                            type="file"
                                            accept="image/*"
                                            className="hidden"
                                            onChange={handleAvatarUpload}
                                        />

                                    </label>

                                </div>

                            </div>


                            <div className="border-t pt-4">

                                <h4 className="font-bold mb-3">
                                    {t("userInfo")}
                                </h4>

                                <p className="text-sm text-gray-600">
                                    {t("username")}: {currentUser.username}
                                </p>

                                <p className="text-sm text-gray-600 mt-2">
                                    {t("jobTitle")}: {currentUser.jobTitle}
                                </p>

                            </div>


                            <form
                                onSubmit={updatePassword}
                                className="space-y-3 border-t pt-4"
                            >

                                <h4 className="font-bold">
                                    {t("changePassword")}
                                </h4>

                                <input
                                    type="password"
                                    minLength="4"
                                    required
                                    placeholder={t("newPassword")}
                                    className="w-full border p-3 rounded-lg"
                                    value={profilePass}
                                    onChange={e =>
                                        setProfilePass(e.target.value)
                                    }
                                />

                                <button
                                    type="submit"
                                    className="bg-green-600 text-white px-5 py-3 rounded-lg font-bold"
                                >
                                    {t("save")}
                                </button>

                            </form>

                        </div>

                    )}


                </main>

            </div>

        </div>

    );

}



/* =====================================================
   20. START APPLICATION
===================================================== */

const rootElement = document.getElementById("root");

const root = ReactDOM.createRoot(rootElement);

root.render(<App />);

</script>

</body>
</html>
